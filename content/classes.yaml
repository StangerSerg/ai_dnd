# Классы беты: id — ключ записи (хранится на персонаже как class_id).
# skills — id скиллов из content/skills.yaml; целостность проверяется загрузчиком.
classes:
  fighter: {skills: [protect]}
  rogue: {skills: [stealth]}
  cleric: {skills: [cure_wounds]}
  ranger: {skills: []}
  # Корабли сценария «Черви: Десперадос»: id совпадает с именем файла персонажа.
  # Умения реализованы скиллами protect/stealth из content/skills.yaml;
  # тендер без боевых скиллов — его сила в запасе запчастей и ракет.
  ship_striker: {skills: [protect], label: Штурмовик}
  ship_scout: {skills: [stealth], label: Разведчик}
  ship_tender: {skills: [], label: Тендер}