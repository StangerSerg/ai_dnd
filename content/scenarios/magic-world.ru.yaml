lore:
  - id: three_continents
    title: "Три материка"
    text: "Огненный материк занимает центр мира; длинный Ледяной тянется к полюсу; небольшой Водный лежит за океаном. Все жители знакомы с магией огня, воздуха и воды."
  - id: stones_and_weather
    title: "Камни и погода"
    text: "Обитатели замечают: крупные потрясения отзываются бурями и дрожью земли. Точную связь с камнями силы ещё предстоит установить."

