# Локальная адаптация magic_world для v0.2. Ритуалы, драконы, армии и
# обучение магии ведутся через note_fact; механических эффектов им не приписывать.
scenario:
  title: "Магический мир"
  language: ru
  ruleset: magic-world@1
  sheet_template: magic-world@1
  class_pack: magic-world
  items_enabled: false
  start_scene: crossroads
  synopsis: >-
    Мир трёх материков пронизан магией. Лукан открыто добивается господства через
    войну и подчинение драконов; Фростмар скрывает такой же замысел за заботой о
    равновесии и изучением камней силы. Герои могут выполнять поручения обоих,
    отказаться, расследовать их цели и обратиться к Кирину. Разговоры с нагами,
    орками и драконами, наблюдение камня и противоречивые просьбы магов дают
    независимые улики. Четыре финала условны: господство Лукана, господство
    Фростмара, изгнание обоих или гибель мира при столкновении у камней.
    Каждый финал открыть только после проверки фактов в его dm_notes; доступный
    переход сам по себе исхода не устанавливает. При выборе исхода запиши
    ending_committed с его id и раскрой только соответствующий handout эпилога.
    После ending_committed другие исходы закрыты; повторный визит не меняет
    результат. Не назначать автоматический
    приоритет пересекающимся ритуалам: точное время их успеха автор не определил.
    Огненная стрела и Ледяной ветер — стартовые точечные атаки. Ледяной щит —
    постоянная защита +2 AC, уже учтённая в карточке, а не одно отражение удара.
    Водное лечение — третья активная стартовая форма по решению пользователя:
    вне боя лечит себя или союзника через доступный навык без ограничения применений. Щит — пассивная защита, не четвёртая активная
    форма. Остальные заклинания и замена одного из трёх изученных — в бэклоге.
  tone: >-
    Волшебное приключение о свободе мира. Два покровителя убедительны каждый
    по-своему; улики возникают из жизни обитателей, а не из готового разоблачения.
    Избегай мечей, воинов и технических объяснений магии. В конфликте всегда
    показывай возможность разговора, отступления и сдачи до начала боя.

scenes:
  - id: crossroads
    title: "Перекрёсток трёх материков"
    read_aloud: >-
      Над морской переправой сияют три разных горизонта: огненные горы в центре,
      узкая полоса льдов на севере и зелёные воды на западе. Здесь даже ветер
      отзывается на слова магов. Путники обмениваются вестями с дальних берегов.
    dm_notes: >-
      Объясни старт: всем доступны огонь, воздух и вода; три активные формы —
      Огненная стрела, Ледяной ветер (воздух, холодный урон) и Водное лечение.
      Стартовые атаки берутся из карточки; Ледяной щит пассивен и уже учтён
      в AC. Вне боя водное лечение доступно через cast_cure_wounds1 для себя
      или союзника без ограничения применений. Не лечи
      устно или автоматически от ночлега без реального действия. Герои свободны
      брать поручения обоих магов и исследовать мир без службы. Через note_fact
      фиксируй обещания, сведения, кому их сообщили и выбор; ни один переход сам
      не запускает ритуал или войну. Башня Фростмара показана лишь как маршрут
      переправы: автор не указал её координаты. У Лукана башню не придумывай.
    npcs: [lucan, frostmar]
    handouts: [starting_magic]
    exits: [lucan_camp, frostmar_tower, fire_port, water_port, ice_shore]

  - id: lucan_camp
    title: "Приём Лукана"
    read_aloud: >-
      У костра без топлива есть место для посетителей. Отсюда открывается
      вид на Огненный материк и переправу к Водному.
    dm_notes: >-
      Поручение: добыть десять туш морских коров якобы для любимого лакомства
      красного дракона. Это ложь; Лукан хочет оставить кровь у берега и внушить
      Кирину подозрение к оркам. Можно отказаться или расспросить жителей.
      Раскрой job_cows при реальной выдаче поручения; остальные job_* раскрывай
      только после соответствующих слов Лукана, не все при первом визите.
      Позже Лукан предлагает одолеть вождя Красного Черепа, сообщает о якобы
      агрессии нагов и просит героев вместе с орками вторгнуться на нагский
      берег; после этого зовёт наблюдать их и докладывать красному дракону.
      От каждого поручения можно отказаться. Если он действительно послал
      Кирину весть о нападении орков, а красному дракону — о зависти Кирина,
      запиши эти сообщения отдельно. После
      ранения двух драконов посылает героев на ледяной материк, скрывая враждебность
      местных. Если герои расскажут об амулете Фростмара, он попросит его украсть:
      открой clue_lucan_amulet и запиши услышанное. Не повторяй уже выданные задания.
      После реальной битвы двух драконов и начатого ритуала Лукан может
      подчинить обоих; запиши lucan_bound_two и раскрой lucan_two_dragons
      лишь если это действительно произошло. До этого контроль не объявляй.
    npcs: [lucan]
    clues: [clue_lucan_amulet]
    handouts: [job_cows, job_chief, job_naga_raid, job_naga_watch, job_ice, lucan_two_dragons, lucan_white_dragon]
    exits: [crossroads, fire_port, water_port, orc_council, ocean_watch, ice_shore]

  - id: frostmar_tower
    title: "Башня Фростмара"
    read_aloud: >-
      В башне тихо, а в окнах меняется цвет далёких облаков. Столы заставлены
      заметками о камнях и далёких берегах.
    dm_notes: >-
      Фростмар кажется защитником мира. Он просит изучить быт нагов, затем
      получить у Кирина безопасный осколок для исследования. Объясняет, что не
      покидает башню, чтобы не возмущать магию; истинный мотив — не вызвать
      подозрения Кирина. Позже предлагает расспросить других оркских вождей,
      наблюдать камень под вулканом и испытать амулет ледяных тварей. Он хочет
      прямой власти над магией через камни. Ни осколок, ни амулет не являются
      механическими предметами v0.2: фиксируй передачу и владение через note_fact.
      После изучения камня он временно говорит, что новых поручений нет и
      можно спросить Лукана; в это время изучает осколок и готовит артефакт.
      Записывай подготовку только при реальном получении и исследовании
      осколка, а не при проходе сцены. Амулет он предлагает после провокации
      нагов как мнимую защиту «если наги нападут».
      Если герои говорят о замысле Лукана, Фростмар предупреждает, что война
      разбудит камни. Его последующий ввод тварей противоречит этому предупреждению.
      Раскрой job_naga_culture при первой просьбе; остальные job_* — только
      после соответствующих разговоров, по мере действительных поручений.
    npcs: [frostmar]
    handouts: [job_naga_culture, job_shard, job_stone, job_amulet]
    exits: [crossroads, water_port, orc_council, volcano_approach, ice_shore, stone_approach]

  - id: fire_port
    title: "Порт Огненного материка"
    read_aloud: >-
      За доками поднимаются джунгли, дальше — пустыня и дымящий вулкан. Орки,
      гоблины и огненные элементали обмениваются новостями магическими знаками.
    dm_notes: >-
      Большой центральный материк держится благодаря красному дракону: он
      сдерживает большую войну. Виверны теснят орков. Стычки кланов пока малы.
      Крупное столкновение отражается на камнях и погоде нарративно, без бросков
      и урона движка. Не превращай дорожное население в обязательный бой.
    exits: [crossroads, lucan_camp, jungle_route, orc_council, red_dragon_aerie, water_port]

  - id: jungle_route
    title: "Джунгли и пустынный тракт"
    read_aloud: >-
      Зелёные заросли уступают сухому ветру. Над границей земель кружит виверна;
      путники расходятся по укрытиям, пока она не скрывается за склоном.
    dm_notes: >-
      Виверна и большие стаи — угроза маршрута, а не runtime encounter. Можно
      укрыться, договориться с проводниками или отступить. Запиши наблюдение,
      если герои связывают вытеснение орков с распрями кланов.
    checks:
      - id: trace_wyvern
        description: "Необязательный осмотр следов виверны; разговор с орками даёт основную улику без проверки."
        skill: survival
        dc: 12
        on_success: {text: "Следы ведут от занятых вивернами пастбищ к оркским стоянкам; заметен безопасный обход."}
        on_failure: {text: "Следы обрываются у сухого русла. Можно спросить местных или пройти другой тропой без потери хитов."}
    exits: [fire_port, orc_council, red_skull_camp, volcano_approach]

  - id: orc_council
    title: "Совет оркских кланов"
    read_aloud: >-
      Вожди спорят у карты перевалов: каждый хочет первым повести своих против
      виверн. При упоминании войны с нагами они переглядываются с недоумением.
    dm_notes: >-
      Открой clue_orc_dispute после разговора с любым вождём: кланы спорят о
      первенстве в походе против виверн, не готовят морское вторжение. Запиши
      orc_dispute_investigated. Красный дракон удерживает стычки в пределах,
      безопасных для камней. Герои могут примирять, наблюдать или идти к Красному
      Черепу без поручения Лукана. Не требуй проверки для основной улики.
    npcs: [orc_elder]
    clues: [clue_orc_dispute]
    exits: [fire_port, jungle_route, red_skull_camp, volcano_approach, frostmar_tower]

  - id: red_skull_camp
    title: "Стоянка Красного Черепа"
    read_aloud: >-
      На земле виден огненный круг для переговоров и поединков. У стоянки
      остаются следы недавних оркских собраний; гости могут выяснить, кто здесь.
    dm_notes: >-
      Лукан хочет послушного вождя сильнейшего клана. Герои могут раскрыть
      обман, договориться или отступить. Вызов на магический поединок — только
      по осознанному выбору. Главарь смертен: если бой доходит до 0 HP, не
      объявляй его нелетальным задним числом. Сдача должна произойти до начала
      боя и фиксироваться фактом. Исход разговора/поединка не делает весь клан
      рабом Лукана автоматически. Если боец chief_duel погиб, запиши это и
      вызови kill_npc для red_skull_chief; не показывай его снова живым.
    npcs: [red_skull_chief]
    encounters: [chief_duel]
    exits: [orc_council, jungle_route, lucan_camp]

  - id: red_dragon_aerie
    title: "Гнездо красного дракона"
    read_aloud: >-
      Над вулканическим плато висит огромный красный дракон. Он слушает доклад,
      не отрывая взгляда от берегов, где ещё сохраняется хрупкий мир.
    dm_notes: >-
      Красный дракон удерживает горячие народы от большой войны. Если герои
      докладывают о нагских перемещениях, запиши содержание доклада и кому он
      дошёл; это не доказательство нападения. Показания нагов и орков дают ему
      повод проверить версию Лукана. При реальном разговоре дракон может
      рассказать, что Лукан предупреждал его о зависти Кирина; раскрой
      clue_red_dragon_message, если весть действительно была. Не запускай
      бой с драконом через encounter.
    npcs: [red_dragon]
    clues: [clue_red_dragon_message]
    handouts: [ocean_battle_witness, lucan_two_dragons]
    exits: [fire_port, jungle_route, volcano_approach, ocean_watch]

  - id: volcano_approach
    title: "Склон вулкана"
    read_aloud: >-
      В трещинах светится жар, а над тропой дрожит воздух. В глубине пещеры
      виден свет, не похожий на пламя.
    dm_notes: >-
      Гигантские саламандры питаются силой камней; исходник говорит, что их
      невозможно победить. Это препятствие для обхода, не encounter. Можно
      дождаться их ухода, обойти по уступу, уйти и вернуться. Не требуй
      единственного успешного чека для доступа к наблюдению.
    exits: [jungle_route, orc_council, red_dragon_aerie, stone_cavern, stone_approach]

  - id: stone_cavern
    title: "Камень под вулканом"
    read_aloud: >-
      За уступом пульсирует камень силы. Его свет меняется вслед за далёким
      гулом живых поселений; у выхода слышно дыхание огромных саламандр.
    dm_notes: >-
      Наблюдение без броска раскрывает clue_stone_balance: камень связан с
      жизнью материка и климатом всего мира; мелкие стычки почти не тревожат
      его, большая война опасна. Запиши force_stone_observed. Это ещё не
      доказательство тайного плана Фростмара. Саламандр можно обойти; не
      предлагай невозможную победу и не превращай камень в автоматический инструмент.
    checks:
      - id: read_resonance
        description: "Необязательное изучение тонких изменений света после видимой всем реакции камня."
        skill: arcana
        dc: 13
        on_success: {text: "Свет усиливается при далёком общем крике и стихает, когда поселения успокаиваются: дополнительная подробность наблюдения."}
        on_failure: {text: "Тонкий рисунок ускользает, но связь камня с жизнью материка видна и без точного чтения."}
    clues: [clue_stone_balance]
    handouts: [frostmar_ritual_seen, frostmar_ritual_done, mages_clash_seen]
    exits: [volcano_approach, stone_approach]

  - id: water_port
    title: "Берег Водного материка"
    read_aloud: >-
      Невысокие острова лежат среди прозрачных проливов. В воде движутся морские
      коровы, скаты и большие черепахи; дальше видны владения нагов.
    dm_notes: >-
      На водном материке живут также морские змеи; в прилегающем океане акулы
      и медузы. Лукан просит десять туш морских коров под ложным предлогом.
      Охота — моральный выбор и нарративный факт, не лут или бой. Нагам она
      безразлична; Кирин может увидеть кровавый берег. Отказ и наблюдение
      оставляют путь к его разговору открытым.
    exits: [crossroads, fire_port, cow_bay, naga_market, naga_border, crystal_lagoon, kirin_sanctuary]

  - id: cow_bay
    title: "Бухта морских коров"
    read_aloud: >-
      Морские коровы неторопливо поднимаются к поверхности. Следы на берегу
      показывают, что сюда приходят и охотники, и наблюдатели.
    dm_notes: >-
      Десять туш — просьба Лукана, не обязательный квест. Если герои приняли
      её и действительно добыли туши, запиши cows_hunted с количеством;
      последующее использование крови Луканом — отдельный факт при реальном
      действии. Здесь нет encounter и автоматического вознаграждения.
    exits: [water_port, naga_market, kirin_sanctuary]

  - id: naga_market
    title: "Поселение нагов"
    read_aloud: >-
      Наги чинят каналы, торгуются и спорят о границах провинций. Их слова
      возвращаются к соседям и местным законам, а не к походу через океан.
    dm_notes: >-
      Через обычные разговоры и мелкую помощь раскрой clue_naga_life и запиши
      nagas_studied. Наги строго охраняют границы, но не планируют первого
      нападения на Огненный материк. Охота на коров их почти не волнует.
      Наг может показать Ледяное копьё как знание; v0.2 не даёт освоить или
      заменить заклинание механически. Фиксируй лишь обещание/урок как факт.
    npcs: [naga_citizen]
    clues: [clue_naga_life]
    exits: [water_port, cow_bay, naga_border, naga_council, kirin_sanctuary]

  - id: naga_border
    title: "Граница нагских провинций"
    read_aloud: >-
      На камнях стоят знаки провинциальной чести. Дорога ведёт к водному
      берегу; здешние обитатели привыкли спрашивать гостей о цели визита.
    dm_notes: >-
      Наги охраняют собственный берег. Если орки вторглись после провокации,
      командир может сказать, что защищал границу. Дай ему возможность говорить
      до боя или после сдачи; только если он ещё жив и способен говорить,
      открой clue_commander_defense. Бой — крайний вариант, смертный и без
      подмены его нелетальным. Отряд может сдаться до боя, герои тоже могут
      отступить. Запиши отдельно naga_raid_fought или отказ от стычки,
      naga_commander_heard, если слова действительно прозвучали. Один боец
      border_duel представляет командира, другой — рядового стража. Если
      первый погиб, вызови kill_npc для naga_commander и запиши смерть;
      не показывай его снова живым.
    npcs: [naga_commander]
    clues: [clue_commander_defense]
    encounters: [border_duel]
    exits: [water_port, naga_market, naga_council, ocean_watch]

  - id: naga_council
    title: "Совет провинций нагов"
    read_aloud: >-
      Представители кланов выслушивают друг друга под сводом из раковин.
      Споры стары, но здесь всё ещё ищут слова для перемирия.
    dm_notes: >-
      Кирин просит содействовать примирению кланов. Временная авторская
      адаптация v0.2: представители спорят, кто отвечает за ремонт
      пограничного канала. Герои могут получить публичное подтверждение
      границы от каждого и привести их к совместной встрече. Разговор,
      другое мирное посредничество и отказ доступны; детали не канон исходника.
      Раскрой job_clan_peace, когда Кирин или представители действительно
      предложат героям посредничество.
      Только после фактически достигнутого мирного соглашения Кирин может
      вручить безопасный для других осколок для изучения. Запиши, что именно
      произошло; осколок не механический предмет и не расходник.
    npcs: [naga_citizen]
    handouts: [job_clan_peace]
    exits: [naga_market, naga_border, crystal_lagoon, kirin_sanctuary]

  - id: crystal_lagoon
    title: "Лагуна кристаллов"
    read_aloud: >-
      Под водой светятся кристаллы; течение меняется, когда над лагуной
      проходит тень Кирина. Ни один не выглядит добычей, которую можно просто взять.
    dm_notes: >-
      Кристаллы подпитывают связь Кирина с водой. Герои могут наблюдать их,
      но получение осколка требует согласия Кирина после помощи с примирением.
      Он даёт безопасный осколок, пригодный для исследования, не для оружия.
      Через note_fact запиши kirin_shard_given, хранителя и отдельно
      shard_delivered_frostmar, если герои позднее передали его Фростмару.
      Не придумывай числовую силу или связь с амулетом.
    npcs: [kirin]
    exits: [water_port, naga_council, kirin_sanctuary]

  - id: kirin_sanctuary
    title: "Убежище Кирина"
    read_aloud: >-
      Синий змееобразный дракон поднимается из воды и задаёт первый вопрос:
      «Что вы сами увидели на трёх берегах?»
    dm_notes: >-
      Кирин подозревает, что Лукан стравливает его с красным драконом, но пока
      не знает зачем и не видит полного плана Фростмара. Открой clue_kirin_doubt
      в первом содержательном разговоре; не выдавай готовое разоблачение.
      Если Лукан действительно прислал Кирину весть о якобы нападении орков,
      Кирин может пересказать её; раскрой clue_kirin_message. Это отдельное
      свидетельство, не доказанная истина.
      После самостоятельного сопоставления героями сведений о нагах, орках,
      камнях, предупреждении Фростмара и ледяных тварях запиши
      kirin_briefed_on_both и содержание рассказа. Только если отдельно
      записаны kirin_shard_given И shard_delivered_frostmar, Кирин допускает,
      что осколок дал Фростмару недостающую связь; тогда раскрой
      clue_shard_inference. Иначе обсуждай мотив Фростмара без выдуманной
      передачи или утверждения о готовом ритуале.
      Лишь при явном отказе героев от обоих магов и этом сообщении Кирин
      собирает совет драконов. Нельзя получить лучший финал простым визитом.
    npcs: [kirin]
    clues: [clue_kirin_doubt, clue_kirin_message, clue_shard_inference]
    handouts: [job_clan_peace, ocean_battle_witness]
    exits: [water_port, cow_bay, naga_market, naga_council, crystal_lagoon, ocean_watch, dragon_council]

  - id: ocean_watch
    title: "Океанская наблюдательная скала"
    read_aloud: >-
      Между материками лежит широкий пролив. На дальних берегах ещё можно
      различить сигналы обеих сторон; пока у каждого есть время остановиться.
    dm_notes: >-
      Если орков и нагов действительно стравили, их армии встречаются в океане,
      а Кирин и красный дракон ранят друг друга. Армии и драконы — только
      нарратив; запиши naga_honor_expedition и dragons_wounded лишь после
      фактических событий. Если герои наблюдали бой или получили достоверный
      рассказ очевидца, раскрой ocean_battle_witness. Без этого нарратор не
      должен объявлять битву. Наблюдение и своевременный доклад могут остановить
      эскалацию. Переход сюда сам не запускает битву. Лукан пользуется ранами
      драконов для ритуала; Фростмар — отвлечением красного дракона.
    handouts: [ocean_battle_witness, lucan_two_dragons]
    exits: [lucan_camp, red_dragon_aerie, naga_border, kirin_sanctuary, ice_shore, fire_port]

  - id: ice_shore
    title: "Берег Ледяного материка"
    read_aloud: >-
      Узкий материк тянется к полюсу. Между льдинами видны моржи и пингвины,
      вдалеке движутся белые медведи. У местных нет причин доверять чужакам.
    dm_notes: >-
      Лукан не предупредил о враждебности обитателей. Предложи переговоры,
      обход и отход. Ледяные тролли и белые медведи — часть мира, но большие
      стычки и контроль над ними только нарративны. Белый дракон не обязан
      гневаться от самого прибытия: нужна реальная агрессия или ущерб.
    handouts: [lucan_white_dragon]
    exits: [crossroads, lucan_camp, frostmar_tower, ocean_watch, ice_village, white_dragon_heart, ice_creature_pass]

  - id: ice_village
    title: "Поселение среди льдов"
    read_aloud: >-
      Среди льдов дымят тёплые источники. У жилищ сохранились защитные
      магические знаки; чужакам стоит прежде всего объявить о своём приходе.
    dm_notes: >-
      Местные защищаются. Небольшой магический поединок возможен после отказа
      от переговоров; противник смертен, сдача должна быть заявлена до боя.
      Избегание и помощь поселению позволяют пройти мирно. Если герои нанесли
      ущерб, запиши ice_encounter и причины гнева белого дракона. Если боец
      ice_duel погиб, запиши смерть и вызови kill_npc для ice_guard;
      не показывай его живым при повторном визите.
    npcs: [ice_guard]
    encounters: [ice_duel]
    exits: [ice_shore, white_dragon_heart, ice_creature_pass]

  - id: white_dragon_heart
    title: "Сердце Ледяного материка"
    read_aloud: >-
      Белый дракон лежит среди прозрачных глыб. Он видит следы любого гостя
      и ждёт объяснения, прежде чем решить, вмешиваться ли.
    dm_notes: >-
      Белый дракон — самостоятельный хранитель, не боевой статблок. Он гневается
      на действительный вред местным, но может выслушать правду и принять
      помощь. Лукан обещает защитить героев от него после вызванного конфликта;
      это часть его плана подчинения всех троих драконов. В совет он приходит
      после сведений Кирина, а не по самому переходу. Подчинение белого
      дракона требует отдельного действительного события после контроля двух
      раненых драконов: запиши lucan_bound_white и раскрой lucan_white_dragon
      лишь после него.
    npcs: [white_dragon]
    handouts: [lucan_white_dragon]
    exits: [ice_shore, ice_village, ice_creature_pass, dragon_council]

  - id: ice_creature_pass
    title: "Перевал ледяных тварей"
    read_aloud: >-
      На перевале остаются следы существ, привыкших к суровому холоду.
      Ветер быстро заметает их, но в глубине долины ещё видно движение.
    dm_notes: >-
      Фростмар предлагает испытать амулет управления ледяными тварями и
      привести их на Огненный материк будто бы для защиты от нагов. Амулет
      действует в авторском сюжете, но в v0.2 не создавай item, баф, призыв
      или контроль в движке. Через note_fact отдельно запиши испытание,
      фактический перевод существ, владение амулетом и реакцию героев. Если
      Фростмар уже предупредил о войне и сам переводит тварей, открой
      clue_frostmar_contradiction. Можно отказаться и предупредить Кирина.
      Если амулет действительно испытан, раскрой amulet_trace с наблюдаемым
      следом магического приказа; раньше его на перевале нет.
    clues: [clue_frostmar_contradiction]
    handouts: [amulet_trace]
    exits: [ice_shore, ice_village, white_dragon_heart, frostmar_tower, stone_approach]

  - id: stone_approach
    title: "Подступы к камням силы"
    read_aloud: >-
      У вулкана ветер несёт холод с неожиданной стороны. Камни отзываются
      слабым свечением; пока здесь ещё можно развернуться и позвать хранителей.
    dm_notes: >-
      Фростмар может начать ритуал у камней только после своих реальных
      приготовлений; Лукан — ритуал над ослабевшими драконами после их ранений.
      Записывай каждый отдельно. При фактическом начале ритуала Фростмара
      раскрой frostmar_ritual_seen; при завершении — frostmar_ritual_done.
      Если Лукан узнал о начавшемся ритуале и вмешался здесь до контроля
      над драконами, раскрой mages_clash_seen. Эти материалы подтверждают
      наблюдаемые стадии, посещение места их не открывает. Не создавай эффектов, бросков ритуала или
      автоматических таймеров. Герои могут предупредить Кирина, отвести тварей,
      раскрыть обман или отступить. Если Лукан узнал о начатом ритуале Фростмара,
      ещё не контролирует драконов и вмешивается здесь, возникает условие
      гибельного финала. Одна лишь служба обоим его не создаёт.
    handouts: [frostmar_ritual_seen, frostmar_ritual_done, mages_clash_seen]
    exits: [frostmar_tower, volcano_approach, stone_cavern, ice_creature_pass, dragon_council, upper_ledge, lower_ledge, seaward_ledge, inner_ledge]

  - id: dragon_council
    title: "Тихая лагуна"
    read_aloud: >-
      В лагуне спокойно. Здесь Кирин обычно слушает вести с других материков;
      сегодня герои могут передать ему всё, что узнали сами.
    dm_notes: >-
      Совет по магической связи — временная адаптация v0.2; драконы остаются
      в своих владениях. Он возможен после того, как герои сопоставили улики,
      отказались от поручений обоих магов и сообщили Кирину о целях каждого.
      Драконы не получают автоматического знания из посещения сцены. Если
      сведений мало, совет задаёт вопросы и оставляет пути расследования
      открытыми. При достаточных сведениях и решении драконов запиши
      dragon_council_united и раскрой council_agreement; тогда возможен
      благоприятный исход. Драконов не превращай в encounter или инструменты.
    handouts: [council_agreement]
    exits: [kirin_sanctuary, white_dragon_heart, stone_approach, seaward_ledge]

  - id: upper_ledge
    title: "Верхний уступ"
    read_aloud: >-
      Над камнями меняется свет. Здесь решится, кто будет распоряжаться силой
      мира; итог ещё зависит от того, что действительно произошло.
    dm_notes: >-
      Условный финал. До чтения проверь записанные facts: Кирин и красный
      дракон ранены в реальной войне, Лукан провёл ритуал влияния над ними,
      добился подчинения белого дракона и завершил власть над тремя раньше
      ритуала Фростмара. При любом пробеле это лишь возможный путь, возвращай
      игроков к выбору и расследованию. После финала Фростмар вынужден
      раскрыть свой ритуал и служить Лукану. После проверки запиши
      ending_committed=upper_ledge и раскрой epilogue_lucan. Ранее выбранный
      исход не меняй.
    handouts: [epilogue_lucan]
    exits: [stone_approach]

  - id: lower_ledge
    title: "Нижний уступ"
    read_aloud: >-
      У камней ждут последнего выбора. Их свет ещё не говорит, кто первым
      довёл свой замысел до конца.
    dm_notes: >-
      Условный финал. Проверь реальные факты подготовки: связь через осколок
      изучена, Фростмар начал и завершил ритуал у камней, красный дракон
      отвлечён войной, Лукан ещё не получил власть над драконами. Амулет и
      ледяные твари — прикрытие, не автоматическая кнопка победы. Если условие
      не выполнено, финал не наступает. При успехе Лукан признаёт поражение
      и служит Фростмару. После проверки запиши ending_committed=lower_ledge
      и раскрой epilogue_frostmar. Ранее выбранный исход не меняй.
    handouts: [epilogue_frostmar]
    exits: [stone_approach]

  - id: seaward_ledge
    title: "Прибрежный уступ"
    read_aloud: >-
      Прибрежный уступ открыт ветру и морю. Здесь можно дождаться ответа
      хранителей или вернуться к ещё не завершённому расследованию.
    dm_notes: >-
      Благоприятный условный финал. Нужны все части: явный отказ служить
      обоим, независимые сведения о замысле Лукана и Фростмара, сообщение
      Кирину и фактическое решение совета драконов. Если осколок был передан
      Фростмару, Кирин может включить поздний вывод в свидетельства;
      иначе подозрение подтверждают предупреждение о войне, просьба об
      амулете и подготовка у камней. Не требуй помогать Фростмару ради финала.
      Простой отказ или посещение совета недостаточны. Если часть отсутствует,
      сыграй дальнейшее расследование, не зачитывай исход. После проверки запиши
      ending_committed=seaward_ledge и раскрой epilogue_exile. Ранее выбранный
      исход не меняй.
    handouts: [epilogue_exile]
    exits: [dragon_council, stone_approach]

  - id: inner_ledge
    title: "Внутренний уступ"
    read_aloud: >-
      Камни гудят под землёй. Маги ещё могут остановиться, а герои —
      вмешаться до того, как стихии выйдут из равновесия.
    dm_notes: >-
      Условный трагический финал. Нужны именно: герои действительно помогли
      продвинуть планы обоих, Фростмар начал ритуал у камней, Лукан об этом
      узнал до получения контроля над драконами и вмешался у камней. Работа
      на обоих сама по себе гибели не вызывает. До встречи у камней сохраняй
      возможность предупредить Кирина и остановить эскалацию. Не объявляй
      выживших после этого исхода. После проверки запиши
      ending_committed=inner_ledge и раскрой epilogue_ruin. Ранее выбранный
      исход не меняй.
    handouts: [epilogue_ruin]
    exits: [stone_approach]

npcs:
  - id: lucan
    name: "Лукан"
    description: "Пламенный маг с властной речью, предлагающий опасные поручения."
    personality: "Горяч, уверен в праве распоряжаться судьбой мира."
    secrets: ["Стравливает драконов, чтобы подчинить ослабевших и стать богом мира."]
    home: lucan_camp
  - id: frostmar
    name: "Фростмар"
    description: "Спокойный пожилой маг льда, внимательный к каждому собеседнику."
    personality: "Вежлив и терпелив; чужими руками собирает сведения о камнях."
    secrets: ["Стремится к прямой власти над магией мира через камни силы.", "Лжёт, что не покидает башню только ради равновесия магии."]
    home: frostmar_tower
  - id: kirin
    name: "Кирин"
    description: "Синий змееобразный дракон водного материка, слушающий дольше, чем говорит."
    personality: "Проницателен, но не всеведущ; ждёт самостоятельных свидетельств."
    secrets: ["Подозревает попытку Лукана стравить драконов, но не знает его цели и плана Фростмара."]
    home: kirin_sanctuary
  - id: red_dragon
    name: "Красный дракон"
    description: "Огненный хранитель, сдерживающий междоусобную войну материка."
    home: red_dragon_aerie
  - id: white_dragon
    name: "Белый дракон"
    description: "Ледяной хранитель сердца северного материка."
    home: white_dragon_heart
  - id: red_skull_chief
    name: "Вождь Красного Черепа"
    description: "Сильный оркский маг, готовый говорить прежде поединка."
    home: red_skull_camp
  - id: orc_elder
    name: "Вождь соседнего клана"
    description: "Оркский старейшина, озабоченный налётами виверн."
    home: orc_council
  - id: naga_citizen
    name: "Житель провинции нагов"
    description: "Наг, занятый каналами, родными и спорами соседей."
    home: naga_market
  - id: naga_commander
    name: "Командир нагов"
    description: "Страж водной границы, требующий назвать цель вторжения."
    home: naga_border
  - id: ice_guard
    name: "Страж льдов"
    description: "Местный маг, охраняющий поселение от чужаков."
    home: ice_village

clues:
  - id: clue_naga_life
    text: "Из повседневных разговоров ясно: нагские кланы заняты своими провинциями и не готовят нападение на Огненный материк."
    visibility: dm
  - id: clue_orc_dispute
    text: "Оркские кланы спорят о праве возглавить поход против вытесняющих их виверн; версия о подготовке войны с нагами не подтверждается."
    visibility: dm
  - id: clue_stone_balance
    text: "Камень реагирует на жизнь материка: мелкие стычки едва заметны, крупная война грозит всем землям и погоде."
    visibility: dm
  - id: clue_commander_defense
    text: "Командир нагов говорит, что защищал свой берег, а не готовил первое нападение."
    visibility: dm
  - id: clue_kirin_doubt
    text: "Кирин замечает попытку Лукана стравить драконов, но не знает, ради чего он это делает."
    visibility: dm
  - id: clue_kirin_message
    text: "Кирин говорит: Лукан предупредил его о якобы нападении орков на водный берег; сам Кирин не видел подготовки к такому походу до этой вести."
    visibility: dm
  - id: clue_red_dragon_message
    text: "Красный дракон говорит: Лукан предупреждал его о зависти Кирина и предполагаемой угрозе со стороны водного материка."
    visibility: dm
  - id: clue_frostmar_contradiction
    text: "Фростмар предупреждал об опасности войны для камней, но сам предлагает привести ледяных тварей к Огненному материку."
    visibility: dm
  - id: clue_lucan_amulet
    text: "Услышав об амулете, Лукан просит героев украсть его и отдать ему."
    visibility: dm
  - id: clue_shard_inference
    text: "После рассказа героев Кирин предполагает, что безопасный осколок мог дать Фростмару недостающую связь с камнями."
    visibility: dm

handouts:
  - id: starting_magic
    title: "Знакомые формы магии"
    text: "Вы умеете направлять Огненную стрелу и Ледяной ветер в одну цель, а Водным лечением залечивать раны себе или спутнику. Ледяной щит постоянно защищает вас. Вне боя вы можете применять лечение без ограничения."
    visibility: public
  - id: job_cows
    title: "Просьба Лукана о морских коровах"
    text: "Лукан просит добыть десять туш морских коров для красного дракона и обещает награду. Герои вправе отказаться."
    visibility: dm
  - id: job_chief
    title: "Просьба Лукана о Красном Черепе"
    text: "Лукан просит одолеть вождя Красного Черепа, уверяя, что тот готовит нападения. Он не требует сразу начинать бой."
    visibility: dm
  - id: job_naga_raid
    title: "Просьба Лукана о вторжении"
    text: "Лукан просит героев присоединиться к оркам для нападения на нагский берег, уверяя, что это предупреждение чужой агрессии. Герои могут отказаться."
    visibility: dm
  - id: job_naga_watch
    title: "Просьба Лукана наблюдать нагов"
    text: "Лукан считает нагов угрозой и просит наблюдать их перемещения, затем доложить красному дракону. Вывод остаётся за героями."
    visibility: dm
  - id: job_ice
    title: "Просьба Лукана идти на север"
    text: "После ранения Кирина и красного дракона Лукан просит отправиться к белому дракону на Ледяной материк и обещает защиту позднее."
    visibility: dm
  - id: job_naga_culture
    title: "Просьба Фростмара о нагах"
    text: "Фростмар просит поговорить с рядовыми нагами и узнать об их заботах, законах и целях, не подсказывая готового вывода."
    visibility: dm
  - id: job_clan_peace
    title: "Просьба Кирина о перемирии"
    text: "Кирин просит помочь представителям двух нагских провинций договориться о ремонте пограничного канала: выслушать обе стороны, подтвердить границу и собрать их вместе. Другой мирный путь также возможен."
    visibility: dm
  - id: job_shard
    title: "Просьба Фростмара об осколке"
    text: "Фростмар просит изучить водные кристаллы и спросить у Кирина безопасный осколок для исследования. Кирин вправе отказать."
    visibility: dm
  - id: job_stone
    title: "Просьба Фростмара о камне"
    text: "Фростмар просит поговорить с другими оркскими вождями и наблюдать камень под вулканом, обходя саламандр."
    visibility: dm
  - id: job_amulet
    title: "Просьба Фростмара об амулете"
    text: "Фростмар предлагает испытать амулет у ледяных тварей и привести их на Огненный материк. Он говорит, что они защитят материк от нагов."
    visibility: dm
  - id: amulet_trace
    title: "След испытанного амулета"
    text: "После испытания амулета среди следов ледяных тварей заметен ровный узор чужого магического приказа."
    visibility: dm
  - id: council_agreement
    title: "Ответ хранителей"
    text: "Кирин передал красному и белому драконам собранные героями сведения. Все трое согласились вместе защищать мир от притязаний обоих магов."
    visibility: dm
  - id: ocean_battle_witness
    title: "Свидетельство о битве в океане"
    text: "После столкновения нагов и орков Кирин и красный дракон сразились над океаном. Очевидцы видели, как оба отступили ранеными к своим землям."
    visibility: dm
  - id: lucan_two_dragons
    title: "Власть Лукана над двумя драконами"
    text: "После ритуала Лукан приказал раненым Кирину и красному дракону, и оба против своей воли исполнили приказ. Белый дракон пока остаётся свободен."
    visibility: dm
  - id: lucan_white_dragon
    title: "Белый дракон подчинён"
    text: "Лукан с помощью уже подчинённых драконов принудил белого дракона склониться. Теперь все трое под его властью."
    visibility: dm
  - id: frostmar_ritual_seen
    title: "Начало ритуала у камней"
    text: "У камней Фростмар начал плести связь с силой мира. Свет изменился, но ритуал ещё не завершён и может быть остановлен."
    visibility: dm
  - id: frostmar_ritual_done
    title: "Ритуал у камней завершён"
    text: "Фростмар довёл связь с камнями до конца. Камни отвечают его воле."
    visibility: dm
  - id: mages_clash_seen
    title: "Столкновение у камней"
    text: "Лукан узнал о начатом ритуале Фростмара и, ещё не владея драконами, атаковал его у камней. Сила двух магов раскачала камни; стихии выходят из равновесия."
    visibility: dm
  - id: epilogue_lucan
    title: "Итог на верхнем уступе"
    text: "Лукан подчинил трёх драконов раньше ритуала Фростмара и объявил себя господином мира. Под угрозой драконов Фростмар подчинился и раскрыл свой замысел."
    visibility: dm
  - id: epilogue_frostmar
    title: "Итог на нижнем уступе"
    text: "Фростмар первым овладел камнями. Драконы прекратили бой и развели существ по материкам; Лукан признал поражение и стал служить ему."
    visibility: dm
  - id: epilogue_exile
    title: "Итог у берега"
    text: "Герои отказались служить обоим магам и помогли Кирину собрать свидетельства. Три дракона изгнали Лукана и Фростмара. Герои стали друзьями хранителей и свободно путешествуют."
    visibility: dm
  - id: epilogue_ruin
    title: "Итог у камней"
    text: "Лукан, ещё не подчинивший драконов, атаковал Фростмара во время его ритуала у камней. Пробудившиеся стихии разрушили мир; никто не выжил."
    visibility: dm

encounters:
  - id: chief_duel
    title: "Магический поединок с Красным Черепом"
    description: "Только если герои выбрали бой после разговора. Вождь смертен; сдача возможна до боя."
    creatures: [{statblock: red_skull_mage, count: 1}]
  - id: border_duel
    title: "Магическая стычка на границе"
    description: "Только после осознанного отказа от переговоров; командир может говорить и сдаться до боя."
    creatures: [{statblock: naga_guard, count: 2}]
  - id: ice_duel
    title: "Поединок у поселения льдов"
    description: "Только если переговоры сорвались; смертный бой, отступление доступно до начала."
    creatures: [{statblock: ice_guard_mage, count: 1}]

