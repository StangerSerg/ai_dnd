# Демо-сценарий. Четыре сцены на один вечер для трёх героев 3-го уровня.
# Английская версия — shadow-over-millford.en.yaml: те же id и числа, другой язык текстов.
scenario:
  title: "Тень над Мельничьим Бродом"
  language: ru
  ruleset: dnd5e-srd@1
  sheet_template: srd5-basic@1
  class_pack: fantasy-core
  start_scene: tavern
  synopsis: >-
    В деревне Мельничий Брод пропадают люди. Их похищает культ Змея: пленников держат
    в подвале старой мельницы и готовят к обряду в ночь новолуния. Трактирщик Борис —
    осведомитель культа, он подсказывает, кого не хватятся. Герои должны найти след,
    добраться до мельницы и сорвать обряд, пока пленники живы. Хороший финал — пленники
    спасены, жрец повержен, а письмо из подвала намекает, что за культом стоит кто-то ещё.
  tone: >-
    Сельская мрачная сказка: туман над рекой, скрип мельничного колеса, недоверчивые
    крестьяне. Страшное остаётся за кадром, жестокость не смакуется. Героям дают
    почувствовать себя нужными: за них болеет вся деревня.

scenes:
  - id: tavern
    title: "Таверна «Хромой гусь»"
    read_aloud: >-
      Тёплый свет очага, запах эля и мокрой шерсти. В зале непривычно тихо: местные сидят
      по углам и замолкают, стоит вам войти. У стойки суетится круглолицый трактирщик,
      а у окна молодая женщина комкает в руках объявление с неровными буквами.
    dm_notes: >-
      Завязка. Марта сама подойдёт к героям и попросит найти отца. Борис будет отговаривать
      и уводить разговор в сторону: волки, разбойники с тракта, «сами ушли». Если героям
      не удалось разговорить Бориса, след даст Марта: отец в последние дни ходил к старой
      мельнице. Сцену нельзя завалить — дорога к мельнице открыта в любом случае.
    npcs: [boris, marta]
    handouts: [reward_notice]
    clues: [clue_symbol, clue_boris_lies, clue_mill]
    exits: [mill_road]
    checks:
      - id: notice_symbol
        description: "Герой осматривает зал, стойку или посуду."
        skill: perception
        dc: 14
        on_success:
          reveal: [clue_symbol]
      - id: read_boris
        description: "Герой присматривается к Борису во время разговора."
        skill: insight
        dc: 12
        on_success:
          reveal: [clue_boris_lies]
      - id: press_boris
        description: "Герой угрожает Борису или припирает его уликой к стенке."
        skill: intimidation
        dc: 13
        on_success:
          reveal: [clue_mill]
          text: "Борис бледнеет, оглядывается на дверь и шёпотом выкладывает всё, что знает."
        on_failure:
          text: "Борис поднимает шум: «Люди добрые, да что ж это делается!» Местные косятся на героев."
      - id: persuade_boris
        description: "Герой убеждает Бориса по-хорошему: обещает защиту от культа."
        skill: persuasion
        dc: 15
        on_success:
          reveal: [clue_mill]
          text: "Борис долго молчит, потом кивает на заднюю дверь: «Не здесь»."

  - id: mill_road
    title: "Дорога к мельнице"
    read_aloud: >-
      Старая дорога идёт вдоль реки. Туман лежит в низинах, по обочинам стоит некошеная
      трава в человеческий рост. Впереди, за поворотом, дорогу перегораживает поваленная
      осина — ствол срублен совсем недавно.
    dm_notes: >-
      Засада. Четверых гоблинов наняли культисты — стеречь дорогу и отпугивать любопытных.
      Гоблины прячутся в траве по обе стороны от завала и нападают, когда герои подойдут
      к дереву. Дерутся трусливо: раненый гоблин бежит. Пленный гоблин за жизнь расскажет,
      что «люди в капюшонах» платят серебром и сидят на мельнице.
    encounters: [goblin_ambush]
    clues: [clue_tracks]
    exits: [tavern, old_mill]
    checks:
      - id: spot_ambush
        description: "Герои подходят к завалу."
        skill: perception
        dc: 13
        on_success:
          text: "Герой замечает примятую траву и блеск клинка: засада не застаёт отряд врасплох."
        on_failure:
          text: "Гоблины нападают внезапно: в первом раунде у них преимущество на атаки."
      - id: read_tracks
        description: "Герой изучает следы на дороге."
        skill: survival
        dc: 12
        on_success:
          reveal: [clue_tracks]

  - id: old_mill
    title: "Старая мельница"
    read_aloud: >-
      Мельница чернеет над запрудой. Колесо давно не крутится, крыша провалилась с одного
      угла, но в щелях ставен дрожит свет, а из трубы тянет дымом. У двери переминаются
      с ноги на ногу двое в длинных плащах.
    dm_notes: >-
      Двое культистов стерегут вход. Если поднять шум, один попытается добежать до люка
      и предупредить тех, кто внизу: тогда в подвале героев ждут. Люк в подвал спрятан
      под пустыми мешками в дальнем углу и заперт изнутри на засов и снаружи на замок.
      Ключ — на поясе у одного из стражей.
    encounters: [mill_guards]
    items: [cellar_key]
    clues: [clue_trapdoor]
    exits: [mill_road, cellar]
    checks:
      - id: sneak_up
        description: "Герои подкрадываются к мельнице."
        skill: stealth
        dc: 13
        on_success:
          text: "Стражи не замечают героев: на первую атаку по ним есть преимущество."
        on_failure:
          text: "Под ногой хрустит ветка. Стражи хватаются за клинки."
      - id: find_trapdoor
        description: "Герой обыскивает мельницу."
        skill: investigation
        dc: 12
        on_success:
          reveal: [clue_trapdoor]
      - id: pick_lock
        description: "Герой вскрывает замок на люке."
        skill: sleight_of_hand
        dc: 15
        on_success:
          text: "Замок открывается без звука."
      - id: force_trapdoor
        description: "Герой выламывает люк."
        skill: athletics
        dc: 15
        on_success:
          text: "Люк с треском поддаётся — внизу этот треск наверняка услышали."

  - id: cellar
    title: "Подвал мельницы"
    read_aloud: >-
      Крутая лестница уходит в сырой подвал. В свете чадящих плошек видны связанные люди
      у дальней стены, каменная чаша посреди пола и фигура в чешуйчатой маске над ней.
      Двое в капюшонах тянут монотонный напев, от которого ноет в висках.
    dm_notes: >-
      Развязка. Жрец Змея начинает обряд, как только поймёт, что на мельницу пришли чужие.
      Обряд длится три раунда; если его не сорвать, первый пленник — мельник Тихон —
      погибнет. Сорвать просто: разбить или опрокинуть чашу (действие, сложности нет) либо
      вывести жреца из боя. Культисты дерутся до конца. После боя пленников нужно
      развязать и успокоить; Тихон расскажет, что жрец ждал «гостя из Вороньей башни».
    npcs: [serpent_priest, tikhon]
    encounters: [ritual]
    items: [ritual_bowl, serpent_amulet]
    handouts: [cult_letter]
    clues: [clue_ritual]
    exits: [old_mill]
    checks:
      - id: know_ritual
        description: "Герой пытается понять, что за обряд здесь идёт."
        skill: religion
        dc: 13
        on_success:
          reveal: [clue_ritual]
      - id: resist_chant
        description: "В начале боя каждый герой, который слышит напев."
        save: wis
        dc: 11
        on_failure:
          text: "Герой испуган до конца своего следующего хода."
      - id: tend_prisoners
        description: "Герой помогает ослабевшим пленникам после боя."
        skill: medicine
        dc: 10
        on_success:
          text: "Пленники приходят в себя и могут идти сами."
        on_failure:
          text: "Двоих придётся нести: дорога до деревни займёт вдвое больше времени."

npcs:
  - id: boris
    name: "Борис"
    description: "Круглолицый трактирщик в засаленном фартуке. Улыбается всем сразу и никому в глаза."
    personality: >-
      Суетливый и льстивый, до смерти боится культа. Говорит много и ни о чём, подливает
      эль за счёт заведения, лишь бы гости не задавали вопросов. Не злодей: его запугали.
    secrets:
      - "Работает на культ: сообщает, кого из путников и одиноких деревенских хватятся не скоро."
      - "Знает, что культисты собираются на старой мельнице, и носит им еду."
    attitude: neutral
    statblock: srd:commoner

  - id: marta
    name: "Марта"
    description: "Дочь мельника, лет двадцати. Глаза красные от слёз, но держится прямо."
    personality: >-
      Упрямая и прямая. Отец пропал три дня назад, и ждать она больше не намерена:
      если герои откажутся, пойдёт на мельницу сама. Готова отдать все сбережения.
    attitude: friendly
    statblock: srd:commoner

  - id: tikhon
    name: "Тихон"
    description: "Седой мельник с разбитой губой, связанный по рукам и ногам."
    personality: >-
      Немногословный и крепкий старик. Слаб от голода, но в ясном уме. Слышал разговоры
      культистов и запомнил главное.
    secrets:
      - "Слышал, как жрец говорил о «госте из Вороньей башни», которого ждут к новолунию."
    attitude: friendly
    statblock: srd:commoner

  - id: serpent_priest
    name: "Жрец Змея"
    description: "Высокая фигура в маске из змеиной чешуи. Голос тихий и ровный."
    personality: >-
      Спокойный фанатик. Не кричит и не угрожает — объясняет героям, что они опоздали
      и ничего не изменят. В плен не сдаётся.
    secrets:
      - "Он лишь исполнитель: приказы приходят письмами из Вороньей башни."
    attitude: hostile
    statblock: srd:cult_fanatic

items:
  - id: cellar_key
    name: "Ключ от люка"
    description: "Тяжёлый железный ключ на шнурке. Висит на поясе у одного из стражей мельницы."
    visibility: dm

  - id: ritual_bowl
    name: "Обрядовая чаша"
    description: "Грубая каменная чаша с вырезанным по краю змеем. Стоит посреди подвала."

  - id: serpent_amulet
    name: "Серебряный амулет"
    description: >-
      Амулет в виде змея, кусающего свой хвост. Висит на шее у жреца. Серебро хорошей
      работы — в деревне такого не делают.
    visibility: dm

clues:
  - id: clue_symbol
    text: "На донышке кружки выцарапан змей, кусающий свой хвост. Такой же знак — на косяке задней двери."
  - id: clue_boris_lies
    text: "Борис лжёт. Он знает о пропавших больше, чем говорит, и очень боится, что это заметят."
  - id: clue_mill
    text: "Люди в капюшонах собираются на старой мельнице. Борис носит им еду каждую третью ночь."
  - id: clue_tracks
    text: "По дороге недавно прошла гружёная телега, рядом — следы босых ног. Всё ведёт к мельнице."
  - id: clue_trapdoor
    text: "Под пустыми мешками в углу — люк в подвал. Из щелей тянет дымом и доносится пение."
  - id: clue_ritual
    text: >-
      Обряд держится на чаше: пока она цела и стоит на месте, жрец может его продолжать.
      Опрокинуть или разбить чашу — значит сорвать обряд.

handouts:
  - id: reward_notice
    title: "Объявление у входа"
    text: >-
      «Пропал мельник Тихон. Кто найдёт живого — тому двадцать золотых и вечная
      благодарность. Спросить Марту в „Хромом гусе“».
    visibility: public

  - id: cult_letter
    title: "Письмо из подвала"
    text: >-
      «К новолунию всё должно быть готово. Гость прибудет после полуночи и останется
      недоволен, если чаша окажется пуста. Не подведи нас снова. — В. Б.»
    visibility: dm

encounters:
  - id: goblin_ambush
    title: "Засада у поваленного дерева"
    description: >-
      Гоблины бьют из травы и не лезут в ближний бой с тем, кто крепко стоит на ногах.
      Раненый гоблин бросает оружие и бежит к реке.
    creatures:
      - {statblock: "srd:goblin", count: 4}

  - id: mill_guards
    title: "Стражи мельницы"
    description: "Двое культистов у двери. Если бой идёт плохо, один бежит к люку предупредить остальных."
    creatures:
      - {statblock: "srd:cultist", count: 2}

  - id: ritual
    title: "Обряд в подвале"
    description: >-
      Жрец держится у чаши и продолжает обряд, пока его не вынудят защищаться.
      Культисты прикрывают его и не отступают.
    creatures:
      - {statblock: "srd:cult_fanatic", name: "Жрец Змея"}
      - {statblock: "srd:cultist", count: 2}

lore:
  - id: village
    title: "Мельничий Брод"
    text: >-
      Деревня в три десятка дворов у брода через реку Сонную. Живут мукой, рыбой
      и проезжими с тракта. Старая мельница выше по течению заброшена лет десять —
      новую поставили ближе к деревне.

  - id: serpent_cult
    title: "Культ Змея"
    text: >-
      Тайное общество, которое поклоняется Змею, пожирающему собственный хвост, —
      образу вечного возвращения. Культисты верят, что жертва на новолуние продлевает
      жизнь их покровителю. Ячейка в Мельничьем Броде — одна из нескольких.
    visibility: dm

map:
  style: parchment
  nodes:
    tavern: {x: 120, y: 340, icon: inn}
    mill_road: {x: 260, y: 300, icon: road}
    old_mill: {x: 400, y: 220, icon: mill}
    cellar: {x: 430, y: 250, icon: cave}
