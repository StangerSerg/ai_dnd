# Кампания «Пять Стражей»: пять актов, 26 сцен, на 6–8 сессий.
# Партия: четыре героя 3-го уровня — fighter, ranger, rogue, cleric; только русский язык.
# Боевые роли: воин-танк, следопыт-стрелок, плут ближнего боя, жрец поддержки.
# Подготовка, нелетальный поединок и ритуал требуют ручного ведения; это не функции движка.
scenario:
  title: "Пять Стражей"
  language: ru
  ruleset: dnd5e-srd@1
  sheet_template: srd5-basic@1
  start_scene: tavern
  synopsis: >-
    На 6–8 сессий для четверых героев 3-го уровня: воин-танк, следопыт-стрелок,
    плут с рапирой, жрец Жизни. Роли не ограничивают выбор; агро и классовые умения
    не автоматизированы. Лечение ран 1-го уровня доступно вне боя; прочие заклинания — вручную.
    За Ольховкой стоят Чёртовы ворота — Дверь в Изнанку. Пять живых замков:
    Дурак — наивность, Маг — знание, Император — порядок, Колесничий — движение,
    Отшельник — единство света и тьмы. Смерть любого ослабляет замок; Колесничего —
    ускоряет открытие. Неверие людей ослабляет порядок Императора, но не убивает его.
    Новолуние позволяет культу расшатать печать. Для полного открытия нужны ослабленный
    замок и осознанно произнесённое Магом слово открытия. Простое касание камня безопасно.
    Северин, якобы староста Заречья, — Заказчик, глава Ключников и тварь из Изнанки.
    Через старую трещину просочились только он и Получатель; войско пока пройти не может.
    План: уничтожить местную стаю, выпустить уже многочисленных кроликов к полям,
    вызвать голод и ропот на Императора; доставить убийце распорядок Императора;
    выследить Дурака; руками героев устранить Колесничего и Отшельника. Больного Мага
    Мирона из башни Вельграда обманом заставляют прочесть слово открытия. Волки
    в лесу — четыре группы по пять обычных: первая у тропы, остальные глубже
    в чаще, только после отдельного поиска. Между боями можно отступить и восстановиться.
    Сессии 1–2: лес, праздник, конверт, Вельград, кролики. 3–5: Дурак, записи,
    ручей, Хоремхеб с копьём и щитом, Отшельник. Первый визит даёт правила Двери,
    не заговор: старик пока не знает плана и роли Северина. Затем через тропу в таверну:
    Северин показывает отдельного связанного курьера и посылает арестовать ячейку,
    сам к овину не идёт. Это зачистка подручных. После ячейки герои забирают защищённого
    старика из охраны либо уже идут с ним; сопровождают через тропу домой, где он
    сопоставляет рассказ, приказы и признания. Затем ночь и выбор. Полный план — только
    по достаточным свидетельствам, без обязательного броска или ареста. Можно раскрыть
    раньше самим; разоблачённый наниматель больше не выдаёт поручений. 6–7: спасение
    и подготовка либо исправление. 8: три волны и Дверь. Для шести сессий объединить
    поездки за столом, не сокращая игровое время; сроки не задерживают правду.
    Помогают Стражам — две недели готовят оборону. Бездействуют — получают вести о
    покушениях и могут передумать; только полное бездействие ведёт к гибели Стражей.
    Продолжают службу — везут Мирона к Воротам; обман можно остановить до слова открытия.
    Никакая прежняя ошибка не запрещает исправление и не предрешает финал.
    Через note_fact сохраняй поручения, улики и кому их сообщили; жизнь, место,
    сопровождение и согласованную охрану NPC; волков, ущерб полям, спасённых, выбор стороны,
    дни подготовки, работы, оружие, провизию, мораль, ополчение, союзников, защиту Мага.
    Переходы не доказывают заговор, не убивают и не воскрешают NPC. Отсутствующих не
    показывай; спасение сохраняется. Без защиты Мага ещё возможна эвакуация.
    Подготовка: два недельных этапа, по два проекта и тренировке в каждом. Ополчение
    начинает со степени 1; оружие и обучение дают 2, второе обучение — 3. Смерть
    Колесничего оставляет неделю; герой может стать наставником. Мораль и оружие
    меняют вариант столкновения, не дают вымышленных бонусов.
    Живой защищённый Мирон при целых замках запечатывает Дверь без жертвы. Если замок
    утрачен или Дверь полностью открыта, он сначала объясняет цену аварийной печати:
    доброволец удерживает проём изнутри. Согласие необходимо; преемник принимает роль
    добровольно, а не назначается ведущим. Последние Стражи при полном бездействии
    могут пожертвовать собой, но выжившие не возвращаются из мёртвых ради сцены.
    В консоли бой предшествует ритуалу: три проверки Магии СЛ 15. Защита Мага три
    раунда и нелетальный поединок — вручную. При 0 хитов оболочка Заказчика уничтожена;
    закрытие Двери уничтожит сущность, иначе та уйдёт в Изнанку. Поражение или отказ
    от жертвы не победа: возможна эвакуация при открытой Двери.
  tone: >-
    Классическое фэнтези. В начале светло и по-доброму: зелёный лес, праздник, благодарные
    крестьяне, щедрый наниматель. Тревога нарастает исподволь — через мелочи, которые
    сперва кажутся смешными: нетронутая кружка, незапечатанный конверт, человек, который
    не моргает. Главное — последствия поступков, а не жестокость: страшное остаётся
    за кадром, смерть не смакуется. Ведущий не подталкивает к «правильному» выбору
    и не наказывает за ошибки сверх того, что из них честно вытекает.

scenes:
  # --- Акт 1. Помощь деревне ---

  - id: tavern
    title: "Таверна «Ольховый лист»"
    read_aloud: >-
      В «Ольховом листе» пахнет свежим хлебом и дымом. За окном зеленеет Ольховка, а дальше,
      на голом холме, торчат два серых камня с перекладиной — Чёртовы ворота, как их тут
      зовут. В зале негромко переговариваются местные, звенит посуда.
    dm_notes: >-
      Первая встреча: за лучшим столом элегантный человек в тёмно-зелёном камзоле.
      Северин улыбается, приглашает присесть и угощает: «Последнее время житья нет от волков. Принесите 20 хвостов —
      и получите награду». Обещает золотой за хвост и премию за безопасность деревни.
      На «Почему вы?» — «Я просто староста соседней деревни. Хочу помочь». Местные благодарны
      за его помощь хлебом и ещё не знают о культе. В лесу двадцать обычных волков:
      пять у тропы, ещё три группы по пять придётся искать глубже в чаще. Расспросы
      местных без броска дают правду: воют, но скотину не трогали. Не запрещай ранние
      подозрения и отказ от охоты. Агафья предлагает изучить следы и найти мирное
      решение; лес остаётся доступен. Если герои сообщают Северину, что не станут
      убивать волков, он злится, перебивает любые объяснения про кроликов: «Мне нужны
      хвосты, а не ваши рассуждения!» Раскрой clue_patron_displeased без броска после
      этой реакции, но не объясняй его скрытый план. Затем он даёт «шанс исправиться»:
      доставить посылку. Переход в village_thanks доступен сразу, без ожидания, боя
      или выдуманной награды; конверт получают только согласившиеся. Объясни до игры состав
      партии по party_roster: роли описывают сильные стороны, а не обязанности игроков.
      Поверье о Чёртовых воротах — обычный местный рассказ, не тайна. Высокая
      Проницательность замечает странные привычки, но провал не доказывает невиновность.
      Поздняя фаза — только по возвращении из гор после поручения задержать «колдуна».
      Если Северин ещё не разоблачён, жив, не изгнан и ячейка ещё не разобрана,
      он один раз показывает в таверне связанного культиста: «Одного поймали, остальные
      там. Арестуйте их». Указывает старый овин (cult_cell). Если Отшельника не привели:
      «Не нашли? Сейчас есть дело важнее». Северин остаётся в таверне, к овину не идёт.
      Для ведущего: это мнимое доказательство непричастности и попытка зачистить
      провалившихся подручных руками героев, не требование убивать сдавшихся.
      Связанный — отдельный анонимный курьер, не один из четырёх в овине, не участник
      засады и не отравитель. Впервые появляется только при этой выдаче, не в начале игры.
      Повторный вход не создаёт нового курьера. Под защитой он может рассказать, какие
      приказы носил; до допроса его молчание не считается показаниями. Его судьба
      отдельна от cell_fight: чужой бой не убивает его и не делает погибшего пленником.
      Герои могут взять живого Отшельника с собой либо, с согласия сторон, оставить
      под охраной Агафьи или живого Хоремхеба. Колесничий здесь только если действительно
      пришёл. Сверяй местонахождение всех NPC; защищённый старик не остаётся одновременно
      в таверне и при отряде. Перед уходом уточни охрану старика и курьера. Оставлять
      старика наедине обвинителю опасно: Северин ищет возможность убить его, но не
      проходит сквозь охрану. Покушение требует реального доступа и возможности
      вмешательства; ночь или смена сцены сами никого не убивают.
      Через note_fact запиши выдачу/отказ от поручения, судьбу и место каждого пленника,
      согласованную охрану, сопровождение, показания и кому их сообщили. По возвращении
      можно забрать охраняемого Отшельника и проводить домой: mountain_path → hermit_hut.
      Поручения, подарки и оплату повторно не выдавай. После разоблачения, гибели или
      изгнания Северина нет новых поручений и нового пленника; при уже разобранной
      ячейке эта поздняя выдача тоже не происходит. Ранее спасённый курьер остаётся по
      фактам. К овину можно идти по уже полученному адресу или реально найденным бумагам
      (адрес на patron_notes), не по знанию ведущего. Фонарь работает на Северине сразу,
      если герои сами его применяют: чужой облик виден, но весь план этим не доказан.
      При раскрытии личины запиши «Северин разоблачён» через note_fact и прекрати
      выдачу поручений. За доступными бумагами можно подняться в patron_room.
      При повторном посещении не показывай отсутствующих или погибших NPC.
      clue_dark_creatures — только после находки. Если герои сообщили о ней, Ефим/Агафья:
      «Прежде в этих лесах скелетов никогда не было». Подтверждение — отдельно в note_fact.
    npcs: [severin, efim, agafya, hermit, charioteer]
    handouts: [party_roster]
    clues: [clue_patron_odd, clue_patron_displeased, clue_dark_creatures]
    encounters: [patron_first_fight]
    exits: [wolf_forest, village_thanks, mountain_path, cult_cell, village_night, patron_room]
    checks:
      - id: read_patron
        description: "Герой присматривается к Северину во время разговора и тостов."
        skill: insight
        dc: 18
        on_success:
          reveal: [clue_patron_odd]
        on_failure:
          text: "Приятный человек, щедрый и, кажется, искренний."
      - id: read_patron_cell
        description: "Только в поздней фазе возвращения из гор: герой наблюдает за присутствующим Севериным, когда тот показывает связанного курьера и отправляет к ячейке."
        skill: insight
        dc: 15
        on_success:
          text: "Ему не жаль связанного человека. Он раздосадован — как хозяин, у которого сломалась вещь. Это наблюдение, не доказательство связи с культом."

  - id: wolf_forest
    title: "Ольховый лес"
    read_aloud: >-
      Ольховый лес светлый и шумный: ручьи, папоротник по пояс, птичий гомон. Тропа петляет
      между стволами. На сырой земле у ручья — крупные следы, много следов, и все ведут
      к оврагу.
    dm_notes: >-
      В лесу двадцать обычных волков, без магии и связи с культом, четырьмя группами
      по пять. При первом входе доступна только группа у оврага рядом с тропой
      (wolf_pack). Остальные — в глухом ельнике (wolf_thicket), у дальнего ручья
      (wolf_stream) и в логове Седого вожака (wolf_den: четыре волка и обычный по
      числам вожак). Каждую следующую группу находят лишь после явного решения искать
      глубже в чаще; на новый участок уходит не менее часа. Путь назад открыт.
      Не запускай следующий бой после победы автоматически: сначала спроси, ищут ли
      герои дальше, отдыхают или возвращаются в деревню. Не ставь срок на охоту и не
      мешай безопасному отдыху случайной атакой другой группы. Бои строго отдельные:
      никаких подкреплений, объединения групп или переноса уцелевших в следующий
      encounter. Сохраняй через note_fact найденные участки, судьбу каждой группы,
      число убитых, изгнанных и оставшихся; возврат не создаёт новых волков или трофеев.
      Нападают при вторжении к месту отдыха или нападении героев; наблюдать и отойти
      можно без боя. Воин держит переднюю линию, следопыт стреляет, плут выбирает цель,
      жрец помогает раненым — только предложения, не действия за игроков. В консоли
      нет принудительного агро, дистанций и заклинаний в бою: не обещай защиту стрелка
      щитом или лечение в меню атаки. Между боями жрец может применить Лечение ран
      1-го уровня, если есть ячейки. Можно устроить отдых в безопасном месте или
      вернуться ночевать в деревню и продолжить поиск позже. Короткий отдых сам не
      восстанавливает хиты; лечение, расход ресурсов и длинный отдых учитывай только
      доступными средствами движка либо вручную за столом, не выдумывай полный heal.
      Выдай wolf_tails лишь за фактически убитых волков; максимум двадцать за всю охоту.
      Кроличьи кости и шерсть видны при обычном осмотре любого найденного места отдыха,
      в том числе у первой группы: clue_rabbit_bones не требует броска. При осмыслении
      этих следов предложи Проницательность СЛ 12 (question_rabbit_balance). Успех даёт
      только сомнение: «А что будет с кроликами, если убить слишком много волков?» —
      не готовое решение, прогноз голода или раскрытие плана Северина. Провал не
      опровергает догадку и не запрещает игрокам прийти к ней самим.
      Уход за животными СЛ 16 оттесняет только найденную группу без убийства; провал —
      предупреждающее рычание, не автоматический бой. Полное изгнание всех групп
      тоже убирает хищников и усугубляет ущерб полям. Если волков оставляют в лесу и
      ограждают скот, запиши «Стая сохранена»: ущерб малый. Частичная охота уменьшает
      давление на кроликов, но не равна уничтожению всех двадцати; учитывай уцелевших.
      При первом осознанном уходе в деревню после посещения леса, ещё в wolf_forest
      до перехода в tavern/village_thanks, герои издали замечают на обратной тропе
      ровно двух движущихся скелетов (forest_return_skeletons). Отказ от охоты и ранний
      возврат тоже подходят; число убитых волков, включая ноль, не условие. Не показывай
      их при входе, смене участка или автоматически после победы над волками. Если
      заявили уход во время боя, дождись его завершения: не накладывай бои и не
      прерывай безопасный отдых. Дай приготовиться, отойти или обойти без боя; путь
      в деревню не заперт. При столкновении или сближении с враждебной нежитью начни
      отдельный настоящий бой, не разрешай его повествованием и не наноси автоурон.
      По наблюдению без броска открой clue_dark_creatures — «Тёмные твари», даже при
      отказе от боя. Причина оживления неизвестна; это не доказательство заговора,
      связи с волками или открытой Двери. Местную историю герои пока не знают.
      Сразу через note_fact сохрани «Пара скелетов обнаружена», место и судьбу каждого,
      даже без боя; при обходе — оставлены живыми, не убиты. Повторный уход/вход не
      создаёт новую пару: сверяй факты, started_encounters и события боя; не сбрасывай
      прежних существ, хиты и исход. Ещё не начатый бой возможен лишь с той же живой
      парой; начатый encounter не запускай повторно. Победа и бегство — только по событиям.
    items: [wolf_tails]
    clues: [clue_rabbit_bones, clue_dark_creatures]
    encounters: [wolf_pack, wolf_thicket, wolf_stream, wolf_den, forest_return_skeletons]
    exits: [tavern, village_thanks]
    checks:
      - id: track_pack
        description: "Герой ищет первую группу волков у оврага рядом с тропой; это не поиск остальных групп в чаще."
        skill: survival
        dc: 12
        on_success:
          text: "Следы приводят к оврагу. Стая там, и она ещё не почуяла чужих."
        on_failure:
          text: "Отряд теряет несколько часов. К сумеркам слышен вой у оврага; можно искать дальше или вернуться в деревню."
      - id: sneak_pack
        description: "Герои подкрадываются к месту отдыха уже найденной группы волков."
        skill: stealth
        dc: 13
        on_success:
          text: "Найденная группа не замечает героев. Можно наблюдать, отойти или вступить в бой; другие участки леса ещё предстоит искать."
        on_failure:
          text: "Ветер меняется. Волки поднимают морды и рычат."
      - id: question_rabbit_balance
        description: "Герой размышляет о кроличьих костях, обилии кроликов и роли волков в лесу."
        skill: insight
        dc: 12
        on_success:
          text: "Возникает сомнение: «А что будет с кроликами, если убить слишком много волков?» Ответа пока нет."
        on_failure:
          text: "Уверенного вывода пока нет. Кости и следы остаются перед глазами; герои сами решают, что это значит."
      - id: drive_off
        description: "Герой пытается оттеснить найденную группу волков без убийства — огнём и шумом."
        skill: animal_handling
        dc: 16
        on_success:
          text: "Найденная группа отходит. Герои могут оставить её в лесу или продолжить изгнание; другие группы этим не затронуты."
        on_failure:
          text: "Волки рычат, но не преследуют отступающих. Можно отойти; при вторжении к месту отдыха или атаке начинается бой только с этой группой."

  - id: village_thanks
    title: "Праздник в Ольховке"
    read_aloud: >-
      Ольховка гуляет. На площади горит костёр, жарится мясо, кто-то пиликает на скрипке.
      Вас хлопают по плечам и суют в руки кружки и пироги. Северин стоит у костра и машет
      вам — у его ног тяжёлый кошель.
    dm_notes: >-
      Праздник — только если герои помогли деревне. При отказе от охоты вместо праздника
      обычный вечер в таверне; за мирную защиту скота Агафья благодарит независимо от
      Северина. За двадцать хвостов он платит двадцать золотых и двенадцать премии;
      за часть — по золотому за хвост, премия лишь за полный заказ и один раз. За полное
      изгнание всех групп — десять золотых за безопасность. Учитывай уже выплаченные
      суммы при повторных визитах; не превращай пять хвостов в двадцать.
      Если герои говорят, что отказываются убивать волков или продолжать охоту,
      Северин явно злится: «Мне нужны хвосты, а не ваши рассуждения!» Он перебивает
      любые доводы про кроликов и не принимает мирное решение, даже если скот защищён.
      После этой реакции без проверки открой clue_patron_displeased — «Заказчик недоволен».
      Это странная вспышка и повод сомневаться, не признание плана. Затем, сдержавшись:
      «Ладно. Даю вам шанс исправиться. Доставьте посылку». Он не заставляет героев
      возвращаться к охоте; поручение доступно сразу. Если сцена отказа уже произошла
      в таверне, не разыгрывай её заново. Жители при успехе: «Вы спасли нас!»
      Платёж — один на весь отряд, факт «Награда за охоту: N золотых». gp не ресурс
      движка: кошелёк учитывается вручную, не выдуманным adjust_resource. После успешной
      охоты доставка предлагается наутро; после отказа — в том же разговоре:
      «Отнесите срочную посылку в город. Только ни в коем случае не заглядывайте
      в конверт». Конверт без печати; «Сургуч кончился, а дело срочное. Я вам доверяю».
      Доставка — десять золотых один раз по возвращении, только за выполненное поручение.
      Выдай конверт согласившемуся герою; отказ или задержка допустимы, не передавай
      письмо без их решения. Сохранённое недоверие не исчезает из-за праздника.
      clue_dark_creatures доступна только после наблюдения скелетов в лесу, не за
      переход или бой. Если герои рассказали о находке, присутствующие Ефим или Агафья
      подтверждают: «Прежде в этих лесах скелетов никогда не было». Без рассказа этой
      реплики нет. Через note_fact отдельно запиши свидетельство местных и кому
      сообщили находку; оно усиливает подозрение, не доказывает причину или виновника.
    npcs: [severin, agafya, efim]
    items: [envelope]
    clues: [clue_patron_odd, clue_patron_displeased, clue_dark_creatures]
    encounters: [patron_first_fight]
    exits: [tavern, city_road, village_night]
    checks:
      - id: festival_song
        description: "Герой поёт, пляшет или рассказывает у костра историю о бое с волками."
        skill: performance
        dc: 12
        on_success:
          text: >-
            Деревня запомнит героев. Запомни как факт: Ольховка любит героев — позже
            крестьяне охотнее пойдут за ними.
      - id: watch_patron_feast
        description: "Герой наблюдает за Северином на празднике."
        skill: insight
        dc: 18
        on_success:
          reveal: [clue_patron_odd]

  - id: city_road
    title: "Тракт на Вельград"
    read_aloud: >-
      Тракт на Вельград широкий и людный: телеги с репой, гуртовщики, паломники. Два дня
      пути и ночёвка на постоялом дворе. Конверт лежит в сумке и шуршит при каждом шаге.
      Край бумаги так и торчит из-под клапана.
    dm_notes: >-
      Искушение. Если герои открывают конверт на людях или в спешке — Ловкость рук СЛ 10,
      чтобы не помять бумагу и не привлечь чужих глаз. Если они одни и никто не торопит —
      без броска. При провале их отвлекает любопытная хозяйка постоялого двора, и они
      успевают прочесть только первую строку; ночью можно перечитать спокойно. Содержимое —
      раздатка envelope_contents. Ни слова об убийстве, только приметы и распорядок.
      Запомни как факт: герои заглянули в конверт. Не открыли — тоже нормально, улика
      догонит их в Кривом переулке. Дальше — на площадь Фонтанов (если в город входят
      к полудню) или сразу в Кривой переулок.
    items: [envelope]
    handouts: [envelope_contents]
    exits: [city_square, city_alley]
    checks:
      - id: peek_envelope
        description: "Герой заглядывает в конверт так, чтобы никто не заметил."
        skill: sleight_of_hand
        dc: 10
        on_success:
          reveal: [envelope_contents]
        on_failure:
          text: "Скрипит дверь, входит хозяйка с кувшином. Герой успевает прочесть лишь: «Приметы: высокий, седой…»"

  - id: city_square
    title: "Площадь Фонтанов"
    read_aloud: >-
      Площадь Фонтанов в полдень гудит, как улей. Вода бьёт из пастей бронзовых рыб,
      торговки кричат над корзинами. Вдруг толпа расступается: к главному фонтану неспешно
      выходит высокий седой человек в простом плаще. За его спиной держатся двое стражников.
      Люди кланяются. На доске у фонтана — указатель «Библиотечная башня: книги и
      старые карты», а рядом небольшой рисунок дорожного фонаря.
    dm_notes: >-
      Это Император Всеволод: по старому обычаю он каждый полдень выходит к фонтану
      говорить с горожанами. Высокий, седой, левый глаз прищурен — приметы из конверта.
      Если конверт читали — Внимательность СЛ 10, чтобы связать одно с другим. Если не
      читали — История СЛ 12, чтобы узнать Императора по профилю на монетах; совпадение
      всплывёт позже. Император добр, но говорит коротко; вооружённых стражники ближе трёх
      шагов не подпустят. Если прочитавшие письмо предупреждают об опасности, им пока
      не верят: «Приметы и распорядок — ещё не доказательство покушения». Не назначай
      бросок на автоматическое доверие, не выдавай союзный отряд или поддержку Императора.
      Герои могут добровольно отдать конверт страже для проверки и назвать адрес
      Получателя и место, где их найти. Это не признание заговора властями: дежурный
      принимает вещественную улику. Запиши передачу и местонахождение оригинала:
      письмо у стражи, его нельзя затем доставить или украсть с подоконника Получателя.
      Не отнимай письмо без решения героев. После проверки в тот же день за героями
      пришлют стражников, чтобы они показали адресата. Это сопровождение свидетелей,
      не арест героев. Согласившиеся ведут их в city_alley и могут сдать Получателя;
      отказ сопровождать тоже допустим. Если письмо только пересказали или показали,
      но не передали, стражников за ними автоматически не посылают. Без контакта не
      телепортируй патруль к уехавшим героям. Зафиксируй отдельно предупреждение,
      передачу конверта и согласие показать адресата; не считай расследование союзом.
      Эта городская ветка не отменяет последующие поручения Северина.
      Указатель позволяет уже при первом посещении зайти в miron_tower: там можно
      познакомиться с книжником и услышать необязательную просьбу «Свет на старой дороге».
      Объявление не означает, что Мирон сейчас в башне: проверь его судьбу и положение
      по фактам. Этот крючок не даёт аудиенции, не прерывает расследование конверта и
      не требует соглашаться; все прежние пути доступны без квеста.
    npcs: [emperor]
    clues: [clue_emperor_match]
    exits: [city_alley, village_rabbits, warn_guardians, village_night, miron_tower]
    checks:
      - id: notice_match
        description: "Герои читали конверт и смотрят на человека у фонтана."
        skill: perception
        dc: 10
        on_success:
          reveal: [clue_emperor_match]
      - id: know_emperor
        description: "Герой пытается понять, кто этот человек."
        skill: history
        dc: 12
        on_success:
          text: "Профиль с монет — это сам Император Всеволод."

  - id: miron_tower
    title: "Мирон и библиотечная башня"
    read_aloud: >-
      Над тесными крышами поднимается библиотечная башня. Каменные ступени ведут к
      читальному залу; у окна стоят стол с чернильницей и полки книг о дорогах и
      ремёслах. На стене висит чертёж масляного фонаря с большой круглой линзой.
    dm_notes: >-
      «Свет на старой дороге» — добровольное знакомство, около 30–45 минут за столом,
      не столько же времени в мире. Никаких торговцев, новых заклинаний или боя.
      Мирон исходно живёт здесь; показывай его только если жив, свободен и действительно
      здесь по фактам. Он кашляет, прячет испачканные чернилами пальцы и стесняется
      просить: надо достать старую линзу из заброшенной смотрительской и восстановить
      путевой фонарь у лесной развилки возле Вельграда. Прошлой зимой сын местной семьи
      возчиков потерялся; соседи давно нашли его живым, но мальчик боится темноты.
      Это не розыск ребёнка. Мирон пообещал семье свет: «Я обещал, что дорогу будет видно».
      Семья живёт у северных ворот города, не в Ольховке, и согласилась подливать масло;
      это не травница и не торговцы. Её дальнейшая судьба — по фактам, не гарантия спасения.
      За выполненную работу предлагает 10 золотых всему отряду из личных сбережений.
      Разговор, осмотр чертежа и обычные книги доступны без броска. Мирон охотно объяснит:
      подпереть балку, снять прижимное кольцо, вынуть линзу, закрепить её в кольце
      путевого фонаря, поставить фитиль, залить масло и зажечь. Запиши, кто понял
      устройство. В башне есть тряпица, масло и фитиль для этой работы; взятые припасы
      учитывай фактами, без grant_item. Не выдавай линзу до её извлечения.
      Если герои зовут и Мирон согласен и в силах, он может действительно пойти с ними,
      с остановками для отдыха; у механизма оживляется и даёт толковые советы. Не боец
      и не боевой маг; тяжёлую балку не держит. Можно оставить его отдыхать в башне и
      всё сделать самим по объяснению/чертежу. Сопровождение не условие успеха.
      Веди note_fact отдельными записями до 300 знаков: «Свет: предложен/принят/отложен/
      отказ/завершён» только по состоявшемуся разговору и решению; этапы «линза извлечена»,
      «линза установлена», «фонарь зажжён» только после действий. Отдельно — актуальный
      держатель/место линзы, состояние фонаря и припасов, где Мирон, жив ли, сопровождает
      ли и кого, время на каждый шаг и общий итог, награда выдана ли и кому. Новая запись
      уточняет прежнюю; при возвращении ничего не сбрасывай. Начальные условия из
      old_watchhouse действуют только при отсутствии более поздних фактов.
      После фактического ремонта и зажигания, когда герои сообщат результат, живой
      доступный Мирон в башне вручает из сбережений 10 золотых на весь отряд ОДИН раз;
      note_fact фиксирует передачу или отказ от подарка, без adjust_resource/grant_item.
      Одно посещение/бросок не выдаёт денег. При отсутствии, плене или смерти Мирона
      нет новых поручений и выплат от его лица; уже взятое дело можно закончить самим.
      Разрешение пользоваться обычными книгами остаётся личной благодарностью, без
      скрытых бонусов и бесплатных улик заговора. При добровольной честной помощи —
      set_npc_attitude friendly, но не для фактически hostile без реального примирения.
      Отказ/отсрочка не делает его врагом, не блокирует финальную помощь или обычную печать.
      Сам не раскрывает роль Стража, слова ритуала или Северина при знакомстве/награде.
      Но содержательные вопросы героев о Двери или реальные сведения не откладывай до
      акта 4: живой Мирон честно объясняет известное по guardian_truth; выдай эту раздатку
      при таком разговоре. При обсуждении закрытия/защиты печати даст ritual_words.
      Он знает правила, но не обман Северина; не приписывай ему готовое раскрытие заговора.
      Письмо Отшельника и убеждение при предупреждении — как в warn_guardians; дружба не
      доказательство и не пропуск к Императору. Переход туда не обходит старые условия.
      До city_square или городской встречи warn_guardians — 10 минут; путь в old_watchhouse
      описан там. Уйти и вернуться можно в любом статусе. Во время позднего отсчёта
      прибавляй реальные часы/дорогу к календарю, не сдвигай новолуние; предупреждение
      и атака важнее, отложить ремонт можно без отдельного сюжетного наказания.
    npcs: [miron]
    handouts: [guardian_truth, ritual_words]
    exits: [city_square, old_watchhouse, warn_guardians]

  - id: old_watchhouse
    title: "Смотрительская на старой дороге"
    read_aloud: >-
      Старая дорога идёт вдоль лесной опушки. У развилки стоит столб с железным
      масляным фонарём. Чуть дальше, за заросшей тропой, видна покосившаяся
      смотрительская: низкая крыша, тёмный дверной проём и серая от дождей стена.
    dm_notes: >-
      Смотрительская и развилка — один участок в нескольких километрах севернее
      Вельграда, между ними 100 шагов. Не wolf_forest у Ольховки: волков/скелетов здесь
      нет, их происхождение не связано с фонарём. До Ольховки два дня тракта от города;
      выход назад в miron_tower через северные ворота, не сразу в деревню.
      На подходе от башни можно идти по старой дороге без броска (1 час) или впервые
      искать заросшую короткую тропу через find_watchhouse_path (30 минут при успехе,
      при провале 1 час поисков и ещё 1 час по дороге). Проверку проводи здесь на
      подходе, не как замок перехода; запиши фактически выбранный путь и время.
      Известная тропа впредь не требует броска, занимает 30 минут в одну сторону;
      иначе дорога — 1 час. С Мироном добавляй 30 минут отдыха в каждую сторону.
      Начальный вид при отсутствии иных фактов: линза в старом сигнальном приборе
      внутри смотрительской, раму прижала покосившаяся балка; путевой фонарь у развилки
      цел, но без линзы и не зажжён. На столе под навесом лежат пригодные доски для
      подпорок. Нет тайной ловушки, осмотр с порога безопасен. Не повторяй исходный
      реквизит, если линзу уже вынули, унесли или установили; читай последние note_fact.
      Дай героям обсудить и согласовать план. Осмотр/разговор — 10 минут без броска.
      Быстро понять прижимное кольцо — inspect_lens_mount (10 минут); провал стоит
      ещё 1 час, после спокойного разбора устройство понятно. Альтернатива без броска:
      1 час изучения чертежа/механизма или 20 минут объяснения присутствующего Мирона.
      Эти знания не извлекают линзу сами и не заменяют устойчивую опору.
      Быстро удержать балку, пока другой вынимает линзу, — hold_watchhouse_beam,
      только при согласованном помощнике и понятном креплении (10 минут). При провале
      герои успевают отступить: +1 час на устойчивые подпорки, затем извлечение по их
      согласию без нового броска. Без риска можно сразу поставить подпорки и вдвоём
      неспешно вынуть линзу за 1 час, без проверки; одному безопасная работа займёт
      2 часа. Мирон может объяснять, но не считается помощником для тяжёлой балки.
      Провалы дают только указанную потерю времени: нет автоматического урона, гибели
      Мирона, необратимой поломки линзы или обязательного боя. Не перебрасывай тот же
      подход ради успеха; новый план/спокойная работа остаются доступны.
      После согласованного извлечения — note_fact «Свет: линза извлечена; у [держатель]».
      Только с реально добытой и принесённой линзой, понятым устройством и припасами
      герои могут за 30 минут закрепить кольцо, установить линзу, залить масло, поставить
      фитиль и зажечь фонарь; это отдельные согласованные действия, не итог одного check.
      Подпорки и согласованная помощь делают установку безопасной, без броска; знающие
      герои справятся без Мирона. Не взяли масло/фитиль — можно вернуться за ними,
      установка линзы ещё не означает зажигание. Отмечай через note_fact установку
      (линза теперь в фонаре), расход припасов и зажигание по отдельности, актуальное
      состояние/место реквизита и затем «Свет: завершён» только после реальной работы.
      Фонарь обычный масляный с линзой, НЕ hermit_lantern: не лечит, не усиливает в бою,
      не разоблачает личины, не защищает печать. Масло выгорает, без ухода свет не вечен.
      Записывай note_fact до 300 знаков: смену статуса (принят/отложен/отказ/завершён),
      этапы, время каждого шага и общий расход, где живой Мирон и сопровождает ли,
      текущие линзу/фонарь/припасы и выдана ли награда. Переход или проверка сами не
      завершают квест, не дают награды; деньги только при реальной передаче в башне.
      В любой момент можно уйти через miron_tower в city_square и вернуться к сохранённым
      этапам. Мирон не появляется из списка npcs: сверяй жизнь/плен/место, согласие
      идти и отдых; не воскрешай и не телепортируй. При его отсутствии уже принятое
      поручение выполнимо самостоятельно после изучения устройства. Во время позднего
      отсчёта учитывай все часы, не продлевай новолуние; при наступлении атаки приоритет
      основному сюжету, ремонт можно отложить без наказания за сам отказ.
    npcs: [miron]
    exits: [miron_tower]
    checks:
      - id: find_watchhouse_path
        description: "На первом подходе герой ищет короткую заросшую тропу вместо известной старой дороги."
        skill: survival
        dc: 12
        on_success:
          text: "Короткая тропа найдена: путь от башни занял 30 минут. Запиши маршрут и время, но не извлечение линзы."
        on_failure:
          text: "После часа поисков приходится идти по старой дороге ещё час. Путь открыт без нового броска; запиши оба часа."
      - id: inspect_lens_mount
        description: "Герой хочет быстро понять крепление, вместо спокойного изучения или объяснения Мирона."
        skill: investigation
        dc: 12
        on_success:
          text: "За 10 минут понятен порядок снятия прижимного кольца. Балке ещё нужна опора; линза пока в раме."
        on_failure:
          text: "Кольцо заклинивает; ещё час спокойного разбора позволяет понять крепление. Линза цела и пока не извлечена."
      - id: hold_watchhouse_beam
        description: "Герой быстро держит балку, пока согласившийся помощник снимает понятное крепление и вынимает линзу."
        skill: athletics
        dc: 12
        on_success:
          text: "Балка удержана. Согласованный помощник может закончить извлечение за 10 минут; запиши действие и держателя, но не готовый фонарь."
        on_failure:
          text: "Балка проседает, приходится отступить без травм. Ещё час на устойчивые подпорки позволит безопасно извлечь целую линзу без повторного броска."

  - id: city_alley
    title: "Кривой переулок"
    read_aloud: >-
      Кривой переулок узок, как щель. Дом с зелёной ставней стоит в самом конце: дверь
      заколочена, окна темны. Вы стучите — тишина. Долгая тишина. Потом наверху что-то
      скрипит, и из окна второго этажа медленно выдвигается деревянная лестница.
    dm_notes: >-
      Получатель — «пустой», неуклюжий подражатель людей, тварь того же рода, что и Северин.
      Вход через окно — его неловкая попытка повторить привычки прежнего хозяина-воришки;
      заколоченная дверь не волшебная. Игроки могут её открыть, без ложного тупика.
      Голос сверху: «Поднимайтесь. Дверь... она для других». Внутри голая комната: пыль, ни
      постели, ни посуды. Получатель смотрит на конверт и говорит: «Мне? Конверт? Зачем? Ах,
      конверт. Наверное, он нужен, правда? Его же отдали вам, значит он нужен. Так, а как его
      открыть? Ах да, он же открыт, какая удача!» Нестыковки: не моргает; от еды отказывается,
      будто не понимает, что с ней делать; повторяет за героями слова и жесты с опозданием;
      не прощается — стоит у окна и смотрит, пока герои не скроются за углом. Прочитав,
      кладёт бумагу на подоконник и забывает о ней: её можно стянуть (Ловкость рук СЛ 12).
      Запомни как факт: бумага из конверта у героев — это доказательство для Императора.
      О Северине: «Тот, кто дал. Он хороший. Он открывает». Если письмо не доставляют,
      сжигают или передают страже, запиши это: покушение по этой записке сорвано, но у
      культа остаются другие люди, следующие поручения не отменяются. Без конверта
      Получатель не произносит монолог о его получении, бумаги на подоконнике нет;
      take_letter доступен только после реальной доставки.
      Если герои передали конверт страже и согласились показать адресата, сюда они
      приходят со стражниками. Они могут указать на Получателя и рассказать о поручении,
      не вручая ему уже изъятое письмо. При таком представлении Получатель растерянно
      подражает людям и добровольно позволяет увести себя на допрос; запиши задержание,
      не запускай hollow_chase и не выдавай несуществующие боевые эффекты. Это локальное
      расследование, не мгновенное разоблачение Северина или всего культа. Не повторяй
      появление уже задержанного Получателя при следующем визите. Если герои сами
      атакуют до задержания, используй hollow_chase; NPC-стражники не добавлены в его
      боевой состав, не приписывай им атаки. При активном бое нельзя объявить побеждённого
      живым пленником: гибель и бегство определяются событиями движка, совместный бой
      со стражей требует ручного ведения. Без стражи нападение также запускает
      hollow_chase: Получатель защищается до возможности отступить по тактике статблока,
      а не исчезает без события движка. После гибели оболочка распадается туманом.
      При наблюдении покажи немигающие глаза и странное поведение; check даёт
      дополнительный вывод, не запрещает видеть очевидное.
      Дорога туда и обратно — четыре дня, ещё до трёх дней могут занять дела в городе.
      Если вернутся раньше недели, поля повреждены меньше; не прибавляй дни тайно.
    npcs: [recipient]
    items: [envelope]
    handouts: [envelope_contents]
    clues: [clue_recipient_odd]
    encounters: [hollow_chase]
    exits: [city_square, village_rabbits]
    checks:
      - id: read_recipient
        description: "Герой присматривается к хозяину дома."
        skill: insight
        dc: 12
        on_success:
          reveal: [clue_recipient_odd]
      - id: take_letter
        description: "Герой незаметно забирает бумагу с подоконника."
        skill: sleight_of_hand
        dc: 12
        on_success:
          reveal: [envelope_contents]
          text: "Бумага уже в рукаве. Получатель смотрит в окно и ничего не замечает."
        on_failure:
          text: "Получатель медленно поворачивает голову: «Это моё. Его же отдали. Значит, моё»."

  - id: village_rabbits
    title: "Обглоданные поля"
    read_aloud: >-
      Через неделю вы возвращаетесь в Ольховку — и не узнаёте полей. Там, где колосилась
      рожь, торчат голые обглоданные стебли. Капуста съедена до кочерыжек. По меже скачут
      серые зверьки — десятки, сотни. Посреди поля стоит крестьянин с пустыми руками.
    dm_notes: >-
      При уничтоженной или полностью изгнанной стае Матвей: «Кролики! Проклятые кролики!
      Они сожрали всё!» Дай связать события самостоятельно. «С тех пор как вы убили волков,
      кролики расплодились! Волки раньше ели кроликов, держали их численность в рамках.
      А теперь...» Это его объяснение, а не внезапное размножение за семь дней: кролики
      уже многочисленны после тёплой весны, без волков массово выходят из чащи к полям.
      Съедены молодые посевы, не выросший за неделю новый урожай. Недавний паводок испортил
      зерно в амбаре: отсюда риск голода. Уцелевшая часть стаи уменьшает ущерб, сохранённая
      стая — лишь небольшие потери. При защите полей заранее используй факты игроков
      вместо read_aloud полного разорения. Матвей благодарит за помощь, а не обвиняет.
      Северин раздаёт хлеб: «Император опять не поможет. Ему из замка не видно, как вы тут
      голодаете». Этот ропот ослабляет порядок, но своевременная помощь и предупреждение
      Императора срывают эту часть плана. Природа СЛ 10 нужна для оценки безопасной охоты
      и запасов; причинную связь Матвей объяснит и без проверки.
      За доставленную посылку плата десять золотых, без доставки — нет. Если Северин
      узнаёт от героев или реального свидетеля, что конверт отдан страже, доставка
      сорвана или Получатель задержан, он подозрительно спокоен: «Ну что поделать,
      не доставили и не доставили, ничего страшного». Ни гнева, ни расспросов, ни
      наказания; если ранее злился из-за волков, контраст особенно заметен. Не делай
      его всеведущим: пока никто не сообщил, этой реакции нет. Запиши сам разговор,
      сохрани судьбу письма и Получателя; это не меняет дальнейших поручений и не
      начинает досрочное разоблачение или месть. Следующее дело предлагается обычно.
      Слежка: «В горах живёт человек. Говорят, он безумен — поёт песни, разговаривает с камнями.
      Нам нужно знать: где он ходит, когда, как выглядит. Не трогайте его. Не говорите
      с ним. Просто смотрите и запоминайте». Десять золотых аванса всему отряду.
      Если Северин разоблачён или уже ушёл, поручение не появляется из ниоткуда:
      Агафья предлагает найти человека, который приносит ягоды и знает горные тропы.
      Раннее предупреждение и помощи Стражам остаются действительными.
    npcs: [matvey, severin, agafya]
    clues: [clue_wolves_rabbits, clue_patron_grumbling]
    exits: [fool_meadow]
    checks:
      - id: assess_rabbits
        description: "Герой оценивает, как остановить разорение полей, не уничтожая всех зверей."
        skill: nature
        dc: 10
        on_success:
          text: "Силки вдоль поля и сетки у посадок защитят посевы. Часть кроликов надо оставить лесным хищникам."
        on_failure:
          text: "Оценить безопасную численность не удалось. Матвей знает старого охотника, который поможет без повторного броска."
      - id: read_grumbling
        description: "Герой слушает, что и как Северин говорит крестьянам."
        skill: insight
        dc: 14
        on_success:
          reveal: [clue_patron_grumbling]

  # --- Акт 2. Слежка и сомнения ---

  - id: fool_meadow
    title: "Поляна в Седых горах"
    read_aloud: >-
      Седые горы встречают вас ветром и запахом чабреца. На высокой поляне человек
      в залатанной рубахе таскает ветки и, насвистывая, втыкает их в землю как попало.
      Шалаш у него выходит кривой, но сам он, кажется, очень доволен.
    dm_notes: >-
      Дурак. Задание — смотреть и не говорить. Он бормочет себе под нос: «Срочно! Надо
      построить шалаш вон там, а то вдруг кто-то пойдёт собирать грибы и заблудится, а тут
      шалаш!» Через пять минут бросает недостроенное: «Ой! Ягоды! Я же забыл! Крестьяне
      ждут!» — и уходит с песней. Он хаотичен, распорядка у него нет, всё делает
      «неправильно», но в итоге помогает: шалаш спасёт заблудившегося грибника, ягоды
      достанутся голодной Ольховке. При успешной Скрытности героев он не замечает:
      поёт для птиц и камней. При открытой встрече знает по рассказам деревни:
      «А, вы те, кто убил волков. Спасибо.
      Но кролики... вы не подумали о кроликах, да?» (если волков прогнали — «те, кто прогнал
      волков»). Заговорят — болтает о камнях, песнях и кроликах, про Стражей не скажет ни
      слова, но может обронить: «Я держу одну маленькую щёлочку. Чтобы было смешно».
      Запомни как факт, если герои с ним говорили. Вычислить маршрут нельзя при любом
      исходе проверки. Дальше — с отчётом к Северину.
    npcs: [fool]
    clues: [clue_no_route]
    exits: [patron_room]
    checks:
      - id: track_fool
        description: "Герой весь день идёт за Дураком и пытается понять, где он бывает и когда."
        skill: survival
        dc: 15
        on_success:
          reveal: [clue_no_route]
          text: "Герой не теряет его ни на миг — и всё равно не видит в его пути никакого порядка."
        on_failure:
          reveal: [clue_no_route]
          text: "Дурак исчезает за камнем и через час поёт на другом склоне, куда за час не дойти."
      - id: hide_from_fool
        description: "Герои прячутся, чтобы Дурак их не заметил."
        skill: stealth
        dc: 12
        on_success:
          text: "Дурак не замечает отряд. Герои видят, как он оставляет у тропы корзинку ягод для голодных путников."

  - id: patron_room
    title: "Комната Северина"
    read_aloud: >-
      Комната Северина над таверной опрятна до странности: ни пылинки, ни крошки. На столе
      стопка бумаг под чернильницей и полная кружка. Кресло у окна повёрнуто к холму
      с Чёртовыми воротами. Северин встаёт вам навстречу.
    dm_notes: >-
      Фаза отчёта — после поручения следить за Дураком, не просто при входе из таверны.
      Раньше можно поговорить или искать доступные бумаги, но не приписывай героям
      слежку и не выдавай задание о «колдуне» досрочно. Записи можно найти независимо
      от отчёта; новое посещение не восстанавливает уже забранные документы.
      Отчёт: распорядок Дурака записать не выходит: «Он ходит везде. Нет маршрута». Северин
      хмурится — впервые за всё время: «Плохо. Нам нужно знать, где он будет в полдень.
      Завтра. Один». Потом Ефим зовёт его вниз — «к вам гонец», — и Северин выходит на
      несколько минут. Записи на столе: Расследование СЛ 12 (быстро найти нужное) или
      Ловкость рук СЛ 12 (полистать и вернуть всё как было) — раздатка patron_notes.
      Попались — Северин улыбается с запозданием: «Любопытство — хорошее качество.
      Не злоупотребляйте им». Запомни как факт: герои читали записи Заказчика (или
      попались на этом). Затем новое задание: «В горах, за лесом, живёт мрачный колдун.
      Ходит по ночам с фонарём. Задержите его. Приведите в деревню. Допросим. И главное —
      не верьте его речам». Запиши выдачу через note_fact, не повторяй её при возвращении.
      После гор отчёт — в tavern; только там возможна поздняя отправка к ячейке.
      Из комнаты можно идти к ручью, в горы или к овину по адресу на реально прочитанных
      patron_notes. Это путь к уликам и без задания нанимателя. При нападении на
      присутствующего Северина — patron_first_fight. Если уже разоблачён, погиб или
      изгнан, не показывай его ради отчёта и не выдавай новых поручений; оставшиеся
      записи можно спокойно прочесть, путь к Стражам и овину остаётся открыт.
    npcs: [severin, efim]
    handouts: [patron_notes]
    encounters: [patron_first_fight]
    exits: [fool_stream, mountain_path, village_night, warn_guardians, tavern, cult_cell]
    checks:
      - id: search_notes
        description: "Герой быстро просматривает бумаги, пока Северина нет."
        skill: investigation
        dc: 12
        on_success:
          reveal: [patron_notes]
        on_failure:
          text: "Счета, списки, письма о ценах на зерно. На лестнице уже слышны шаги."
      - id: lift_notes
        description: "Герой листает бумаги и кладёт всё на место так, чтобы никто не понял."
        skill: sleight_of_hand
        dc: 12
        on_success:
          reveal: [patron_notes]
        on_failure:
          reveal: [patron_notes]
          text: "Герой успевает прочесть, но Северин, вернувшись, бросает взгляд на сдвинутую чернильницу."

  - id: fool_stream
    title: "Ручей в полдень"
    read_aloud: >-
      Горный ручей звенит на камнях. Место тихое и удобное: валуны, ивняк, тропинка к воде.
      Слишком тихое — даже птицы молчат. В ивняке что-то шевелится.
    dm_notes: >-
      Необязательная сцена. В ивняке засада ячейки Ключников: трое культистов с ножами ждут
      Дурака. Дурак так и не приходит — он ушёл за ягодами на другой склон. Культисты ждут
      до вечера и уходят ни с чем: отсюда провал ячейки в овине. Если герои только смотрят,
      они видят засаду (Внимательность СЛ 13). Вмешаются — бой stream_ambush; культисты
      дерутся молча. Автоматического бегства у этих культистов нет. До настоящего боя
      можно договориться о сдаче; пленный повторяет только: «Ключник велел».
      Запомни, кто жив, пленён и предупреждён. В овине другая группа той же ячейки,
      не воскресшие участники засады. Если заранее задержали всю ячейку, позднее останутся
      только бумаги. Успешно спасённый Дурак не погибает у этого ручья за кадром.
      Дальше — в горы, к Северину или предупредить остальных.
    clues: [clue_stream_ambush]
    encounters: [stream_ambush]
    exits: [patron_room, mountain_path, village_night, warn_guardians]
    checks:
      - id: spot_ambush
        description: "Герои осматривают берег, не выдавая себя."
        skill: perception
        dc: 13
        on_success:
          reveal: [clue_stream_ambush]
      - id: sneak_stream
        description: "Герои подбираются к ивняку незаметно."
        skill: stealth
        dc: 12
        on_success:
          text: "Культисты смотрят на тропинку и не оборачиваются. Герои могут наблюдать, уйти или выбрать момент для вмешательства; боевого бонуса это автоматически не даёт."
        on_failure:
          text: "Под ногой осыпаются камешки. В ивняке разом замирают."

  - id: mountain_path
    title: "Узкая тропа"
    read_aloud: >-
      За лесом тропа сужается до карниза: слева скала, справа обрыв и далёкий шум реки.
      Вверх она ведёт к перевалу и хижине, вниз — к Ольховке.
    dm_notes: >-
      Первая встреча: на узком месте, опершись на копьё, стоит Хоремхеб, Колесничий,
      в старом ухоженном доспехе, со щитом. Он поднимает ладонь: «Дальше нельзя.
      Там живёт мудрец. Он не любит гостей». Прикрывает Отшельника от убийц;
      старик рад гостям, но не знает их историю и не ждёт именно этих людей.
      Можно убедить, обойти или вызвать на безопасное испытание силы. Открытое объяснение
      задания при успехе Убеждения СЛ 15 позволяет пройти. Обход по скалам СЛ 14 при
      провале отнимает время и возвращает к тропе, без выдуманного 1d6 урона.
      Ручной вариант: Колесничий бьёт нелетально и стабилизирует павших; при своей
      нелетальной победе герои оставляют его живым, а Отшельник забирает его с тропы.
      При победе Хоремхеба: «Мне не нужны ваши жизни. Мне нужно, чтобы вы не шли дальше».
      Затем приходит кот Отшельника, и воин предлагает сначала выслушать гостей.
      Консоль не умеет нелетальный урон и автоматическую стабилизацию. Поэтому для
      согласованного безопасного поединка используй check trial_of_strength, без start_combat
      и снятия хитов. Если игроки выбирают настоящую атаку, предупреди о риске смерти,
      начни chariot_duel и следуй фактам движка. При 0 хитов NPC не объявляй живым.
      Если он отступил по тактике статблока, он жив; если погиб, замок Двери утрачен,
      остаётся неделя подготовки вместо двух. Это тяжёлая ошибка, не запрет хороших
      решений дальше. Дверь только треснула; смертельный финал ещё можно смягчить преемником
      и своевременным спасением остальных Стражей.
      Через note_fact сохрани исход встречи, жизнь и местонахождение Хоремхеба.
      Обратный проход hermit_hut → mountain_path → tavern и путь домой tavern →
      mountain_path → hermit_hut открыты. Не повторяй преграду, испытание или дуэль
      после первой встречи, не возвращай погибшего или ушедшего воина на пост.
      Отшельник участвует только если жив и действительно сопровождается отрядом;
      оставленный под охраной в деревне не разговаривает с героями в горах. После
      ячейки здесь можно обсуждать переданные ему факты; связный разговор возможен
      на защищённой дороге домой или по прибытии в hermit_hut. Полный clue_cult_plan
      без броска — лишь если рассказ и свидетельства связывают охоту с порядком,
      письмо с Императором, слежку с угрозой Дураку и приказы культа с нанимателем.
      Без достаточных сведений он задаёт вопросы, не раскрывает план из ниоткуда.
      Арест не обязателен: учитывай равноценные доказательства, найденные иным путём.
      Сам переход не открывает улик и не меняет охрану или судьбу NPC.
    npcs: [charioteer, hermit]
    clues: [clue_chariot_not_enemy, clue_cult_plan]
    encounters: [chariot_duel]
    exits: [hermit_hut, tavern]
    checks:
      - id: persuade_chariot
        description: "Герой убеждает воина пропустить отряд."
        skill: persuasion
        dc: 15
        on_success:
          text: "Воин долго молчит, потом отступает к скале: «Иди. Я буду рядом»."
        on_failure:
          text: "«Нет». Без злости — как о погоде."
      - id: climb_around
        description: "Герои обходят воина по скалам."
        skill: athletics
        dc: 14
        on_success:
          text: "Отряд перебирается по камням выше тропы. Воин смотрит вслед и не мешает."
        on_failure:
          text: "Узкий уступ обрывается. Приходится вернуться к тропе и искать другой подход; Хоремхеб подаёт руку."
      - id: trial_of_strength
        description: "Герой принимает предложенное Хоремхебом безопасное испытание: вытеснить его за черту без оружия."
        skill: athletics
        dc: 16
        on_success:
          text: "Хоремхеб отступает за черту: «Сильные. Теперь объясните, кто вас послал». Он пропустит отряд к Отшельнику."
        on_failure:
          text: "Хоремхеб удерживает место, но никого не ранит. Можно поговорить с ним или поискать обход."
      - id: read_chariot
        description: "Герой присматривается к воину."
        skill: insight
        dc: 12
        on_success:
          reveal: [clue_chariot_not_enemy]

  - id: hermit_hut
    title: "Хижина Отшельника"
    read_aloud: >-
      За перевалом прячется хижина, увитая хмелем. Внутри тепло: пучки трав под потолком,
      на лавке лежит лоскутное одеяло, у очага сложены сухие дрова.
    dm_notes: >-
      Показывай только живых и фактически присутствующих NPC. При первой встрече
      Отшельник улыбается: «А! Гости! Наконец-то. Я думал, когда же вы придёте».
      Это радушие одинокого старика, не предвидение. Ставит чайник, гладит кота.
      «Я — Отшельник. Один из пяти. Мы держим мир закрытым». Знает Стражей, правила
      Двери и угрозу ослабления печати, но не план культа, роль Северина или связь
      волков, конверта и слежки. Историю героев узнаёт только из их рассказа. Не молчит
      ради интриги: новых данных ещё нет. На вопросы отвечает прямо, отделяя знания
      о Двери от догадок о людях. Без имён врагов объясни guardian_truth и открой
      раздатку без броска; lore само не включается в контекст. Мирон — больной книжник
      башни Вельграда, с рождения Страж знания; знает свою роль, но считает Ворота
      надёжно запертыми. Колесничий — живой замок движения.
      При законном аресте согласен идти на допрос: «Допрос при свидетелях. Я отвечу».
      Просит защиты от любого обвинителя, а не потому, что уже знает зло Северина.
      Не заставляй арестовывать старика ради информации. Уточни, кто сопровождает и
      охраняет его; через note_fact сохрани жизнь, место, согласие и переданные сведения.
      Путь в деревню и обратно — через mountain_path и tavern. Старик не направляет
      в овин: адрес получают в поздней фазе таверны либо из действительно найденных
      бумаг. Нет автоматического hut → cult_cell и передачи старика обвинителю.
      Поздняя фаза: после ареста ячейки герои забирают старика из согласованной охраны
      либо продолжают путь с ним и защищённо сопровождают домой через mountain_path.
      По прибытии он сопоставляет их рассказ, принесённые приказы и показания живых
      пленных. Не выдавай чужие знания за его воспоминания; запиши, что именно узнал.
      При подтверждённой связи охоты с угрозой полям и ропотом: «Волки? Да, вы убили
      волков. Кролики расплодились. Голод. Недовольство Императором. Всё по плану культа».
      Если стаю сохранили, поля защитили или голода нет, говори о сорванном замысле,
      не о случившемся. Письмо и совпадение распорядка указывают на покушение на
      Императора. При рассказе о слежке и засаде или приказах: «Дурак? Вы следили за
      ним. Зачем? Он безобиден. Но культ хочет знать, когда он уязвим. Чтобы убить».
      Если не следили, не приписывай слежку героям. Поручение об аресте ячейки,
      «Передайте тому, кто вас послал», угрозы в приказах и подтверждённый почерк
      позволяют увидеть зачистку подручных. Лишь при доказанной связи с нанимателем:
      «Культ хочет убить нас всех. Вы — их оружие». Отказавшимся: «Вас хотели сделать
      оружием». «Не верьте мне. Сложите сами». Это вывод из улик, не обвинение заранее.
      Полный clue_cult_plan открой без обязательного check лишь когда свидетельства
      связывают охоту с порядком, письмо с Императором, слежку с угрозой Дураку и
      приказы культа с нанимателем. Недостающие звенья остаются вопросами; частичное
      разоблачение не открывает всю сводку. Арест не является ключом: если ячейка
      пропущена или погибла, герои сами сопоставляют найденные документы и могут
      сообщить их живому Отшельнику позже. При его гибели выводы доступны без него.
      Раннее доказательство тоже работает; не жди этой сцены и прекрати новые
      поручения разоблачённого нанимателя. Смена сцены сама ничего не доказывает.
      При первом визите подари hermit_lantern: «Возьмите. Он светит на то, что есть».
      Открой lantern_instructions: чужой истинный облик виден без ослабления свойства,
      но не принадлежность к культу и не замысел. Старик не указывает подозреваемого;
      осознанно посветить на Северина можно сразу. Дай ritual_words: инструкции
      остаются при гибели Стражей. Преемник принимает роль добровольно и осознанно.
      Ни фонарь, ни смена ночи не убивают NPC; спасение и согласованная охрана сохраняются.
    npcs: [hermit, charioteer]
    items: [hermit_lantern]
    handouts: [guardian_truth, lantern_instructions, ritual_words]
    clues: [clue_cult_plan]
    exits: [mountain_path, village_night, warn_guardians]
    checks:
      - id: read_hermit
        description: "Герой пытается понять, не лжёт ли старик."
        skill: insight
        dc: 10
        on_success:
          text: "Старик отвечает искренне: говорит, что знает, и не скрывает, чего ещё не знает. Он готов выслушать ваши сведения."
      - id: lantern_lore
        description: "Герой изучает подаренный фонарь."
        skill: arcana
        dc: 13
        on_success:
          text: "Огонь в фонаре не греет и не чадит. Такой свет не обманешь личиной: в нём видно то, что есть."

  - id: cult_cell
    title: "Гнездо в старом овине"
    read_aloud: >-
      Старый овин на краю Ольховки. Внутри полутемно, пахнет прелым сеном.
      Сквозь щели в досках свет ложится полосами на земляной пол.
    dm_notes: >-
      Необязательная сцена: герои приходят по поручению из таверны или по адресу
      из действительно найденных документов. Наниматель сюда не приходит.
      При первой встрече здесь четверо культистов в серых плащах: на коленях, руки
      сложены, головы опущены, никто не связан. Это отдельная группа, не участники
      засады у ручья и не связанный курьер из таверны. Если ячейку уже задержали,
      разогнали или убили, не создавай новых людей; остаются только ещё не забранные
      бумаги. Учитывай судьбы каждого, не повторяй бой и добычу.
      Они готовы сдаться: «Мы не справились с задачей. Мы принимаем наказание.
      Передайте тому, кто вас послал, что мы очень сожалеем о провале».
      На «С какой задачей?» — «Убить Дурака». Это признание, а не обязательные
      последние слова. При разговоре открой clue_cell_task; герои вправе арестовать,
      защитить и допросить сдавшихся без боя. У старшего за поясом cell_orders;
      добровольно выданные или найденные при осмотре приказы читаются без броска.
      Для compare_handwriting СЛ 12 нужен сохранённый конверт, копия адреса или
      конкретное воспоминание о его почерке; без образца нет сравнения. Провал не
      отнимает бумаги и не мешает собственным выводам игроков.
      «Наказание» — яд в питье от другого сообщника, не магическая смерть. Он должен
      реально получить доступ к пленникам; дай заметить попытку и вмешаться. Изоляция
      от чужой еды и воды и надзор спасают их. Фонарь обычный яд не обнаруживает.
      Пленные знают отдельного связанного курьера из таверны и при обещанной защите
      могут подтвердить, какие приказы тот доставлял. Не добавляй его в cell_fight
      и не уничтожай вместе с четвёркой; исход засады также не меняет его судьбу.
      При настоящей атаке героев используй только cell_fight с четырьмя культистами.
      Урон и исход разрешает движок: при 0 хитов NPC погиб, не объявляй его пленником.
      Сдача до боя позволяет сохранить всех живыми; нелетальность и бегство нельзя
      приписать вопреки событиям движка. Казнь не обязательна; отказ от неё не
      запирает расследование. Через note_fact запиши исход, каждого живого/погибшего,
      место и охрану пленных, добытые приказы, показания и кому их передали.
      Отшельник здесь только если жив и фактически взят с отрядом; тогда может сразу
      обсуждать услышанное, не ждёт формального перехода. Полный clue_cult_plan без
      броска — лишь если факты связывают охоту с порядком, письмо с Императором,
      слежку с угрозой Дураку и приказы культа с нанимателем. Связный разговор возможен
      в безопасной дороге домой и в хижине. Если оставлен под охраной, сначала вернитесь в tavern,
      заберите его по согласию и проводите mountain_path → hermit_hut. Если уже
      сопровождается, выход в mountain_path ведёт домой, без обязательной остановки
      в таверне. Отсутствующего или погибшего старика не показывай; герои могут
      сопоставлять улики сами и позже сообщить их живому свидетелю.
    npcs: [hermit]
    handouts: [cell_orders]
    clues: [clue_cell_task, clue_same_handwriting, clue_cult_plan]
    encounters: [cell_fight]
    exits: [tavern, mountain_path, village_night, warn_guardians]
    checks:
      - id: compare_handwriting
        description: "Герой сравнивает найденные приказы с сохранённым конвертом, копией адреса или конкретным воспоминанием о его почерке."
        skill: investigation
        dc: 12
        on_success:
          reveal: [clue_same_handwriting]

  # --- Акт 3. Правда ---

  - id: village_night
    title: "Ночь раздумий"
    read_aloud: >-
      Ночь над Ольховкой тихая и звёздная. В таверне гаснут огни.
      С холма смотрят Чёртовы ворота: чёрный проём на фоне неба.
      Пора решить, что всё это значит.
    dm_notes: >-
      Сцена размышлений, не автоматическое раскрытие по переходу. Обычный маршрут:
      первый hermit_hut → mountain_path → tavern (поздняя выдача) → cult_cell → забрать
      охраняемого в tavern либо идти с уже сопровождаемым → mountain_path → hermit_hut
      (сопоставление) → ночь. Это ориентир, не обязательный арест или порядок действий.
      При первом знакомстве старик знает правила Двери, не заговор; позднее узнаёт
      сведения из рассказов и документов. Если его не арестовали, не вернули домой
      или он погиб, герои расследуют сами; живому можно принести сведения позже.
      Дай выложить только реально найденное. Связи для ведущего: волки → кролики →
      угроза голода → ропот на Императора; конверт с распорядком — покушение; слежка
      за Дураком — поиск уязвимости; запрет верить «колдуну» — изоляция Стража;
      ячейка «убить Дурака», почерк и попытка зачистить свидетелей поручением из таверны.
      Не приписывай героям совершённые другими действия или последствия сорванных планов.
      Полный clue_cult_plan доступен без броска, когда факты связывают охоту с порядком,
      письмо с Императором, слежку с угрозой Дураку и приказы культа с нанимателем.
      Рассказ Отшельника без этих свидетельств не достаточен. connect_clues оценивает
      уже известное, не открывает пропущенное. Фонарь доказывает чужой облик, не весь
      замысел. Ранние выводы игроков допустимы: не задерживай разоблачение до этой ночи.
      При нехватке данных доступны Дурак, письмо, горы и овин; овин находят по ранее
      полученному адресу или реально прочитанным бумагам, не просто по списку exits.
      Через note_fact сохрани выводы, сведения, кому их сообщили, местонахождение и
      согласованную охрану старика и каждого пленника. Ночь не убивает их автоматически.
      Показывай только присутствующих живых NPC; вернуться за стариком можно в tavern.
      Выбор можно менять: помощь — warn_guardians; разговор с ещё присутствующим
      Севериным — patron_unmasked; ожидание — quiet_days; служба — patron_service.
      Только ещё не разоблачённый Северин может предложить последнее дело. После
      разоблачения, гибели или изгнания нет новых поручений, пленных и появления ради
      сцены. При нападении на присутствующего Северина — patron_first_fight;
      фактический исход сохраняется.
    npcs: [severin, hermit, agafya, charioteer]
    clues: [clue_cult_plan]
    encounters: [patron_first_fight]
    exits: [patron_unmasked, warn_guardians, quiet_days, patron_service, city_road, fool_meadow, mountain_path, cult_cell, hermit_hut, tavern]
    checks:
      - id: connect_clues
        description: "Герой ищет проверяемую связь в уже найденных уликах, а не просит раскрыть ещё неизвестные события."
        skill: investigation
        dc: 10
        on_success:
          text: "Найденные факты совпадают. Можно проверить подпись и адрес, предупредить тех, кого описывают документы, или спросить свидетелей."
        on_failure:
          text: "Прямого доказательства пока нет. Найденные улики не исчезают; можно проверить их на месте или разыскать свидетеля."

  - id: patron_unmasked
    title: "Маска падает"
    read_aloud: >-
      Северин сидит у окна спиной к вам и смотрит на холм. Он не оборачивается, когда вы
      входите. Свеча на столе горит ровно: пламя не дрогнуло даже от сквозняка из открытой
      двери.
    dm_notes: >-
      Разоблачение — если герои выкладывают Северину улики. Он не отпирается: «Вы умны.
      Но уже поздно. Стражи мертвы». Если все Стражи живы, вместо «мертвы» — «скоро будут».
      Улыбка запаздывает уже откровенно. Говорит мало: «Голодные плохо любят своих
      королей». Если на него посветить фонарём Отшельника, на миг видно, что под лицом
      пустота, а в ней — звёзды чужого неба. Измени отношение Северина на hostile. Если
      атакуют — бой patron_first_fight, слабая человеческая оболочка с тактикой отступления.
      Уход — только по событию бегства или уничтожения оболочки в движке, не на
      произвольно выбранном раунде. Он говорит: «Вы не можете убить тьму просто мечом».
      Это хвастовство: оболочка уязвима, а сущность уничтожит закрытие Двери после её
      поражения. Запомни как факт: Северин разоблачён. Наутро его комната
      пуста; в Заречье никакого старосты Северина не знают. Дальше — предупредить Стражей
      или ничего не делать.
    npcs: [severin]
    encounters: [patron_first_fight]
    exits: [warn_guardians, quiet_days]

  # --- Акт 4. Подготовка ---

  - id: warn_guardians
    title: "Предупредить Стражей"
    read_aloud: >-
      Вельград снова встречает вас шумом площади Фонтанов. Только теперь вы смотрите на
      город иначе: на высокий замок, на узкую библиотечную башню над крышами, на прохожего,
      который слишком долго не моргает.
    dm_notes: >-
      Три встречи в любом порядке. При первом городском поручении, пока есть только
      конверт или его пересказ, раннему предупреждению не верят: действуют правила
      city_square, письмо можно передать страже и показать Получателя. Нельзя обойти
      это недоверие переходом сюда и броском audience_evidence или audience_no_evidence.
      Задержание Получателя само по себе ещё не доказывает весь заговор. Позднее, после
      расследования Дурака, Отшельника или ячейки, на аудиенцию пустят свидетелей заговора.
      Бумага из конверта, её точный пересказ или приказы ячейки вместе с новыми сведениями
      дают Убеждение СЛ 10; без документов — СЛ 16. Успех:
      Император меняет распорядок, шлёт в Ольховку зерно (ропот стихает) и даёт отряд
      стражи. Запомни как факт: Император предупреждён, отряд стражи — союзник. Провал:
      стражу удвоят, но отряда не будет. Дурак находит героев сам, на рынке, с корзиной
      ягод: «А я знал, что вы придёте! Ягоды будете?» Позовут — придёт в Ольховку;
      под защитой он не появляется у ручья без сопровождения. Мирон в башне знает,
      что он Страж, но не знает об обмане Северина. Бледен, кашляет, бережёт силы для
      печати. При предупреждении объясняет правила по guardian_truth, даёт ritual_words
      и помогает сопоставить найденные документы. Если письмо Отшельника действительно
      передано, верит без проверки; отсутствие письма само не доказывает смерть старика.
      Иначе Убеждение СЛ 12 при неубедительном объяснении. Медицина может облегчить
      симптомы, но не даёт магического исцеления и не заменяет доказательства заговора.
      При провале Мирон не откажется спасать мир: просит день на сверку книг и письма,
      это задержка, не тупик. Запиши, кто приглашён и кто согласился: предупреждение
      Императора не означает автоматическое согласие Мага или остальных. Если кто-то
      уже погиб, не ставь его на рынок ради этой сцены. Вельград можно предупредить
      раньше акта 3; те же союзники и защита сохраняются до финала.
      В башню можно пройти через miron_tower и вернуться (10 минут в пределах города).
      Сверь, где Мирон и свободен ли: если ушёл с героями, пленён или погиб, не ставь
      его снова за стол. Живой знакомый Мирон помнит честную помощь с дорожным фонарём
      и личное доверие, но дружба не доказывает заговор: письмо Отшельника, реальные
      сведения и проверка при неубедительном объяснении работают по прежним условиям.
      Ранее выданные guardian_truth/ritual_words сохраняются, не требуй заслужить их
      вновь. Ни ремонт, ни отказ от него не меняют условия Императора, согласие других
      Стражей или возможность финальной помощи. Поздний ремонт можно отложить ради
      предупреждения/обороны без отдельного наказания, календарь при этом не замирает.
    npcs: [emperor, fool, miron, charioteer]
    handouts: [guardian_truth, ritual_words]
    exits: [two_weeks, village_night, city_square, miron_tower]
    checks:
      - id: audience_evidence
        description: "После дальнейшего расследования герои предупреждают Императора, подкрепляя документы новыми сведениями, не только первым конвертом."
        skill: persuasion
        dc: 10
        on_success:
          text: "Император долго смотрит на бумагу. «Двое у входа. Смена в полночь. Это знают немногие». Он верит."
      - id: audience_no_evidence
        description: "После расследования Дурака, Отшельника или ячейки герои предупреждают Императора без документов; не первое городское поручение."
        skill: persuasion
        dc: 16
        on_success:
          text: "Император щурит левый глаз и кивает: «Я поверю вам. Не заставьте меня пожалеть»."
        on_failure:
          text: "Вежливая благодарность, удвоенная стража и ни одного человека для Ольховки."
      - id: convince_miron
        description: "Герои уговаривают Мирона ехать в Ольховку."
        skill: persuasion
        dc: 12
        on_success:
          text: "Мирон закрывает книгу: «Если это правда, мне нужно быть там»."
      - id: treat_miron
        description: "Жрец или лекарь облегчает кашель Мирона."
        skill: medicine
        dc: 12
        on_success:
          text: "Впервые за месяц Мирон дышит свободно — и смотрит на героев с доверием."

  - id: two_weeks
    title: "У вас две недели"
    read_aloud: >-
      Вы возвращаетесь в Ольховку под вечер. У околицы, на камне, вас ждёт знакомая фигура.
      Человек поднимается навстречу, и по его лицу понятно: вести недобрые.
    dm_notes: >-
      Колесничий, если жив: «Вы сделали то, что должны были. Но это не конец. У культа много
      последователей. Они идут сюда. У вас две недели». Если Колесничий убит, героев ждёт
      Отшельник, и исходный срок вдвое короче: «Неделя. Больше Дверь не даст». Если мертвы
      оба, весть приносит живой Дурак; если и он погиб — гонец Мирона или Агафья с показаниями
      разведчиков. Не показывай погибшего посланником. Затем: «Маг слаб. Защитите его».
      Ключники придут в ночь новолуния, Ольховка стоит на единственной дороге к холму.
      Дату наступления запиши один раз при раскрытии угрозы: через четырнадцать дней,
      при погибшем Колесничем через семь. В quiet_days идёт тот же отсчёт; его последующая
      гибель сдвигает прежнюю дату на семь дней раньше, не начинает новую неделю.
      При возвращении из ожидания или другой сцены сообщай фактический остаток, не выдавай
      снова две недели. Уже наступившая дата означает нападение, а не новую подготовку.
      Доверие жителей и ранее выполненные дела сохрани; паника не отменяет заслуг героев.
    npcs: [charioteer, hermit, fool, agafya, miron]
    exits: [preparation]

  - id: preparation
    title: "Подготовка Ольховки"
    read_aloud: >-
      Ольховка затаилась. Люди стоят у заборов и смотрят то на вас, то на голый холм за
      деревней. Поля обглоданы, кролики скачут прямо по улице, кузницы в деревне нет. Зато
      есть руки, топоры, старый оплывший ров у околицы — и немного времени.
    dm_notes: >-
      Исходно до атаки четырнадцать дней, при погибшем Колесничем семь. Возьми фактический
      остаток из записанной даты; переход сюда из ожидания или кузни не обнуляет срок.
      При остатке меньше недели доступны лишь срочный караул, укрытие и эвакуация,
      а не завершение недельной тренировки или поставка из города. Два недельных этапа;
      в каждом герои с жителями ведут два проекта параллельно и одну тренировку.
      Четверо могут разделить руководство: двое едут за кузнецом (четыре дня дороги),
      двое остаются. На тренировку нужен свободный герой или живой Колесничий; это не
      третий общественный проект. В один день не приписывай герою два разных места.
      В сумме четыре проекта и две тренировки, при неделе два проекта и одна тренировка.
      Ранее сделанные работы сохраняются. Каждый проект: один руководитель, один
      заранее объявленный check при реальном риске. Провал расходует время и даёт
      неполный результат; без повторного броска, новый этап исправления требует проекта.
      Сход: Убеждение СЛ 13 при недоверии, без проверки если доверие уже заслужено.
      Неуспех — жители работают после личного примера героев, не исчезают навсегда.
      Проекты: 1) охота и сетки, Выживание СЛ 12 — спасены посадки, мясо засолено,
      мораль +1, жители: «Мы пойдём за вами»; новая рожь до битвы не вырастет.
      2) ров и частокол, Атлетика СЛ 12 — защита +2; местных топоров хватает, кузнец
      не обязательный замок задачи. Неудача — прореха, используйте scouts_breach.
      3) кузнец и оружие — city_forge; атака +1, инструмент и двадцать копий.
      4) укрытие Мага, Расследование СЛ 12 — караул, тропа к холму, безопасный дом.
      Неудача — открытая слабость; укажи её сразу, можно выделить героя в охрану на
      финале вместо расхода проекта. 5) союзники, Убеждение СЛ 12 — просят городской
      отряд; уже обещанный Императором отряд не требует второй покупки. При провале
      придут только двое добровольцев, полный отряд не записывать. 6) эвакуация детей
      и стариков — склад припасов и убежище, спасает жителей даже при прорыве.
      Ополчение начинает со степени 1 «вилы и храбрость». Первая недельная тренировка
      повышает до 2 «держат строй» только при наличии оружия; иначе подготовка есть,
      степень повысится при его получении. Второе обучение даёт 3 «ополчение».
      С Колесничим без броска; герой-наставник — Атлетика СЛ 13. Степень 3 недостижима
      без двух тренировок и оружия, но достижима за две недели. Не отменяй успешное
      обучение из-за отдельного провала схода. Снабжение оружием атакой +1 и степень
      ополчения не складываются в вымышленные модификаторы атак персонажей.
      Волна 1: целые укрепления — scouts_fortified, иначе scouts_breach. Волна 2:
      степень 3 либо степень 2 с провизией/полным союзным отрядом — main_holds;
      иначе main_panic. До начала боя высокую мораль можно применить через rally_militia,
      а не автоматически объявить победу. Дурак помогает эвакуации, не вычёркивает
      уже созданного противника из боя. Укрытие Мага сохранено — есть возможность
      закрыть Дверь без жертвы при целых замках. Отмечай лишь завершённые проекты.
      Открой prep_tasks здесь, не в начале кампании; в раздатке указаны исходные две недели,
      фактический сокращённый срок скажи отдельно. Уход к разведчикам — начало атаки,
      только после истечения срока или явного решения героев принять бой раньше.
    npcs: [agafya, matvey, charioteer, miron, fool]
    handouts: [prep_tasks]
    exits: [city_forge, defense_scouts]
    checks:
      - id: organize_peasants
        description: "Герои собирают деревню на сход и распределяют работу."
        skill: persuasion
        dc: 13
        on_success:
          text: "Агафья первой берёт лопату. За ней — остальные."
        on_failure:
          text: "Люди отводят глаза: «А ну как они и нас...» Пример нужен делом, а не словом."
      - id: rabbit_hunt
        description: "Герои ведут крестьян на облаву на кроликов."
        skill: survival
        dc: 12
        on_success:
          text: "Силки, загоны, собаки — к вечеру мяса хватит на коптильню, а поля можно засеять озимыми."
        on_failure:
          text: "Кроликов стало меньше, но не намного: дело выполнено наполовину."
      - id: build_palisade
        description: "Герои руководят работами на рву и частоколе."
        skill: athletics
        dc: 12
        on_success:
          text: "Ров углублён, колья вбиты, ворота в частоколе на крепком засове."
        on_failure:
          text: "Частокол стоит, но с прорехой у ручья: ведущий решает, где разведчики её найдут."
      - id: train_militia
        description: "Герой-наставник проводит недельную тренировку ополчения без Колесничего."
        skill: athletics
        dc: 13
        on_success:
          text: "Ученики понимают команды. Запиши успешную тренировку; степень повысится при наличии оружия, но не выше третьей."
        on_failure:
          text: "Простые упражнения освоены, но строй рассыпается. Эта неделя не повысила степень; следующую можно посвятить новому обучению."
      - id: recruit_allies
        description: "Герои посвящают недельный проект поиску полного городского отряда, если его ещё не обещали."
        skill: persuasion
        dc: 12
        on_success:
          text: "Город присылает отряд с командиром и запасом провизии. Запиши полный союзный отряд."
        on_failure:
          text: "Вызвались лишь двое добровольцев. Они помогут выводить жителей, но заменить боевой отряд не смогут."
      - id: guard_mage
        description: "Герои готовят Мирону безопасное место и караул."
        skill: investigation
        dc: 12
        on_success:
          text: "Каменный погреб старосты, двое караульных, тайная тропа к холму. Маг защищён."
        on_failure:
          text: "Укрытие найдено, но в нём есть слабое место. Ведущий решает, какое."
      - id: treat_mage
        description: "Жрец лечит Мирона."
        skill: medicine
        dc: 12
        on_success:
          text: "Кашель отступает. В ночь новолуния Мирон сможет говорить громко и долго."

  - id: city_forge
    title: "Кузня Гордея"
    read_aloud: >-
      Кузня Гордея стоит у городской стены, и звон из неё слышен за квартал. Внутри жарко,
      как в печи. Широкоплечий кузнец с опалённой бородой не отрывается от наковальни, пока
      не докует подкову.
    dm_notes: >-
      Гордей родом из-под Ольховки. Убеждение СЛ 14 — переехать на время осады и привезти
      походный горн, инструмент и двадцать копий из запасов мастерской. Это не постройка
      каменной кузницы за ночь. При провале остаётся честный заказ за тридцать золотых:
      инструмент и готовые копья, сборка за день. Деньги считают вручную; речь о кошельке
      всего отряда, не о расходе ячеек или хитов. Если денег нет, можно договориться о
      долге под поручительство Агафьи либо помочь починить мастерскую через help_forge.
      Успех помощи даёт оплату трудом, провал — просьбу вернуть долг после осады, не тупик.
      Поездка туда-обратно занимает четыре дня, сделка один; укладывается в недельный
      проект, а не в полнедели. Запиши, получены ли forge_tools и militia_weapons.
      Копья, луки и молот Гордея — для ополчения, не автоматическое усиление атак героев.
      Частокол можно строить местными топорами даже без кузнеца. После возвращения
      продолжи тот же недельный этап подготовки, не начисляй новый бесплатный проект.
    npcs: [gordey]
    items: [forge_tools, militia_weapons]
    exits: [preparation]
    checks:
      - id: persuade_gordey
        description: "Герой уговаривает Гордея перебраться в Ольховку."
        skill: persuasion
        dc: 14
        on_success:
          text: "Гордей кладёт молот: «Ольховка, говоришь... Я там мальчишкой кузнечиков ловил. Поехали»."
        on_failure:
          text: "«Город кормит. Скую, что надо, — а ехать не проси»."
      - id: help_forge
        description: "Герой помогает Гордею у горна."
        skill: athletics
        dc: 12
        on_success:
          text: "Мехи, клещи, вода — работа идёт вдвое быстрее. Заказ готов к отъезду."

  # --- Акт 5. Финальная битва ---

  - id: defense_scouts
    title: "Первая волна"
    read_aloud: >-
      Ночь новолуния. Ольховка не спит: у околицы горят костры, люди сжимают вилы и топоры.
      Со стороны леса, низко над травой, ползёт туман — слишком густой для этой поры. В нём
      мелькают тени.
    dm_notes: >-
      Разведчики ищут слабые места. При готовом целом частоколе scouts_fortified — двое,
      остальные не прошли заграждения. Без укреплений или при прорехе scouts_breach —
      четверо. Выбери ровно один вариант по записанным фактам, не запускай оба.
      Даже в нейтральной ветке учитывай реально выполненные работы. Огонь на крыше —
      угроза для жителей, не автоматический урон или смерть; заранее проведённая
      эвакуация их спасает. Ручной вариант допускает пожар через три раунда, но в консоли
      таймер отсутствует: последствия описывай после исхода боя, не меняя его события.
      Победа — пожар потушен, поражение — жители отступают в убежище, мораль падает.
      При уходе героев не объявляй волну отбитой. После успешной обороны до следующей
      волны час отдыха; движение сцен и восстановление хитов — не одно и то же.
      Пленного не создавай вместо погибшего противника: только если фактически захвачен,
      он скажет «Ключник придёт к Воротам сам». После отступления доступно эпиложное
      спасение жителей, но не победный финал.
    npcs: [agafya]
    encounters: [scouts_fortified, scouts_breach]
    exits: [defense_main, door_gate, epilogue]
    checks:
      - id: spot_scouts
        description: "Герои высматривают разведчиков в тумане."
        skill: perception
        dc: 13
        on_success:
          text: "Герои заранее различают разведчиков и успевают предупредить жителей. Начало боя и инициативу разрешает движок, без автоматического боевого бонуса."
        on_failure:
          text: "Разведчики замечены уже у домов. Если начинается бой, попадания и урон определяет движок; бесплатной первой стрелы нет."

  - id: defense_main
    title: "Вторая волна"
    read_aloud: >-
      Из тумана выходят они — серые плащи, десятки, молча и ровным шагом. Ни криков,
      ни факелов, только тихий звон ключей на поясах. Где-то позади заплакал ребёнок.
    dm_notes: >-
      Основная масса врага занята ополчением; движок разрешает только прорыв к героям.
      Степень 3 либо степень 2 с провизией или полным союзным отрядом — main_holds:
      трое культистов. Иначе main_panic: пятеро и элитный Ключник. Ровно один вариант.
      Оружие нужно для степени 2; хороший строй без еды устаёт. Если герои попытаются
      вернуть бегущих до создания боя, rally_militia СЛ 14 при успехе даст main_holds.
      Это один шанс на конкретную ситуацию, не бесконечные уговоры и не замена боя
      после старта. Высокая мораль означает меньше бегущих и желание спасать соседей;
      «атака +1» от оружия — показатель подготовки, не бонус броскам героев.
      Дурак, если приглашён и жив, помогает выводить жителей; не вычёркивай противника
      из уже начавшегося боя. При выполненной эвакуации беженцы выживают даже при прорыве.
      По итогам запиши сохранённые дома, раненых и отступление. Победа не восстанавливает
      автоматически хиты: перед подъёмом к холму есть безопасное место для перевязки.
      Герои могут спасать деревню либо сразу идти к Двери: оставленную волну не считай
      побеждённой, но нельзя заставлять играть все бои, когда их цель — закрыть проём.
    npcs: [agafya, fool]
    encounters: [main_holds, main_panic]
    exits: [door_gate, epilogue]
    checks:
      - id: rally_militia
        description: "Строй дрогнул — герой собирает ополчение до начала боя."
        skill: persuasion
        dc: 14
        on_success:
          text: "Люди останавливаются, оборачиваются — и возвращаются в строй. Используй main_holds."
        on_failure:
          text: "Крик тонет в топоте. Используй main_panic."

  - id: door_gate
    title: "Чёртовы ворота"
    read_aloud: >-
      Холм за Ольховкой. Чёртовы ворота больше не похожи на руину: в каменном проёме
      клубится темнота, глубже самой ночи, и оттуда тянет холодом. Темнота шепчет — каждому
      своим голосом, тем, который он больше всего хочет услышать. У проёма стоит Северин.
      Только теперь это не совсем Северин.
    dm_notes: >-
      Проверь факты: какие Стражи живы, целы ли замки, прочитано ли слово открытия,
      защищён ли Мирон, есть ли ritual_words. Не показывай погибшего NPC живым.
      Заказчик и два Ключника — door_final. Бой разрешай движком, без автоматической
      победы на третьем раунде. Фонарь раскрывает настоящее лицо; если его не получили,
      тварь всё равно видна у Двери и может быть побеждена обычными атаками.
      Шёпот не заставляет героев действовать: door_whisper используют при добровольном
      приближении к проёму, а не каждый ход. Провал — тревожное видение, не снятие
      движения, испуг или падение без события движка.
      Консольный вариант: сперва отбить охрану, затем работать над печатью вне боя.
      При четырёх живых героях вариант рассчитан на их базовые атаки, без обязательного
      лечения или мультиатак. Защищённый живой Мирон с целыми пятью замками закрывает
      ещё не распахнутую Дверь без жертвы; это его известное умение, не check игрока.
      Без подготовки культисты срывают обычную печать и хватают Мага до подхода героев;
      он не погибает автоматически. После победы его освобождают, но нужна аварийная
      печать. Если укрытие было с прорехой, герои могут до боя назначить реальный караул,
      узнать засаду и сохранить обычную печать — запиши их решение и расходы времени.
      Аварийный ритуал нужен при распахнутой Двери, утраченных замках или сорванной печати.
      Маг либо обладатель ritual_words объясняет цену до начала: один доброволец
      удерживает проём изнутри и не возвращается. Им может быть герой, Страж или
      согласившийся преемник. Одного достаточно для аварийной печати; мир теряет
      погибших ранее Стражей и выбранного добровольца, не весь отряд по произволу.
      Преемник принимает свободную роль осознанным обетом; перед финалом нельзя
      назначить случайного пленника. Живой Страж не передаёт роль без своего согласия.
      Слова можно получить у живого Мирона, из записи Отшельника или вырезанной на
      внутренней стороне ворот инструкции: три самостоятельных этапа, arcana СЛ 15.
      Рисунок букв даёт stone_instructions без броска при осмотре, так что отсутствие
      Мага не тупик. Запиши каждый этап: имя порога, имя замка, слово закрытия.
      Успех приближает закрытие, неуспех расходует время, но не отменяет предыдущие
      этапы. Можно пробовать новый этап работы с новой ценой: каждый провал усиливает
      разлом, третий провал делает дальнейшую попытку этой ночью невозможной.
      Не перебрасывай одну и ту же проверку без новой попытки и последствий.
      Если игроки отказываются от жертвы, разреши эвакуацию и открытый проём; не
      назначай их погибшими или победителями. При полном бездействии живые последние
      Стражи заранее сообщают, что возьмут аварийный ритуал на себя. Если их уже убили,
      требуется доброволец, мёртвые не возвращаются. При поражении в бою возможен уход,
      закрытие не гарантировано. Запиши закрытие, добровольца, судьбы Стражей и деревни.
      При 0 хитов оболочка Заказчика уничтожена по правилам. Если Дверь пока открыта,
      сущность отступает в Изнанку; последующее закрытие той же ночью обрывает нить
      и уничтожает её навсегда. Если оболочка ещё действует, закрытая Дверь лишает её
      возвращения: добейте её в обычном бою, не объявляй мгновенную смерть живого actor.
      Ручной вариант за столом: защищать ритуал Мага три раунда одновременно с боем;
      это отдельный способ вести ту же сцену, не заявленная автоматизация консоли.
    npcs: [severin, miron, hermit, charioteer, fool]
    handouts: [ritual_words, stone_instructions]
    encounters: [door_final]
    exits: [epilogue]
    checks:
      - id: door_whisper
        description: "Герой добровольно всматривается в открытый проём и пытается отличить видение от реальности."
        save: wis
        dc: 12
        on_success:
          text: "Манящий голос чужой. За ним нет того, кого герой ждёт."
        on_failure:
          text: "В проёме мелькает знакомое лицо, но оно не выходит. Герой сам решает, верить ли видению."
      - id: ritual_threshold
        description: "Вне боя герой приступает к первому этапу аварийного ритуала: назвать имя порога по инструкции."
        skill: arcana
        dc: 15
        on_success:
          text: "Имя порога произнесено. Запиши завершение первого этапа."
        on_failure:
          text: "Тьма разрывает круг мела. Запиши один провал и потраченное время; этап не завершён."
      - id: ritual_lock
        description: "После завершения первого этапа герой называет объединяющую печать: «Единство»."
        skill: arcana
        dc: 15
        on_success:
          text: "Имя замка произнесено. Запиши завершение второго этапа."
        on_failure:
          text: "Холод гасит свечу. Запиши один провал и потраченное время; прежний этап сохранён."
      - id: ritual_close
        description: "После двух завершённых этапов и объяснения цены герой произносит слово закрытия при согласившемся добровольце."
        skill: arcana
        dc: 15
        on_success:
          text: "Печать отзывается. Если доброволец подтвердил согласие и удерживает проём, аварийное закрытие завершено."
        on_failure:
          text: "Слово ещё не удерживает камни. Запиши провал; при третьем суммарном провале ритуал этой ночью больше невозможен."

  - id: epilogue
    title: "Рассвет"
    read_aloud: >-
      На востоке светлеет небо. Над Ольховкой смешались запахи дыма и росы; далеко на
      холме чернеют древние камни. Ночь позади. Теперь придётся назвать по именам тех,
      кто вернулся, и тех, кого здесь больше нет.
    dm_notes: >-
      Сначала итог фактов: закрыта ли Дверь, живы ли герои и Стражи, спасены ли жители,
      уничтожена ли сущность Северина. Только потом тон финала. Не воскресить павшего
      героя, не погубить спасённого Стража и не назвать открытую Дверь закрытой.
      Светлый исход: все пятеро живы, обычная печать восстановлена, деревня спасена.
      Ольховка встречает героев; если Император предупреждён, благодарит лично. Через год
      о них поют. Имён, классов и авторства игроков не меняй.
      Искупление: Дверь закрыта аварийной печатью, мир спасён, доброволец не вернулся.
      Назови погибших и тех, кто добровольно принял свободные роли. Прежнее служение
      Заказчику не отнимает заслуги спасения. Если не все роли заняты, новые Стражи
      нужны в будущем, но не возникают автоматически.
      Горький нейтральный исход: герои полностью бездействовали, покушения не сорваны,
      последние Стражи сами принесли жертву. Их больше нет; постоянная защита исчезла,
      аварийная печать пока держится. Мир спасён на этот раз, не защищён навечно.
      Если хоть кого-то спасли или вмешались, используй смешанный исход по фактам,
      а не эту заготовку «потеряли всех».
      Провал или отказ: Дверь осталась открыта. При эвакуации выжившие начинают путь
      беженцев, без неё потери больше. Это возможный конец или завязка продолжения,
      не победа из-за одного лишь достижения epilogue. При гибели всего отряда расскажи
      последствия со стороны деревни, не обращайся к мёртвым как к живым.
      При уничтоженной оболочке и закрытой Двери сущность Северина сгинет; при живой
      оболочке он может оставаться врагом, при открытой Двери уйдёт за подкреплением.
      Необязательное эхо «Света на старой дороге»: только если фонарь действительно
      восстановили и зажгли, семья выжила и свет поддерживают, можно показать позднее
      возвращение к Вельграду — у развилки мальчик идёт рядом с родителем в круге света.
      Не переноси эту семью к Ольховке одним рассветом; если герои не возвращаются,
      допустима короткая отдельная зарисовка, лишь при подтверждённой судьбе семьи.
      Ремонт сам никого не спасает, не воскрешает Мирона, не зажигает пустой фонарь
      навечно и не превращает поражение в победу. Если условия не выполнены, пропусти
      эпизод без упрёка за невзятое поручение.
      Заверши фактами состояния мира и тем, что выбрали сами игроки, без упрёков.
    npcs: [agafya, emperor, fool, miron, hermit, charioteer]
    exits: []

  # --- Ветки ---

  - id: quiet_days
    title: "Тихие дни"
    read_aloud: >-
      Дни в Ольховке идут один за другим, тихие и серые. Крестьяне ловят кроликов силками,
      Северина в таверне больше не видно. А с тракта приходят вести — и каждая хуже
      предыдущей.
    dm_notes: >-
      Не проматывай две недели одной фразой. День 3: весть о готовящейся засаде на Дурака.
      День 6: убийцы ищут Императора у фонтана. День 9: Ключники идут в горы к Колесничему.
      Между вестями дай игрокам возможность вмешаться. Уже предупреждённые, спасённые
      или уведённые в другое место Стражи не гибнут по старому плану. Если никто не
      вмешивается, Дурак погибает на третий день, Император на шестой, Колесничий на
      девятый. Запиши факты; сам факт ранения Императора не равен смерти. При его гибели
      начнётся спор за власть, при помощи хлебом бунта может не быть.
      Кот с hermit_note приходит только от живого Отшельника. Если тот погиб раньше,
      Мирон присылает гонца с ritual_words и принимает решение о добровольной жертве
      сам. При двух живых последних Стражах они держат аварийную печать вместе;
      один остаётся внутри, другой завершает слова и теряет свою силу. При полном
      бездействии остатки культа убивают завершившего ритуал после его истощения.
      Но герои могут защитить его: «все погибли» не обязательный исход при вмешательстве.
      Ритуал происходит у door_gate после решения игроков, не закрывай Дверь здесь
      заранее и второй раз в финале. На сцену приходят вести, а не уже готовый финал.
      Решили помочь — warn_guardians или preparation, сохраняя прошедшие дни. Пока
      Колесничий жив, седьмой день оставляет недельный этап, тринадцатый — лишь срочную
      эвакуацию или караул. Его гибель сдвигает записанную дату атаки на семь дней раньше:
      при бездействии до девятого дня срок уже истёк, предупреждай о нападении сразу,
      не продолжай мирное ожидание до четырнадцатого. Прежние работы не исчезают.
      Последствия волны определяются фактами, а не названием нейтральной ветки.
    npcs: [agafya, matvey]
    handouts: [hermit_note, ritual_words]
    exits: [warn_guardians, preparation, defense_scouts, door_gate]

  - id: patron_service
    title: "Последнее поручение"
    read_aloud: >-
      Северин принимает вас в своей комнате над таверной. На столе кошель, тяжелее прежних,
      и чистый лист бумаги. Он улыбается — на этот раз почти вовремя.
    dm_notes: >-
      Негативная ветка: герои продолжают работать на Заказчика. Последнее поручение:
      «В Вельграде, в библиотечной башне, живёт юноша. Мирон. Он болен, и в городе ему не
      помогут. Приведите его к Воротам в ночь новолуния — там ему станет легче. Обещаю».
      Плата — сто золотых после поручения, не автоматически выданный кошель. Сначала
      разговор с Севериным в Ольховке, затем поездка в башню; Мирон не находится сразу
      в двух местах. Он знает свою роль, но верит, что письмо от Отшельника настоящее:
      Северин подделал просьбу восстановить печать. Даёт лист miron_request, где слово
      открытия скрыто среди лечебных молитв. Мирон хочет сверить текст в дороге.
      Герои могут показать настоящие ritual_words, предупредить о Северине, отказаться
      от доставки или привезти юношу к другим Стражам. При этом маршрут меняется через
      warn_guardians или village_night; не заставляй их всё равно прийти к Воротам.
      Если согласятся без проверки, Мирон сопровождает, но нападение на него не
      является условием задания. Одна только поездка ещё не открыла Дверь и не убила
      Стражей. Негативный исход наступает от выполненного обмана, а не ярлыка ветки.
    npcs: [severin, miron]
    handouts: [miron_request]
    exits: [door_opens, warn_guardians, village_night]

  - id: door_opens
    title: "Дверь отворяется"
    read_aloud: >-
      У Чёртовых ворот холоднее, чем в деревне. Мирон разворачивает принесённый лист,
      Северин зажигает чёрную свечу. Внутри каменного проёма трава неподвижна даже на
      ветру. Юноша хмурится: «Это не похоже на лечение. Почему здесь имя порога?»
    dm_notes: >-
      Остановись до произнесения слова. Северин убеждает Мирона прочесть поддельную
      молитву. Если все пять замков целы и порядок восстановлен, обман не открывает
      Дверь: Северин вынужден сначала сломать печать, и у героев ещё есть время.
      При ослабленном замке (погибший Страж или реальный голод и подорванный порядок)
      слово Мага открывает проём в новолуние. Смерть Колесничего делает обряд возможным
      ещё на неделю раньше. Касание камня само ничего не делает; предупредить Мирона,
      убрать поддельный лист или отвлечь Северина можно до чтения. Обычное предупреждение
      не требует проверки — Мирон и сам сомневается. Прочёл, потому что герои настаивали
      или молчали, — запиши «Дверь полностью открыта». Он в ужасе: «Это слово открытия!
      Мне подменили молитву». Северин: «Спасибо. Без вас мне пришлось бы ждать ещё
      сто лет». Если чтение сорвали, сохрани успех: «полностью открыта» не возникает.
      Улика о цене доступна при прочтении ritual_words либо осмотре камней; arcana
      СЛ 13 объясняет, почему подмена опасна, но базовый выход не прячется за броском.
      После реального открытия бой у door_gate и аварийный ритуал с объяснённой жертвой.
      До открытия можно отвести Мага под защиту и вернуться к подготовке с оставшимся
      временем. При нападении до открытия — patron_first_fight; после открытия финальный
      облик и бой доступны в door_gate. Даже погибшая оболочка не открывает Дверь сама.
      Герои сами выбирают, осознали ли ошибку; не записывай их эмоции за них.
    npcs: [severin, miron]
    clues: [clue_door_price]
    handouts: [miron_request, ritual_words, stone_instructions]
    encounters: [patron_first_fight]
    exits: [door_gate, preparation, warn_guardians]
    checks:
      - id: understand_door
        description: "Герой сверяет поддельную молитву с надписью на Двери."
        skill: arcana
        dc: 13
        on_success:
          text: "«Открой» обращено к ослабленной печати, а «Предел» её замыкает. Можно остановить чтение до открытия; уже открытой Двери нужна аварийная печать."
        on_failure:
          text: "Тонкость подмены пока непонятна. Надпись и памятка всё равно читаемы; можно остановить обряд и спросить Мирона, не объявляя Дверь открытой."

npcs:
  - id: severin
    name: "Северин"
    description: >-
      Элегантный человек средних лет в тёмно-зелёном камзоле. Ухоженные руки, мягкий
      голос, располагающая улыбка. Называет себя старостой соседнего Заречья.
    personality: >-
      Обычно обаятелен и щедр: помнит имена, угощает, говорит тепло. Но при открытом
      отказе убивать волков злится и отвергает любые объяснения про кроликов; после
      вспышки предлагает доставку как шанс исправиться. Это clue_patron_displeased,
      не прямое признание. Узнав о провале доставки или сдаче Получателя страже,
      напротив, подозрительно спокоен: «Ну что поделать, не доставили и не доставили,
      ничего страшного». Не расспрашивает, не мстит; пока сам не разоблачён, продолжает
      поручения. Без сообщения не знает о случившемся. Позднее из таверны показывает
      отдельного связанного курьера, изображая противника культа, и отправляет героев
      арестовать ячейку; к овину не идёт. После разоблачения насмешлив, будто играл
      с детьми, но новых поручений уже не выдаёт.
    secrets:
      - "Заказчик, глава культа Ключников, тварь из-за Двери в человеческом облике. Никакого Северина в Заречье нет."
      - "Не ест и не пьёт: поднимает кружку, но в неё не заглядывает. Улыбается с запозданием — копирует чужие лица."
      - "Поручения против Стражей: волки и кролики — по порядку Императора, конверт — покушение, слежка — по Дураку, «колдун» — Отшельник, последнее дело — Мирон. Отшельник сначала не знает этого плана и роли нанимателя."
      - "Позднее поручение в таверне — зачистка провалившейся ячейки руками героев. Отдельный связанный курьер служит мнимым доказательством непричастности; его жизнь учитывается отдельно. Разоблачённый, погибший или изгнанный Северин не выдаёт это и другие новые поручения."
      - "Ищет возможность убить Отшельника без свидетелей, если получит доступ. Охрана и сопровождение срывают покушение; ночь и переходы сами старика не убивают."
      - "Оболочку можно уничтожить обычным оружием; сущность отступает в Изнанку. После поражения оболочки закрытие Двери той же ночью обрывает связь и уничтожает сущность."
    attitude: friendly
    home: tavern
    statblock: patron_mask

  - id: efim
    name: "Ефим"
    description: "Трактирщик «Ольхового листа»: лысый, усатый, в чистом фартуке. Всегда что-то протирает."
    personality: >-
      Добродушный и словоохотливый, любит пересказывать слухи. Северина обожает: тот
      щедро платит и всегда хвалит пиво. Ничего не знает, но многое видел.
    secrets:
      - "Заметил, что Северин ни разу не допил кружку, и считает его просто воспитанным человеком."
    attitude: friendly
    home: tavern
    statblock: srd:commoner

  - id: agafya
    name: "Агафья"
    description: "Староста Ольховки: крепкая седая женщина в платке, с натруженными руками и строгим взглядом."
    personality: >-
      Прямая и рассудительная, говорит коротко: «Дело говори». Отвечает за каждый двор
      и боится голода больше, чем волков. Если герои честны с деревней, станет их главной
      опорой.
    attitude: friendly
    home: tavern
    statblock: srd:commoner

  - id: matvey
    name: "Матвей"
    description: "Крестьянин лет сорока, жилистый, с обветренным лицом. Его поле съедено первым."
    personality: >-
      Простой и горячий: сначала кричит, потом думает. Не злопамятен. Говорит
      по-деревенски, с присказками. Если герои помогут вернуть поля, пойдёт за ними первым.
    attitude: neutral
    home: village_rabbits
    statblock: srd:commoner

  - id: recipient
    name: "Получатель"
    description: "Худой человек неопределённого возраста в слишком большом сюртуке. Смотрит не мигая."
    personality: >-
      Говорит медленно, будто подбирает слова из чужого словаря. Переспрашивает,
      повторяет последние слова собеседника, радуется очевидному. Не злой — пустой.
    secrets:
      - "«Пустой» — неуклюжий подражатель людей, тварь того же рода, что и Северин. Должен подготовить покушение на Императора по бумаге из конверта."
      - "Если напасть, убегает по стене и крышам. Убитый, рассыпается серым туманом."
    attitude: neutral
    home: city_alley
    statblock: hollow

  - id: fool
    name: "Дурак"
    description: "Лохматый человек в залатанной рубахе, с корзинкой и вечной песней. Так его зовут все в округе, и он не спорит."
    personality: >-
      Говорит быстро и восторженно, перескакивает с мысли на мысль, разговаривает
      с камнями и птицами. Всё делает «неправильно», но в итоге выходит на пользу.
      Неожиданно точно говорит правду — и тут же о ней забывает.
    secrets:
      - "Страж Двери, воплощение наивности. Пока он жив и беззаботен, держится его часть Двери."
      - "Распорядка у него нет, поэтому культ не может подстеречь его одного."
    attitude: friendly
    home: fool_meadow
    statblock: srd:commoner

  - id: charioteer
    name: "Хоремхеб"
    description: "Воин в старом, но ухоженном доспехе, с копьём и щитом без герба. Лицо спокойное, усталое."
    personality: >-
      Немногословен, говорит короткими фразами. Уважает честность и не терпит уловок.
      Не любит драться, предпочитает обойтись без жертв и предлагает безопасное
      испытание; настоящий бой может закончиться смертью. Верен Отшельнику.
    secrets:
      - "Колесничий, Страж Двери, воплощение движения. Если он погибнет, Дверь приоткроется раньше срока."
      - "Предпочитает безопасный поединок. Нелетальный урон и стабилизация возможны при ручном ведении, но не поддерживаются в текущем консольном бою."
    attitude: neutral
    home: mountain_path
    statblock: chariot

  - id: hermit
    name: "Отшельник"
    description: "Седой старик в залатанном халате, с добрыми морщинами у глаз и старым медным фонарём."
    personality: >-
      Неторопливый, тёплый, ироничный. Угощает чаем, говорит притчами, но, если спросить
      прямо, отвечает прямо. Ни в чём не винит героев. Обожает своего кота.
    secrets:
      - "Страж единства света и тьмы. Знает Стражей, правила Двери и угрозу печати, но при первом знакомстве не знает плана культа, роли Северина и связей волков, конверта, слежки. Новых данных ещё нет, он не скрывает готовый ответ."
      - "Сопоставляет только сообщённое героями, найденные приказы и показания ячейки; полный разговор обычно после её ареста и защищённого сопровождения домой. Арест не обязателен для знания: достаточные сведения можно принести позже или собрать без него."
      - "Согласен на законный допрос при свидетелях и просит защиты от любого обвинителя. Северин ищет возможность убить его без охраны; защита и сопровождение спасают, автоматической смерти ночью нет."
    attitude: friendly
    home: hermit_hut

  - id: miron
    name: "Мирон"
    description: "Бледный худой юноша в чернильных пятнах, с книгой под мышкой. Часто кашляет."
    personality: >-
      Застенчив, рассеян, доверчив до наивности. Прячет пальцы в чернильных пятнах,
      извиняется за кашель и не любит говорить о болезни. Оживает над книгами и
      оптическим механизмом: показывает, как поймать свет линзой, забывает стесняться.
      Пообещал местной семье возчиков восстановить дорожный фонарь для мальчика,
      которого соседи нашли прошлой зимой: «Я обещал, что дорогу будет видно».
      Стесняется просить сильных незнакомцев о помощи; сам не справится с балкой.
      Может добровольно сопровождать с отдыхом и объяснять устройство, но не боевой маг.
      Узнаёт честных помощников, помнит разговоры и отказ без обиды; дружба не делает
      его всезнающим и не отменяет реальной вражды после насилия или обмана.
    secrets:
      - "Маг, Страж Двери, воплощение знания. Знает свою роль и слова закрытия, но ещё не знает, что Северин подменяет ритуальную молитву."
      - "Произнесённое им слово открытия при ослабленном замке и новолунии распахивает Дверь. Касание камня безопасно."
      - "Обычное знакомство и награда за фонарь не раскрывают роль/слова. Но на содержательные вопросы о Двери или реальные сведения отвечает честно: guardian_truth, при обсуждении закрытия — ritual_words. Не знает заговора заранее; условия аудиенции и проверки сведений остаются из warn_guardians."
      - "«Свет на старой дороге»: miron_tower ↔ old_watchhouse, возле Вельграда, не Ольховки. Линза и масло — обычные реквизиты, не фонарь Отшельника. Без квеста доступны основная история, обычная печать и помощь Мирона в финале; отказ и отсрочка не вражда."
      - "Перед каждой сценой сверяй note_fact: предложен/принят/отложен/отказ/завершён, линза извлечена/установлена, фонарь зажжён, актуальное положение реквизита и его состояние, понимание устройства, время, награда. Пиши отдельными фактами до 300 знаков, новое состояние уточняет старое; переходы не сбрасывают этапы."
      - "Исходно живёт в башне. note_fact хранит где он, жив ли, свободен ли, кого добровольно сопровождает и отдых. Список npcs не перемещает его: погибший/пленный/отсутствующий не выдаёт новых поручений и денег. Уже принятую работу можно закончить без него, зная устройство."
      - "Сбережения в башне: 10 золотых ОДИН раз всему отряду только после реального ремонта и зажигания, при личной передаче живым доступным Мироном. note_fact фиксирует выплату/отказ от подарка; не grant_item/adjust_resource. Обычные книги без бонусов и улик; честная помощь — friendly, но не автоматическое примирение с hostile."
    attitude: neutral
    home: miron_tower
    statblock: srd:commoner

  - id: emperor
    name: "Император Всеволод"
    description: "Высокий седой человек в простом плаще. Левый глаз прищурен, взгляд внимательный."
    personality: >-
      Спокоен, говорит мало и по делу. Ценит прямоту и доказательства. Любит свой город
      и каждый полдень выходит к фонтану говорить с горожанами.
    secrets:
      - "Страж Двери, воплощение порядка. Его сила — в верности людей: голод и ропот ослабляют его и Дверь."
      - "Распорядок из конверта верен до мелочей: полдень — фонтан, вечер — замок, ночь — покои, двое у входа, смена в полночь."
    attitude: neutral
    home: city_square

  - id: gordey
    name: "Гордей"
    description: "Широкоплечий кузнец с опалённой бородой и руками в старых ожогах."
    personality: >-
      Неразговорчив, работу ставит выше слов. Отвечает односложно, пока не тронут его
      за живое. Скучает по деревне, где вырос.
    attitude: neutral
    home: city_forge
    statblock: srd:commoner

items:
  - id: wolf_tails
    name: "Волчьи хвосты"
    description: "Связка серых волчьих хвостов. Число равно фактически убитым волкам, не более двадцати за четыре группы; трофеи и уже оплаченные хвосты ведущий учитывает отдельно."

  - id: envelope
    name: "Конверт Северина"
    description: >-
      Плотный конверт без сургуча: из-под клапана выглядывает край бумаги. Ровным почерком
      с наклоном выведено: «Вельград, Кривой переулок, дом с зелёной ставней».

  - id: hermit_lantern
    name: "Фонарь Отшельника"
    description: "Старый медный фонарь с мутным стеклом. Огонь в нём горит ровно и не чадит."

  - id: forge_tools
    name: "Железо и инструмент Гордея"
    description: "Скобы, гвозди, пилы, заступы и пара ломов — всё, что нужно для рва и частокола."

  - id: militia_weapons
    name: "Оружие для ополчения"
    description: >-
      Двадцать копий, четыре охотничьих лука и точёные наконечники. Подходят для строя
      и караула. Передача деревне фиксируется фактом и не меняет атаки персонажей.

clues:
  - id: clue_patron_odd
    text: >-
      Северин ни разу не отпил из своей кружки, хотя поднимал её с каждым тостом. И улыбается
      он чуть позже, чем надо, — будто сперва смотрит, как улыбаются другие.

  - id: clue_patron_displeased
    text: >-
      «Заказчик недоволен». Стоило вам отказаться убивать волков, как Северин разозлился
      и перестал слушать. Он отвергает любые доводы про кроликов, даже если скот можно
      защитить без охоты. Почему его так раздражает сохранение волков — будто он
      рассчитывал именно на их исчезновение? Но он всё же предлагает «исправиться»
      доставкой посылки. Это подозрение, не доказательство его замысла.

  - id: clue_rabbit_bones
    text: >-
      На месте отдыха волков — кроличьи кости и шерсть. Ни овечьих, ни коровьих костей;
      у деревенских хлевов волчьих следов не находили. Найденные остатки — кроличьи.

  - id: clue_dark_creatures
    text: >-
      «Тёмные твари». На обратной тропе Ольхового леса вы заметили двух живых скелетов:
      голые кости движутся сами. Среди зелени и птичьих голосов эта нежить выглядит
      тревожно и неуместно. Откуда она взялась и что подняло кости, неизвестно.
      Это повод для подозрений, но причина и виновник пока не установлены. О прежних
      встречах с нежитью стоит расспросить местных; сама находка ничего не говорит
      об истории леса и не объясняет других странностей.
    visibility: dm

  - id: clue_emperor_match
    text: >-
      Человек у фонтана — сам Император Всеволод. Высокий, седой, левый глаз прищурен,
      в полдень — у фонтана, за спиной двое стражников. Всё как в бумаге из конверта.

  - id: clue_recipient_odd
    text: >-
      Хозяин дома ни разу не моргнул. От еды отказался, будто не знает, что с ней делать.
      Чужие слова и жесты он повторяет с опозданием — как тот, кто учится быть человеком
      по чужим лицам.

  - id: clue_wolves_rabbits
    text: >-
      Волки сдерживали уже многочисленных после тёплой весны кроликов. Потеря стаи
      открывает зверькам путь к посевам. Угроза урожаю и испорченные паводком запасы
      вызывают голод. Сохранённая стая и вовремя защищённые поля уменьшают ущерб.

  - id: clue_patron_grumbling
    text: >-
      Северин говорит о равнодушии Императора громко, при всех, и следит, кто кивает.
      Он не утешает — он сеет ропот.

  - id: clue_no_route
    text: >-
      «Он ходит везде. Нет маршрута». У Дурака нет ни распорядка, ни привычек: никто
      не скажет, где он будет завтра в полдень. Даже он сам.

  - id: clue_stream_ambush
    text: >-
      В ивняке у ручья прячутся трое с ножами. Полдень, ручей — всё как в записке Северина.
      Они ждут Дурака, а он не приходит.

  - id: clue_chariot_not_enemy
    text: >-
      Воин не угрожает, а просит. Он не хочет никого убивать и сам боится этого боя —
      не за себя, а за того, кого охраняет.

  - id: clue_cell_task
    text: "Ячейка должна была убить Дурака — в полдень, у ручья, где он будет один."

  - id: clue_same_handwriting
    text: >-
      Приказы ячейки написаны тем же ровным почерком с наклоном, что и адрес на конверте
      Северина. Приказы культу отдаёт Северин.

  - id: clue_cult_plan
    text: >-
      Свидетельства складываются в замысел: убрать волков, чтобы кролики съели поля
      и люди возроптали на Императора; передать убийце его приметы и распорядок;
      слежкой найти, когда Дурак один. Приказы культа связаны с Северином: Заказчик
      и есть глава культа. Героям предназначалась роль его орудия, а Стражам — гибель.
      Сорванные поручения остаются сорванными: этот вывод о плане не означает,
      что герои выполнили его или что Стражи уже погибли.

  - id: clue_door_price
    text: >-
      Полностью открытая Дверь требует аварийной печати: доброволец удерживает её
      изнутри, пока остальные завершают слова. Он не вернётся. Это может быть герой,
      живой Страж или добровольный преемник. Целые пять замков и защищённый Мирон
      позволяют остановить открытие без жертвы, пока проём ещё не распахнут.

handouts:
  - id: party_roster
    title: "Четыре героя"
    text: >-
      Все начинают на 3-м уровне. Воин, танк: кольчуга, щит, длинный меч;
      28 хитов, КД 19, меч +5 и 1к8+3 рубящего урона. Он держит переднюю линию,
      но принудительного агро в правилах нет. Следопыт-Охотник, дальний урон:
      проклёпанная кожа, длинный лук, короткий меч; 28 хитов, КД 15, лук +7 и 1к8+3
      колющего урона. Плут-Вор, ближний урон: кожаный доспех, рапира, запасной
      короткий лук; 21 хит, КД 14, рапира +5 и 1к8+3. Жрец Жизни, поддержка:
      чешуйчатый доспех, щит, булава, священный символ; 27 хитов, КД 16, булава +4
      и 1к6+2. Лечение ран, Лечащее слово, Благословение и Щит веры — его профиль
      при ручном ведении. Заклинания, Скрытая атака, дополнительные действия, дистанции
      и агро в консольном прототипе не автоматизированы. Исключение — Жрец может
      применить Лечение ран 1-го уровня вне боя: одна ячейка, 1к8+6 хитов с Учеником жизни,
      не выше максимума цели. Другие заклинания и боевое лечение остаются ручными;
      запись в карточке сама не включает механику. Баланс боёв использует основные атаки.
      Вне боя каждый может разговаривать, исследовать и менять план.
    visibility: public

  - id: guardian_truth
    title: "Что держит Дверь"
    text: >-
      Чёртовы ворота ведут в Изнанку. Стражи — пять живых замков: Дурак держит наивность,
      Мирон-Маг знание, Император Всеволод порядок, Хоремхеб-Колесничий движение,
      Отшельник единство света и тьмы. Гибель Стража ломает один замок; недоверие голодных
      ослабляет порядок, но не убивает Императора. Через старые трещины могут
      просачиваться отдельные существа Изнанки, подражающие людям; их появление не
      означает, что вся Дверь открыта. Войску нужна распахнутая Дверь. Открывает её слово Мага при
      ослабленной печати в новолуние; гибель Колесничего сдвигает этот срок на неделю.
      Касание камня безопасно. Пока пять замков целы, защищённый Маг может закрыть
      трещины без жертвы. Полностью открытый проём или утраченный замок требуют
      аварийной печати. Свободную роль может принять добровольный преемник, понимающий
      свой обет; назначить человека без согласия нельзя.

  - id: lantern_instructions
    title: "Свет Отшельника"
    text: >-
      Свет фонаря раскрывает скрытый личиной истинный облик: у подражателей из
      Изнанки видна пустота чужого неба. Свет не сообщает принадлежность к культу,
      намерения или план и не указывает, кого подозревать. Он не причиняет урона,
      не исцеляет, не обнаруживает обычный яд и не закрывает Дверь. Пользоваться им
      может любой герой; для зажигания и раскрытия облика проверка не нужна.

  - id: ritual_words
    title: "Памятка о печати"
    text: >-
      Обычную печать ведёт защищённый Мирон, пока целы пять живых замков и Дверь ещё не
      распахнута. Осознанный обет преемника восстанавливает свободную роль до открытия,
      но не возвращает погибшего. Утраченный замок, сорванная печать или открытая Дверь требуют
      аварийного ритуала. Цена — один доброволец внутри проёма; он не вернётся.
      Согласие получают до завершения ритуала, а не объявляют за человека. Герой может
      принять свободную роль преемника осознанным обетом. Три этапа: имя порога
      «Изнанка», имя замка «Единство», слово закрытия «Предел». Вне боя герои выполняют
      три проверки Магии СЛ 15 по порядку, по одной на этап. Можно помогать друг другу
      смыслом и действиями, но это не автоматическое преимущество. Каждый провал
      расходует время и увеличивает разлом; после третьего провала этой ночью печать
      уже не удержать. Прежние успехи не теряются. Новый заход требует новой работы
      и цены, не бесплатного переброса. Если никто не согласен на жертву, остаётся
      вывести людей; отказ допустим. В ручной игре обычная печать Мага длится три
      раунда одновременно с обороной. В консоли сперва завершают бой, потом ритуал.

  - id: stone_instructions
    title: "Надпись внутри ворот"
    text: >-
      На внутренней стороне перекладины древние слова сопровождаются ясными рисунками:
      «Назови порог: Изнанка. Назови замок: Единство. Назови предел: Предел».
      Ниже фигура держит створки изнутри: «Закрывающий остаётся за порогом».
      Надпись даёт те же три этапа, что памятка о печати. Осмотр не требует броска,
      а исполнение ритуала требует проверок и осознанного согласия добровольца.

  - id: miron_request
    title: "Поддельная просьба к Мирону"
    text: >-
      «Книжник, приди к старым Воротам. Под покровительством Северина прочти молитву
      обновления: имя порога — Изнанка, слово силы — Открой. Так болезнь отступит.
      Не спрашивай остальных: они не знают нового обряда. — О.»
      Почерк аккуратный, подпись Отшельника чужая; запрет спрашивать других настораживает.

  - id: envelope_contents
    title: "Бумага из конверта"
    text: >-
      «Приметы: высокий, седой, левый глаз прищурен. Распорядок: полдень — фонтан, вечер —
      замок, ночь — покои. Охрана: двое у входа, смена в полночь».

  - id: patron_notes
    title: "Записи Северина"
    text: >-
      Листок под чернильницей, ровный почерк с наклоном: «Полдень. Ручей. Один. Уязвим.»
      Ниже, другими чернилами: «Фонарь — через тех же».
      На обороте адрес для ответов: «Ольховка, старый овин у околицы».

  - id: cell_orders
    title: "Приказы ячейке"
    text: >-
      «Завтра в полдень у ручья. Он будет один. Не медлить. Провала не прощаю. Ключи —
      к Двери.» Ровный почерк с наклоном, без подписи.

  - id: prep_tasks
    title: "Дела перед новолунием"
    text: >-
      Исходный срок — две недели, при гибели Колесничего одна; прошедшие дни учитываются.
      В каждом недельном этапе два проекта идут параллельно, плюс одна тренировка
      с живым Колесничим или свободным героем. Поездка в город туда и обратно — четыре
      дня. Выберите, кому ехать и кто останется руководить работами. Проекты: охота
      и защита посевов (мораль +1, мясо); ров и частокол (защита +2); заказ Гордею
      (оружие, атака ополчения +1); укрытие и караул Мага; союзный отряд; эвакуация
      детей и стариков. Показатели относятся к обороне, не к броскам героев.
      Ополчение: степень 1 «вилы и храбрость»; оружие и первая тренировка дают степень
      2 «держат строй»; ещё одна тренировка — степень 3 «ополчение». Максимум третья.
      За две недели доступны четыре проекта и две тренировки. Проект и время теряются
      при провале, исправление — новый проект. Заранее полученные союзники не покупаются
      снова. Стражей и Мага надо защитить, но никого нельзя назначить жертвой без согласия.

  - id: hermit_note
    title: "Записка Отшельника"
    text: >-
      «Не вините себя. Мы закроем сами — чем сможем. Кота не обижайте. — О.»

encounters:
  - id: wolf_pack
    title: "Пятёрка у оврага"
    description: >-
      Пять обычных волков у оврага рядом с тропой — единственная группа, доступная
      при первом входе в лес. Защищаются при вторжении или нападении. Урон, цели и
      очередь ходов разрешает движок. Подкреплений нет; после боя можно отдыхать
      или уйти, а не сражаться со следующей группой автоматически.
    creatures:
      - {statblock: "srd:wolf", count: 5}

  - id: wolf_thicket
    title: "Пятёрка в глухом ельнике"
    description: >-
      Пять обычных волков глубже в чаще. Найти можно только после отдельного решения
      искать дальше и перехода от оврага; они не приходят на шум первого боя.
      Нападают при вторжении или атаке героев. Отдельная инициатива, без подкреплений;
      до и после встречи можно отступить на отдых, не продолжая охоту.
    creatures:
      - {statblock: "srd:wolf", count: 5}

  - id: wolf_stream
    title: "Пятёрка у дальнего ручья"
    description: >-
      Пять обычных волков у ручья за ельником. Доступны после добровольного продолжения
      поиска в глубине леса, не как обязательная следующая волна. Защищают место
      отдыха при вторжении или нападении. Движок разрешает только этот бой;
      уцелевшие из других групп сюда не добавляются, путь к отдыху открыт.
    creatures:
      - {statblock: "srd:wolf", count: 5}

  - id: wolf_den
    title: "Логово Седого вожака"
    description: >-
      Последняя пятёрка в самой глубокой чаще: четыре обычных волка и такой же по
      числам Седой вожак. Логово находят лишь продолжив поиск за дальним ручьём;
      до встречи можно отдохнуть или прекратить охоту. Отдельный бой, без переноса
      прежних волков и инициативы. Гибель вожака не даёт остальным скрытых бонусов.
    creatures:
      - {statblock: "srd:wolf", count: 4}
      - {statblock: "srd:wolf", name: "Седой вожак"}

  - id: forest_return_skeletons
    title: "Скелеты на обратной тропе"
    description: >-
      Ровно два обычных srd:skeleton, только в wolf_forest на первом осознанном
      возвращении в деревню, в том числе без охоты. Замечены издали; можно приготовиться
      или обойти. Наблюдение открывает clue_dark_creatures без проверки и без боя;
      местные подтверждают необычность лишь после рассказа героев. При атаке или
      сближении с враждебной нежитью — настоящий отдельный бой. Не дополнительная
      обязательная волна после волков: нельзя запускать поверх активного боя или
      срывать безопасный отдых. Без усилений, призывов и подкреплений. Урон и исход —
      только по движку; обход не убийство. Обнаружение, место и судьбы обоих сохраняются
      в note_fact; это одна и та же пара, не новый спавн при возвращении. Не сбрасывай
      существ, не перезапускай encounter из started_encounters. Причина оживления
      неизвестна: не объявляй их войском, прошедшим через Дверь, и не связывай с волками.
    creatures:
      - {statblock: "srd:skeleton", count: 2}

  - id: hollow_chase
    title: "Бегство Получателя"
    description: >-
      Получатель отбивается, пока не сможет отступить по тактике статблока. Бегство
      и урон разрешает движок. Погоня по крышам — отдельная сцена действия после
      исхода боя, не автоматическое бегство при первом попадании.
    creatures:
      - {statblock: hollow, name: "Получатель"}

  - id: stream_ambush
    title: "Засада у ручья"
    description: >-
      Трое культистов в ивняке ждут Дурака. Можно наблюдать или добиться добровольной
      сдачи до боя. При настоящей атаке они дерутся молча; их базовая тактика не
      включает бегство. Нельзя объявить погибшего пленником.
    creatures:
      - {statblock: "srd:cultist", count: 3}

  - id: chariot_duel
    title: "Настоящий бой на тропе"
    description: >-
      Только при сознательном выборе настоящей атаки. Колесничий пытается прекратить
      бой отступлением по тактике. В консоли урон летальный, и при 0 хитов NPC погибает;
      не заменять это стабилизацией из повествования. Безопасный вариант — проверка
      испытания силы в сцене, а не это столкновение.
    creatures:
      - {statblock: chariot, name: "Хоремхеб"}

  - id: cell_fight
    title: "Ячейка в овине"
    description: >-
      Только четверо культистов овина, готовых сдаться до боя. Если герои всё же
      атакуют, они сопротивляются по обычной тактике; бегство и нелетальная победа
      не возникают из описания. При 0 хитов NPC погибает, не становится пленником.
      Наниматель остаётся в таверне; отдельный связанный курьер не участник этого боя.
      Его судьбу учитывай отдельно, не убивай вместе с четвёркой. Повторный вход не
      воскрешает ячейку; сдавшихся можно защитить от сообщника с ядом и допросить.
    creatures:
      - {statblock: "srd:cultist", count: 4}

  - id: patron_first_fight
    title: "Человеческая оболочка Северина"
    description: >-
      Применяется при раннем нападении или разоблачении. Временная оболочка отступает
      по тактике либо погибает от реального урона. Это поражение не уничтожило сущность
      в Изнанке; не воскресить того же actor и не завершить бой произвольной фразой.
    creatures:
      - {statblock: patron_mask, name: "Северин"}

  - id: scouts_fortified
    title: "Разведчики у частокола"
    description: "Двое разведчиков ищут прореху. Укрепления уже уменьшили состав этой волны, но не дают героям вымышленного бонуса КД. Бегство — только по тактике и событиям движка."
    creatures:
      - {statblock: cult_scout, count: 2}

  - id: scouts_breach
    title: "Разведчики в деревне"
    description: >-
      Четверо разведчиков прорвались к домам. Все используют обычную тактику атак;
      угроза поджога описывается после исхода боя, не как бесплатное второе действие
      или автоматический урон. Ручной вариант с таймером оговорён в сцене.
    creatures:
      - {statblock: cult_scout, count: 4}

  - id: main_holds
    title: "Прорыв через строй"
    description: "Ополчение держит строй. Трое культистов прорвались сквозь него и идут на героев."
    creatures:
      - {statblock: "srd:cultist", count: 3}

  - id: main_panic
    title: "Паника на улицах"
    description: >-
      Строй рассыпался. Пятеро культистов и элитный Ключник идут по улице. Слабая
      подготовка увеличила число противников; цели они выбирают по своим статблокам,
      не по скрытому правилу об обязательном нападении на самого опасного героя.
    creatures:
      - {statblock: "srd:cultist", count: 5}
      - {statblock: cult_elite}

  - id: door_final
    title: "Бой у Чёртовых ворот"
    description: >-
      Заказчик и два элитных Ключника защищают проём. В консоли атакуют по тактике
      статблоков, без автоматического удара по Мирону, испуга или помехи всем героям.
      Защита Мага определяется подготовкой, а ритуал идёт после боя. Одновременная
      оборона ритуала — отдельный ручной вариант.
    creatures:
      - {statblock: patron_true, name: "Заказчик"}
      - {statblock: cult_elite, count: 2}

lore:
  - id: olkhovka
    title: "Ольховка"
    text: >-
      Деревня в сорок дворов на опушке Ольхового леса. Живут рожью, капустой и мёдом.
      Староста — Агафья, таверна одна — «Ольховый лист». За рекой — соседнее Заречье,
      до Вельграда — два дня по тракту, на севере за лесом — Седые горы. На голом холме
      за деревней стоят Чёртовы ворота.

  - id: velgrad
    title: "Вельград"
    text: >-
      Столица Императора Всеволода. Сердце города — площадь Фонтанов, над ней — замок,
      поодаль — узкая библиотечная башня. По старому обычаю Император каждый полдень
      выходит к главному фонтану говорить с горожанами.

  - id: devil_gates
    title: "Чёртовы ворота"
    text: >-
      Два серых камня с перекладиной на голом холме за Ольховкой. Старики говорят,
      что их поставили ещё до людей, а кто — не помнит никто. Сквозь них не ходят: дурная
      примета. Скот на холме не пасут, в новолуние на холм не смотрят. Молодёжь смеётся
      над поверьем, но на холм тоже не лезет.

  - id: five_guardians
    title: "Пять Стражей"
    text: >-
      Пятеро живых замков Двери: Дурак (наивность), Маг (знание), Император (порядок),
      Колесничий (движение), Отшельник (единство света и тьмы). Пока живы все пятеро
      и держится то, что каждый воплощает, Дверь заперта. Каждый погибший Страж ослабляет
      её; со смертью Колесничего она приоткрывается раньше срока. Порядок Императора
      держится на верности людей, поэтому голод и ропот тоже ослабляют Дверь. Магу ведомы
      слова закрытия. Преемником может стать человек, который понимает свободную роль
      и добровольно принимает её обетом; мёртвого Стража это не воскрешает. Восстановленный
      до полного открытия замок позволяет обычную печать, но не стирает гибель человека.
      Нельзя назначить пленника или героя преемником без согласия.
    visibility: dm

  - id: the_door
    title: "Дверь"
    text: >-
      Дверь в Изнанку держат пять живых замков. Северин и Получатель просочились поодиночке
      через старую трещину; войско пока пройти не может. При ослабленном замке слово
      открытия, произнесённое Магом в новолуние, распахивает проём. Касание камня
      безопасно. Смерть Колесничего позволяет обряд на неделю раньше. Обычная печать
      защищённого Мага при целых замках не требует жертвы. Аварийное закрытие требует
      добровольца внутри и трёх слов; один остаётся навсегда. После уничтожения оболочки
      Северина закрытие Двери той же ночью уничтожает его сущность.
    visibility: dm

  - id: keyholders_cult
    title: "Ключники"
    text: >-
      Культ людей, которым тварь из-за Двери обещала то, чего им не хватает: силу, деньги,
      смысл. Носят серые плащи и связки ключей на поясе. Ячейки не знают друг друга, приказы
      приходят письмами. «Наказание» за провал доставляют сообщники: яд в еде и питье,
      а не необратимая магическая смерть. Свидетелей можно спасти изоляцией и охраной.
      Глава — Заказчик, которого люди знают как Северина.
    visibility: dm

statblocks:
  patron_mask:
    name: {ru: "Северин"}
    ac: 13
    hp: 18
    hit_dice: 4d8
    initiative: 2
    checks: {str: 0, dex: 2, con: 0, int: 2, wis: 2, cha: 4, deception: 6, insight: 4, persuasion: 6}
    saves: {str: 0, dex: 2, con: 0, int: 2, wis: 2, cha: 4}
    attacks:
      dagger: {name: {ru: "Серебряный нож"}, bonus: 4, damage: 1d4+2, damage_type: piercing}
    tactics: {target: random, flee_below: 0.8}
    traits: >-
      Непрочная человеческая оболочка. Бегство по тактике описывается как уход в туман,
      уничтожение оболочки — как распад. Возвращение сущности зависит от Двери,
      но павший actor не восстанавливается сам. Истинный облик в финале — другой статблок.

  patron_true:
    name: {ru: "Заказчик"}
    ac: 14
    hp: 55
    hit_dice: 10d8+10
    initiative: 2
    checks: {str: 3, dex: 2, con: 1, int: 2, wis: 2, cha: 4, deception: 6, insight: 4, persuasion: 6, perception: 4, stealth: 4}
    saves: {str: 3, dex: 2, con: 1, int: 2, wis: 4, cha: 6}
    attacks:
      claws: {name: {ru: "Когти"}, bonus: 5, damage: 1d6+3, damage_type: slashing}
      necrotic_touch: {name: {ru: "Касание Изнанки"}, bonus: 5, damage: 2d6, damage_type: necrotic}
    resistances: [necrotic, cold]
    tactics: {target: most_wounded}
    traits: >-
      По одной атаке за действие, без скрытой мультиатаки или автоматического испуга.
      При 0 хитов оболочка уничтожена; сущность уходит в Изнанку. Закрытие Двери той же
      ночью после поражения обрывает связь и уничтожает сущность. Фонарь показывает
      истинное лицо, но не добавляет урон. Открытая Дверь не восстанавливает хиты actor.

  chariot:
    name: {ru: "Колесничий"}
    ac: 18
    hp: 45
    hit_dice: 6d10+12
    initiative: 1
    checks: {str: 4, dex: 1, con: 2, int: 0, wis: 2, cha: 1, athletics: 6, insight: 4, intimidation: 3, perception: 4}
    saves: {str: 6, dex: 1, con: 4, int: 0, wis: 2, cha: 1}
    attacks:
      spear: {name: {ru: "Копьё"}, bonus: 6, damage: 1d6+4, damage_type: piercing}
      shield_bash: {name: {ru: "Удар щитом"}, bonus: 6, damage: 1d4+4, damage_type: bludgeoning}
    tactics: {target: random, flee_below: 0.4}
    traits: >-
      Держит копьё одной рукой, в другой щит. Стремится прекратить бой и отступает
      при тяжёлом ранении. Для безопасного
      поединка используют испытание силы в сцене, без боя. Нелетальный урон и
      стабилизация — ручные правила; в консоли удар может убить. Узкая тропа не
      блокирует дистанционные атаки, пока движок не поддерживает позиции.

  hollow:
    name: {ru: "Пустой"}
    ac: 12
    hp: 22
    hit_dice: 4d8+4
    initiative: 2
    checks: {str: 0, dex: 2, con: 1, int: -1, wis: 0, cha: -2, athletics: 4, deception: 0, stealth: 4}
    saves: {str: 0, dex: 2, con: 1, int: -1, wis: 0, cha: -2}
    attacks:
      grasp: {name: {ru: "Цепкие пальцы"}, bonus: 3, damage: 1d6+1, damage_type: bludgeoning}
    resistances: [necrotic]
    tactics: {target: random, flee_below: 0.9}
    traits: >-
      Не моргает, не ест, повторяет чужие слова. Защищается, пока не удастся сбежать
      по тактике. Уход описывается как бегство по крышам, но не происходит без события.
      Уничтоженная оболочка распадается туманом.

  cult_scout:
    name: {ru: "Разведчик культа"}
    ac: 13
    hp: 11
    hit_dice: 2d8+2
    initiative: 3
    checks: {str: 0, dex: 3, con: 1, int: 0, wis: 1, cha: 0, perception: 3, stealth: 5, survival: 3}
    saves: {str: 0, dex: 3, con: 1, int: 0, wis: 1, cha: 0}
    attacks:
      shortbow: {name: {ru: "Короткий лук"}, bonus: 5, damage: 1d6+3, damage_type: piercing}
      dagger: {name: {ru: "Кинжал"}, bonus: 5, damage: 1d4+3, damage_type: piercing}
    tactics: {target: random, flee_below: 0.3}
    traits: "Разведчик с луком и кинжалом; ищет обход, бережёт жизнь. Скрытность не добавляет урон автоматически."

  cult_elite:
    name: {ru: "Ключник-страж"}
    ac: 15
    hp: 22
    hit_dice: 4d8+4
    initiative: 1
    checks: {str: 2, dex: 1, con: 1, int: 0, wis: 1, cha: 0, athletics: 4, intimidation: 2, religion: 2}
    saves: {str: 2, dex: 1, con: 1, int: 0, wis: 3, cha: 0}
    attacks:
      black_blade: {name: {ru: "Чёрный клинок"}, bonus: 4, damage: 1d8+2, damage_type: slashing}
    tactics: {target: random}
    traits: "Ближний боец в доспехе. Одна атака за действие; преданность культу не даёт неучтённых бонусов."

