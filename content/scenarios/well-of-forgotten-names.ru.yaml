scenario:
  title: Колодец забытых имён
  language: ru
  ruleset: dnd5e-srd@1
  sheet_template: srd5-basic@1
  start_scene: village_square
  synopsis: 'Деревня Ольховка стоит на старом кладбище, и по ночам из заброшенного колодца доносится шёпот:
    кто-то стирает имена умерших с могильных плит, и жители начинают забывать своих близких. Староста
    Милана просит героев разобраться до новолуния — три ночи назад пропал её брат, а утром она не смогла
    вспомнить его имя. Через знахарку Весту и письмо пропавшего герои выходят на кладбище за холмом, где
    свежие сколы и следы ведут в колодец, а скелеты тех, чьи имена стёрли первыми, подсказывают, что имя,
    произнесённое вслух, успокаивает стража. Под колодцем, в усыпальнице, обитает Хранитель Имён — дух
    жреца, забывшего своё имя и потому стирающего чужие; на внутренней стороне колокола сохранилось имя
    «отец Савелий». Ожидаемый финал: герои называют имя хранителя вслух — дух обретает покой, сколотые
    имена проступают обратно, а пропавшие (включая брата Миланы) вспоминают себя и выходят наружу. Плохой
    финал: дух развеян силой, но забытые имена не вернулись, и деревня учится жить с пустотами.'
  tone: 'Тихая деревенская жуть: без прыгающих скелетов из-за угла, страх растёт из забытых имён и пустых
    мест за столом.'
scenes:
- id: village_square
  title: Деревенская площадь
  read_aloud: 'Ольховка встречает вас тишиной. На площади у колодца-журавля сидит старуха и перебирает
    чётки, шевеля губами без звука. На доске объявлений выцветший список пожертвований: половина имён
    соскоблена ножом. Пахнет дымом и мокрой землёй.'
  dm_notes: Старуха — знахарка Веста. Она помнит всех, кого забыли, потому что каждое утро записывает
    имена в тетрадь. Она боится колодца и не пойдёт туда, но расскажет про кладбище за холмом и про то,
    что имена стирают «те, кто внизу». Милана даёт героям письмо брата — он писал его за день до исчезновения.
  npcs:
  - milana
  - vesta
  items: []
  clues:
  - names_scraped_knife
  - crypt_beneath_well
  handouts:
  - brother_letter
  encounters: []
  exits:
  - cemetery
  checks:
  - id: examine_board
    description: 'Осмотр доски объявлений: соскобленные имена вырезаны аккуратно, одним лезвием, и все
      — за последние три ночи.'
    skill: perception
    dc: 12
    difficulty: medium
    on_success:
      reveal:
      - names_scraped_knife
      text: 'Соскобы свежие и ровные: работал один человек одним ножом, и все имена исчезли за последние
        три ночи.'
  - id: talk_vesta
    description: 'Разговор с Вестой: она недоговаривает — знает, что колодец был входом в старую усыпальницу.'
    skill: insight
    dc: 10
    difficulty: easy
    on_success:
      reveal:
      - crypt_beneath_well
      text: Веста отводит глаза и роняет, что колодец — не колодец, а ход в старую усыпальницу под кладбищем.
- id: cemetery
  title: Кладбище за холмом
  read_aloud: Плиты покосились, трава по пояс. У половины могил имена сбиты — не временем, а зубилом.
    В дальнем углу стоит колодец с гнилым журавлём; из него тянет холодом, и этот холод не от ветра.
  dm_notes: 'Свежие сколы на плитах ведут к колодцу. Ночью здесь бродят скелеты — те, чьи имена стёрли
    первыми (2 скелета, библиотечные статблоки). Они не атакуют первыми: поднимаются, если герои шумят
    или трогают плиты. Если герои читают вслух имя с уцелевшей плиты, скелет на миг замирает — это подсказка,
    как успокоить стража внизу.'
  npcs: []
  items: []
  clues:
  - vanished_went_themselves
  - rope_cut_inside
  handouts: []
  encounters:
  - cemetery_skeletons
  exits:
  - village_square
  - crypt
  checks:
  - id: tracks_at_well
    description: 'Следы у колодца: босые ноги ведут в колодец, и ни одного следа обратно.'
    skill: survival
    dc: 13
    difficulty: medium
    on_success:
      reveal:
      - vanished_went_themselves
      text: Следы босых ног ведут В колодец — и ни один не ведёт обратно. Пропавшие спускались сами.
  - id: inspect_crane
    description: 'Осмотр журавля: верёвка обрезана сверху, изнутри.'
    skill: investigation
    dc: 13
    difficulty: medium
    on_success:
      reveal:
      - rope_cut_inside
      text: 'Верёвка перерезана у самого верха, но след надреза идёт изнутри колодца: кто-то обрезал её,
        уже спустившись.'
- id: crypt
  title: Усыпальница под колодцем
  read_aloud: 'Спуск по мокрым скобам выводит в круглый зал из тесаного камня. В нишах стоят урны с именами,
    но имена на них стёрты. В центре — сухой бассейн, а над ним висит колокол без языка. Из темноты доносится
    шёпот: «Назови меня. Назови меня».'
  dm_notes: 'Здесь обитает Хранитель Имён — дух старого жреца, который когда-то дал обет помнить всех
    умерших. Обет нарушили: деревня забыла его имя, и он начал стирать имена у других, чтобы его позвали.
    Он не злодей в обычном смысле: если герои найдут его имя (оно сохранилось на внутренней стороне колокола
    — «отец Савелий») и назовут его вслух, дух успокоится и отпустит пропавших. Если герои атакуют или
    откажутся — он дерётся. Пропавшие (включая брата Миланы) сидят у стен, живые, но вялые: они отдают
    по одному воспоминанию в день. Их можно вывести наружу в любой момент. Названное имя возвращает духу
    покой, сколотые имена проступают обратно, пропавшие вспоминают себя. Если духа развеять силой — забытые
    имена не возвращаются, деревня учится жить с пустотами.'
  npcs:
  - keeper_of_names
  items: []
  clues:
  - keeper_name_saveliy
  - oath_can_be_redeemed
  handouts: []
  encounters:
  - guardian_fight
  exits:
  - cemetery
  checks:
  - id: inspect_bell
    description: 'Осмотр колокола: изнутри выцарапано имя «Савелий».'
    skill: perception
    dc: 14
    difficulty: hard
    on_success:
      reveal:
      - keeper_name_saveliy
      text: 'На внутренней стороне колокола, у самого края, процарапано: «отец Савелий».'
  - id: recall_oaths
    description: 'Знание об обетах: нарушенный обет памяти можно искупить, назвав имя вслух.'
    skill: religion
    dc: 12
    difficulty: medium
    on_success:
      reveal:
      - oath_can_be_redeemed
      text: 'Нарушенный обет памяти искупается не боем, а именем: произнесённое вслух имя освобождает
        давшего обет.'
npcs:
- id: milana
  name: Милана
  description: Староста Ольховки, немолодая женщина с усталым лицом. Просит героев разобраться с шёпотом
    из колодца и с пропажей людей.
  personality: 'Держится собранно, но говорит о брате сбивчиво: имя его она вспомнить не может и стыдится
    этого.'
  secrets:
  - Её брат пропал три ночи назад; утром она обнаружила, что не может вспомнить его имя.
  - В деревне ещё несколько таких семей. Милана умоляет разобраться до новолуния — иначе, по поверью,
    забытые уйдут навсегда.
  attitude: friendly
- id: vesta
  name: Веста
  description: Старуха-знахарка, сидит у колодца-журавля на площади и перебирает чётки, шевеля губами
    без звука.
  personality: Боится колодца и не пойдёт туда, но говорит охотно и путанно, всё время возвращаясь к именам.
  secrets:
  - Помнит всех, кого забыли, потому что каждое утро записывает имена в тетрадь.
  - 'Недоговаривает: знает, что колодец был входом в старую усыпальницу.'
  - Расскажет про кладбище за холмом и про то, что имена стирают «те, кто внизу».
  attitude: friendly
- id: keeper_of_names
  name: Хранитель Имён
  description: 'Призрак старого жреца в усыпальнице под колодцем. Из темноты шепчет: «Назови меня. Назови
    меня».'
  personality: 'Не злодей в обычном смысле: обиженный и одинокий, он требует, чтобы его позвали по имени.'
  secrets:
  - Когда-то дал обет помнить всех умерших; обет нарушили — деревня забыла его имя, и он начал стирать
    имена у других, чтобы его позвали.
  - Его имя — «отец Савелий»; оно сохранилось на внутренней стороне колокола. Названное вслух, оно успокаивает
    духа и освобождает пропавших.
  - Если герои атакуют или откажутся назвать имя — он дерётся.
  attitude: neutral
  statblock: keeper_of_names
items: []
clues:
- id: names_scraped_knife
  text: Имена с доски объявлений стирают ножом, по ночам, и все — за последние три
    ночи.
  visibility: dm
- id: crypt_beneath_well
  text: Под колодцем есть усыпальница — колодец был входом в неё.
  visibility: dm
- id: vanished_went_themselves
  text: 'Пропавшие спускались в колодец сами: следы босых ног ведут внутрь, и ни один не ведёт обратно.'
  visibility: dm
- id: rope_cut_inside
  text: Верёвка журавля обрезана сверху, но изнутри колодца — кто-то сделал это, уже спустившись.
  visibility: dm
- id: keeper_name_saveliy
  text: Имя хранителя — Савелий; на внутренней стороне колокола процарапано «отец Савелий».
  visibility: dm
- id: oath_can_be_redeemed
  text: Нарушенный обет памяти можно искупить, назвав имя вслух.
  visibility: dm
handouts:
- id: brother_letter
  title: Письмо брата Миланы
  text: «Милана, если я не вернусь, не спускайся к колодцу. Внизу не вода. Внизу те, чьи имена стёрли,
    и они хотят, чтобы их позвали по имени. Я слышал, как они называют меня. Я ответил. Прости».
  visibility: public
encounters:
- id: cemetery_skeletons
  title: Скелеты на кладбище
  description: 'Два скелета — те, чьи имена стёрли первыми. Не атакуют первыми: поднимаются, если герои
    шумят или трогают плиты. Прочитанное вслух имя с уцелевшей плиты заставляет скелета на миг замереть.'
  creatures:
  - statblock: srd:skeleton
    count: 2
    name: Скелет
- id: guardian_fight
  title: Хранитель Имён
  description: Дух жреца нападает, только если герои атакуют его или откажутся назвать его имя. Пока имя
    не названо, он регенерирует 3 хита в начале своего хода.
  creatures:
  - statblock: keeper_of_names
    count: 1
    name: Хранитель Имён
lore:
- id: olkhovka
  title: Деревня Ольховка
  text: 'Деревня стоит на старом кладбище. Жители начинают забывать своих близких: имена стираются с плит,
    а вместе с ними — из памяти.'
  visibility: public
- id: new_moon_belief
  title: Поверье о новолунии
  text: По деревенскому поверью, если не разобраться до новолуния, забытые уйдут навсегда.
  visibility: public
- id: well_and_crypt
  title: Колодец и усыпальница
  text: Колодец на кладбище за холмом — не источник воды, а вход в старую усыпальницу; из него тянет холодом,
    и этот холод не от ветра. Внизу, в круглом зале, стоят урны с именами, сухой бассейн и колокол без
    языка.
  visibility: dm
- id: keeper_oath
  title: Обет Хранителя Имён
  text: Дух старого жреца дал обет помнить всех умерших. Когда деревня забыла его собственное имя, обет
    оказался нарушен — и он начал стирать имена у других, чтобы его позвали.
  visibility: dm
statblocks:
  keeper_of_names:
    name: Хранитель Имён
    ac: 13
    hp: 27
    hit_dice: 6d8
    initiative: 0
    checks:
      perception: 4
      religion: 4
    saves: {}
    attacks:
      icy_touch:
        name: Ледяное касание
        bonus: 5
        damage: 2d6
        damage_type: necrotic
    resistances:
    - necrotic
    vulnerabilities: []
    immunities: []
    tactics:
      target: most_wounded
    traits: Пока его имя не названо, Хранитель Имён регенерирует 3 хита в начале своего хода. Призрак
      жреца; сопротивление некротическому урону.
map:
  style: parchment
  nodes:
    village_square:
      x: 0.0
      y: 0.0
      icon: village
    cemetery:
      x: 1.0
      y: 0.0
      icon: graveyard
