        Теплица «Десперадоса» получит новые гряды — доставьте их домой.
    on_failure:
      text: >-
        Лопата скользит по мёртвой плите: корни сидят глубже, чем казалось.
        Нити не порваны — можно подкопать с другой стороны.
- id: colony_hangar
  title: Ангар и склады «Меридиана»
  read_aloud: >-
    Ангар встречает запахом остывшего масла. Крыша просела, но стеллажи стоят: ящики
    с учётными печатями, тележки, снятый с рельсов кран. На стене — схема складов,
    и одна панель за стеллажом выбивается из ряда: фальш-панель, за которой что-то
    прятали. У входа в складской отсек остался нетронутый ящик запчастей.
  dm_notes: >-
    Ровно один ящик запчастей на всю колонию: grant_item consumable_spares_abandoned
    (1 единица учёта; новых источников запчастей здесь нет, счёт ≥6 доставленных
    ведущий ведёт вручную по журналу). Чек salvage_warehouse перенесён сюда из старой
    единой сцены колонии: успех раскрывает улику armory_cache и указывает на оружейную
    нишу — сцена colony_armory за фальш-панелью. Торпеды здесь НЕ выдавать: они лежат
    в нише и выдаются только парой в colony_armory. Ровно одна горелка на всю колонию:
    чек search_hangar при успехе выдаёт tool_burner автоматически (Revealed +
    ItemGranted) — grant_item для неё не планировать; горелкой можно прогреть закисшую
    пломбу оружейной ниши (чек heat_seal в colony_armory). Обратно на площадку.
  npcs: []
  items:
