        дольше и темнее, но путь открыт.
- id: colony_mine_deep
  title: Штреки «Меридиана»
  read_aloud: >-
    Нижний уровень встречает мёртвой тишиной: вагонетки на рельсах, брошенный
    инструмент, каски на крючках — люди уходили в спешке, не разбирая вещей.
    В забое тускло блестит жила: образцы руды так и остались в ящиках геологов.
    У стены — личный локбокс колонистов, крышка приоткрыта. Фонари выхватывают
    из темноты только то, что близко: штрек уходит дальше, чем видно.
  dm_notes: >-
    Случайный лут: чек search_workings при успехе выдаёт РОВНО ОДИН ещё не выданный
    предмет из reveal (cache_meridian_ore_sample или cache_colonists_lockbox) —
    движок выбирает сам, grant_item для них не планировать. Повторный успех выдаёт
    второй; когда список исчерпан — ничего. Оба предмета — нарративная малая
    ценность: не запчасти, не корни, не боеприпасы; очков обороны не дают.
    Давление времени («успеть, пока бомбардировщик кружит над колонией») — только
    наррация. Обратно к стволу.
  npcs: []
  items:
  - cache_meridian_ore_sample
  - cache_colonists_lockbox
  clues: []
  handouts: []
  encounters: []
  exits:
  - colony_mine_gate
  checks:
  - id: search_workings
