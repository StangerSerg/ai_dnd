      text: >-
        Экран оживает: последние записи дневника эвакуации и схема колонии. Жители
        ушли через шахтный ствол — координаты и отметки штреков ещё в памяти
        терминала. Запишите их на планшет.
    on_failure:
      text: >-
        Батарея просаживается: терминал гаснет, не дочитав загрузку. Контакты можно
