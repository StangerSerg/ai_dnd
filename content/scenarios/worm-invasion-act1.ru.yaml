- id: colony_terminal
  title: Администрация «Меридиана»
  read_aloud: >-
    В администрации пахнет пылью и остывшим пластиком. Стулья отодвинуты от столов,
    кружки стоят недопитыми — люди вставали и уходили, не убирая. Главный терминал
    темен, но индикатор питания под столом ещё теплится: аварийная батарея жива.
    На экране — запрос пароля и курсор, мигающий раз в семь секунд, как пульс.
  dm_notes: >-
    Чек revive_terminal оживляет терминал и раскрывает handout evacuation_log
    (дневник эвакуации, скрыт до раскрытия). После успеха зафиксируйте координаты
    шахты: note_fact meridian_mine_coords — повествовательный факт, не условие акта;
    терминал показывает, что жители ушли через шахтный ствол и внизу остались
    брошенные штреки. Отсюда дорога к шахте (colony_mine_gate). Обратно на площадку.
  npcs: []
  items: []
  clues: []
  handouts:
  - evacuation_log
  encounters: []
  exits:
  - colony_abandoned
  - colony_mine_gate
  checks:
  - id: revive_terminal
    description: >-
      Подать питание с аварийной батареи и оживить главный терминал администрации.
    skill: engineering
    dc: 13
    difficulty: medium
    on_success:
      reveal:
