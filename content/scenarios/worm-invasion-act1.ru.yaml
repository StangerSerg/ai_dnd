# «Черви: Десперадос», акт 1 — подготовка домашней колонии.
# Корабль = персонаж: набор правил worms-space@1, шаблон worms-ship@1, классы ship_*.
# Сектор фиксированный (без процедурной генерации): 6 локаций + пиратский аванпост.
# Победа этапа — «Готовность обороны 6 очков»; условия и очки расписаны в synopsis,
# в handout defense_plan и в dm_notes финальной сцены muster_defense.
scenario:
  title: "Черви: Десперадос — Акт 1"
  language: ru
  ruleset: worms-space@1
  sheet_template: worms-ship@1
  start_scene: hotel_room
  available_classes: [ship_striker, ship_scout, ship_tender]
  synopsis: >-
    Далёкое будущее. Землю захватили Черви — твари, что коконом оплетают планеты с водой
    и выводят в них потомство, пока не выпьют воду до дна. Люди рассеялись по космосу;
    главная ценность выживших — овощи единственной Теплицы. Овощи — дорогая и очень ценная
    пища: обычно едят синтетическую кашу, которая насыщает питательными веществами, но
    на вкус это серый безвкусный гель без витаминов. От него уже всех тошнит, но овощей
    на всех не хватает, так что его приходится есть. Овощи выдают как награду за что-то
    ценное для колонии. Игроки — пилоты последних уцелевших боевых кораблей домашней
    колонии «Десперадос». Среди ночи воет сирена воздушной тревоги: червь добрался и сюда.
    Акт 1 — подготовка обороны: разведать фиксированный сектор, добыть запчасти, технику
    и союзников до того, как придут волны. Победа этапа измерима: «Готовность обороны 6 очков».
    Обязательные условия (иначе этап не засчитан): обучающий бой на орбите выигран
    (fact training_fight_won) и корни тепличных растений доставлены в Теплицу
    (fact roots_delivered, предмет cache_worm_roots). Очки, по одному за каждое:
    мобильный комбайн доставлен на рудную планету и запущен (fact harvester_deployed);
    транспортник «Арго» спасён (fact transport_saved); патруль «Авроры» заключён
    (fact patrol_secured); не менее 6 единиц запчастей доставлено на базу
    (fact spares_delivered, считается по журналу предметов). Сумма обязательных и очков
    должна быть не меньше 6. Опциональное испытание у финала — юный Линкор; для победы
    этапа он не нужен. Экономику и строительство ведущий считает вручную по журналу.
  tone: >-
    Тревожный космический вестерн: гул двигателей вместо эха подземелий, тишина орбиты
    страшнее взрыва. Овощи Теплицы — такая же валюта, как запчасти и сталь.
scenes:
- id: hotel_room
  title: Гостиница «У последнего причала»
  read_aloud: >-
    Номер на третьем этаже пахнет озоном и морковными котлетами — вечерний паёк из Теплицы.
    За окном домашняя долина: тепличные купола светятся в темноте, как три лунных осколка.
    Вы снова видите сон — бегство с Земли: плотный поток кораблей, и за кормой клубящийся
    кокон, наматывающийся на голубую планету. Раздумья обрывает сирена — воздушная тревога.
    Первый раз за двенадцать лет.
  dm_notes: >-
    Вступление. Каждый игрок — пилот одного из трёх кораблей (ship_striker, ship_scout,
    ship_tender). Хозяйка Вера знает все слухи колонии. Сирена — не учение, а реальная
    тревога: система раннего оповещения засекла одного червя на подходе; точность сигнала подтвердится
    на орбите (обучающий бой). Дайте игрокам вспомнить бегство (проверка recall_escape),
    выдайте handout evacuation_photo и handout defense_plan — оборонный план совета колонии.
    Дальше путь в ангар; тормозить их некогда, но по дороге можно расспросить Веру, а в
    общей зале под тревогу собрались ботаник Исса и старый пилот Янн.
  npcs:
  - vera
  - botanist_issa
  - veteran_yann
  items: []
  clues:
  - siren_reason
  handouts:
  - evacuation_photo
  - defense_plan
  encounters: []
  exits:
  - hangar
  checks:
  - id: recall_escape
    description: >-
      Вспомнить бегство с Земли: детали эвакуационного конвоя, по которым ведущий
      выдаст предысторию мира.
    skill: command
    dc: 10
    difficulty: easy
    on_success:
      reveal:
      - siren_reason
      text: >-
        Память складывается в ясную картину: Черви оплетают планеты коконом из слизи,
        выпивают океаны и уходят. Домашняя колония — одна из немногих, где Теплица жива.
        Сирена звучит именно потому, что колония до сих пор жива.
- id: hangar
  title: Ангар колонии «Десперадос»
  read_aloud: >-
    Ангар раскрывается ливнем света и звука. Купол открывается с протяжным скрежетом,
    колонистам некогда было делать отлаженные механизмы, все грубое, но надёжное.
    В трёх доках — последние боевые корабли колонии: корветы «Пульсар», «Мираж» и «Гефест».
    Механики бегут между тележками, над головой грохочут рельсы крана. На стеллаже
    у стены — бронелисты и ящики запчастей, на всё стоит учётная печать квартермейстера.
  dm_notes: >-
    Предполётная подготовка. Квартермейстер по сирене разрешает взять снаряжение:
    grant_item module_armor_plate (1 лист, в v0.2 даст +1 к целостности и -1 к увороту;
    пока это груз в трюме) и grant_item consumable_spares (1 ящик). Проверка preflight_check:
    при успехе корабли безотказны; при провале один корабль стартует с -2 к целостности
    (adjust_resource, ведущий применяет вручную). В ангаре работают старший механик Риг и
    кладовщица Зу — их можно расспросить; умелый разговор (insight нет в наборе — используйте
    negotiate или command по аналогии) может выдать слух о покинутой колонии. Затем сцена launch.
  npcs:
  - mechanic_rig
  - loader_zu
  items:
  - module_armor_plate
  - consumable_spares
  clues:
  - airfield_ready
  handouts: []
  encounters: []
  exits:
  - hotel_room
  - launch
  checks:
  - id: preflight_check
    description: >-
      Предполётная диагностика: инженерная проверка двигателей, шасси и стыковочных узлов
      перед боевым вылетом.
    skill: engineering
    dc: 12
    difficulty: medium
    on_success:
      reveal:
      - airfield_ready
      text: >-
        Все три корабля в строю: давление в контурах в норме, крепления ракетных блоков
        проверены. Ангар выдаёт добро на взлёт.
    on_failure:
      text: >-
        У одного из кораблей подтекает рулевой контур: стартует с -2 к целостности
        (примените adjust_resource). После взлёта механики починят, но бой будет горячее.
- id: launch
  title: Взлёт
  read_aloud: >-
    Доки открываются в розовое небо. Трап отстреливает замки, и три корвета выкатываются
    на стартовую полосу, вырезанную в боку горы. Груз тянет вниз: ящики, бронелисты,
    люки стучат по креплениям. Маршевые двигатели раскаляются — осталось оторваться.
  dm_notes: >-
    Проверка takeoff: piloting против СЛ 12. Каждая тонна груза — -1 к броску (ведущий
    считает по трюмам вручную, обычно 2–4 ящика = -2…-4). Успех — чистый взлёт,
    note_fact takeoff_clean. Провал — корабль дергается, целостность -3 (adjust_resource),
    но взлёт состоялся. Покажите колонию с высоты: три купола Теплицы, ангар, посадочная
    полоса — то, ради чего всё это. Переход на орбиту.
  npcs: []
  items: []
  clues:
  - takeoff_rules
  handouts: []
  encounters: []
  exits:
  - hangar
  - orbit
  checks:
  - id: takeoff
    description: >-
      Взлёт с перегруженной полосы: пилотирование против СЛ 12 с поправкой -1 за тонну
      груза в трюме.
    skill: piloting
    dc: 12
    difficulty: medium
    on_success:
      reveal:
      - takeoff_rules
      text: >-
        Корветы отрываются синхронно, словно на параде. Правило взлёта теперь ясно
        всем: масса груза бьёт по пробросу, маршевые двигатели его вытягивают.
    on_failure:
      text: >-
        Последний импульс не вовремя: корабль цепляет корпусом полосу, -3 к целостности
        (adjust_resource), но строй собран и курс — на орбиту.
- id: orbit
  title: Орбита домашней планеты
  read_aloud: >-
    Планета внизу — зелёная точка среди серого. Система раннего оповещения передаёт информацию:
    движущиеся тепловые следы, координаты загружены в бортовой компьютер. Из-за спутника
    выворачиваются длинные, тонкие, как дождевые черви, силуэты: три штурмовика снижаются
    к колонии. Первый контакт. Первый бой.
  dm_notes: >-
    Обучающий бой: start_combat с encounter orbit_training_fight (3 storm_worm). Черви
    целятся в купола Теплицы, а не в корабли — игроки выбирают, перехватывать ли
    (тут раскрывается умение protect штурмовика). После победы note_fact training_fight_won —
    это ОБЯЗАТЕЛЬНОЕ условие этапа. Мёртвые черви дают образцы (clue worm_debris).
    Из орбиты открыта свободная навигация по сектору (exits); навигационный пост даёт
    подробности. Проверка scan_sector находит координаты сигнала бедствия —
    без неё сцена distress_signal доступна, но игроки не знают, что там ждать.
  npcs: []
  items: []
  clues:
  - worm_debris
  - distress_coordinates
  handouts: []
  encounters:
  - orbit_training_fight
  exits:
  - launch
  - nav_post
  - planet_scorch
  - planet_gas_giant
  - colony_abandoned
  - planet_ore
  - colony_friendly
  - distress_signal
  - pirate_outpost
  - muster_defense
  checks:
  - id: scan_sector
    description: >-
      Полный обзор сектора сенсорами: получение информации про маршруты, тепловые следы
      и слабый сигнал бедствия с края сектора.
    skill: scanning
    dc: 13
    difficulty: medium
    on_success:
      reveal:
      - distress_coordinates
      text: >-
        Сенсоры анализируют сектор: шесть тел, старые маяки и — на границе дальности —
        автоматический сигнал бедствия, кодируемый гражданским транспортным протоколом.
- id: nav_post
  title: Навигационный пост
  read_aloud: >-
    Навигационный пост — башня из контейнеров на краю посадочной полосы, внутри пахнет
    синтетическим кофе и озоном. Диспетчер Дан окружён голографической картой сектора:
    шесть точек света, старые маяки и пометки цвета ржавчины. За соседней консолью
    дежурит оператор системы раннего оповещения Мира.
  dm_notes: >-
    Дан рассказывает о секторе (выдайте handout sector_chart). Проверка decrypt_routes
    вскрывает старые лётные журналы: координаты пиратского аванпоста (clue pirate_hint)
    и отметку о покинутой колонии «Меридиан». Мира первой засекла червя и может рассказать,
    как устроена сигнальная сеть. Дан не летает, но знает, где чьи маяки. Отсюда удобно
    планировать маршрут по сектору; назад — на орбиту.
  npcs:
  - nav_operator_dan
  - watch_operator_mira
  items: []
  clues:
  - pirate_hint
  handouts:
  - sector_chart
  encounters: []
  exits:
  - orbit
  checks:
  - id: decrypt_routes
    description: >-
      Расшифровать старые лётные журналы поста: маршруты, которые колония не открывала
      двенадцать лет.
    skill: scanning
    dc: 14
    difficulty: hard
    on_success:
      reveal:
      - pirate_hint
      text: >-
        В журналах всплывает тропа, которой летали пираты: гравитационная тень газового
        гиганта и точка без маяков — аванпост «Гарпун». И тихая отметка: «Меридиан»,
        колония, замолчавшая семь лет назад.
- id: planet_scorch
  title: Раскалённая планета «Гелиос»
  read_aloud: >-
    «Гелиос» висит у самой звезды: раскалённый шар с реками расплавленного камня.
    Корабли держатся на высокой орбите — даже отсюда бортовые термометры ползут вверх.
    Ни маяков, ни следов, ни тени воды. Мёртвый свет, мёртвый камень.
  dm_notes: >-
    Планета непригодна для высадки и добычи: ближний к звезде мир. Проверка deep_scan
    показывает следы сублимации — любые ценные породы улетучились сотни лет назад
    (clue scorch_nothing). Дайте понять, что «Гелиос» — граница сектора, изучать нечего,
    и лучшее решение — изучить другие точки карты. Обратно на орбиту.
  npcs: []
  items: []
  clues:
  - scorch_nothing
  handouts: []
  encounters: []
  exits:
  - orbit
  checks:
  - id: deep_scan
    description: >-
      Глубокое сканирование поверхности через термальную завесу: есть ли хоть что-то
      в толще раскалённой коры.
    skill: scanning
    dc: 15
    difficulty: hard
    on_success:
      reveal:
      - scorch_nothing
      text: >-
        Спектр показывает выветренную кору и следы сублимации: «Гелиос» давно отдал
        всё летучее звезде. Добывать здесь нечего — только жар и свет.
- id: planet_gas_giant
  title: Газовый гигант «Эол»
  read_aloud: >-
    «Эол» заполняет весь обзор: полосатый шторм величиной с континент, кольца
    ледяной пыли, блестящие как стружка. Сенсоры захлёбываются: в облаках миллион
    ложных целей, грозовые разряды бьют на тысячи километров.
  dm_notes: >-
    Красиво и опасно. В штормовом поясе может сидеть засада: при желании ведущий
    запускает encounter gas_ambush (2 sniper_worm — змеиные «кобры», сидящие в грозах;
    в v0.2 снайперы предпочитают скрытные позиции, тут — электрические бури).
    Проверка storm_reading заранее видит циклы штормов и даёт преимущество в засаде
    (ведущий вручную: помеха первой атаке червей). Добычи нет — только гелий,
    который колония пока не умеет использовать. Обратно на орбиту.
  npcs: []
  items: []
  clues:
  - gas_storm_cycles
  handouts: []
  encounters:
  - gas_ambush
  exits:
  - orbit
  checks:
  - id: storm_reading
    description: >-
      Прочитать циклы штормов «Эола»: когда грозовые пояса стихают и где в них
      могут прятаться тепловые силуэты.
    skill: scanning
    dc: 13
    difficulty: medium
    on_success:
      reveal:
      - gas_storm_cycles
      text: >-
        Штормы живут по расписанию: пауза в семь минут каждый оборот пояса. Кто читает
        карту бурь, тот замечает чужой тепловой силуэт до того, как силуэт заметит его.
- id: colony_abandoned
  title: Покинутая колония «Меридиан»
  read_aloud: >-
    «Меридиан» лежит в холодной пустыне: пять пустых куполов, обломки посадочных опор,
    трава, пробившаяся сквозь бетон. Купола Теплицы №2 стоят распахнутыми, как рты.
    На мачте ещё качается флаг — выгоревший до белой ткани.
  dm_notes: >-
    Колонию покинули семь лет назад после пиратского рейда (clue colony_left_in_hurry).
    В Теплице №2 — цель визита: уцелевшие корни тепличных растений (grant_item
    cache_worm_roots, доставка домой даёт fact roots_delivered — ОБЯЗАТЕЛЬНОЕ условие).
    В ангаре — ящик запчастей (grant_item consumable_spares_abandoned). Проверка
    salvage_warehouse вскрывает оружейную нишу: grant_item module_torpedo_plasma
    (1 плазменная торпеда).
    Над колонией кружит бомбардировщик-червь: при задержке — start_combat
    encounter abandoned_bomber. Следы показывают: жители ушли сами, эвакуация была
    поспешной, часть техники брошена.
  npcs: []
  items:
  - cache_worm_roots
  - consumable_spares_abandoned
  - module_torpedo_plasma
  clues:
  - colony_left_in_hurry
  - armory_cache
  handouts: []
  encounters:
  - abandoned_bomber
  exits:
  - orbit
  checks:
  - id: salvage_warehouse
    description: >-
      Обшарить ангар и склады «Меридиана»: что осталось в заброшенных стеллажах
      и закрытых нишах.
    skill: engineering
    dc: 14
    difficulty: hard
    on_success:
      reveal:
      - armory_cache
      text: >-
        За фальш-панелью оружейной ниши — герметичный контейнер: плазменная торпеда ТП-1
        в транспортной обойме. Кто-то оставил её на чёрный день и не вернулся.
- id: planet_ore
  title: Рудная планета «Феррос»
  read_aloud: >-
    «Феррос» — серая скалистая груда с трещинами жил металла, выступающих на поверхность.
    На равнине лежит, полузанесённый песком, мобильный комбайн ЭК-77: шесть опор,
    бурильная установка, конвеер для подачи руды в грузовой отсек, модуль обогащения руды,
    кабина с запотевшими иллюминаторами. Машина ждёт, пока её включат.
  dm_notes: >-
    Здесь решается судьба стали колонии. Мобильный комбайн ЭК-77 (предмет
    module_harvester) разблокирован, но обесточен: проверка jumpstart запускает его
    от бортовой сети корабля. Доставка комбайна на «Феррос» и запуск — fact
    harvester_deployed, +1 к Готовности обороны. Комбайн начинает добычу концентрата
    (clue ore_rich_veins); вывоз — транспортниками, строительство металлургического
    комбината ведётся вручную ведущим по журналу, автоматической симуляции нет.
    grant_item cache_ore_concentrate как первый трюм руды. Обратно на орбиту.
  npcs: []
  items:
  - module_harvester
  - cache_ore_concentrate
  clues:
  - ore_rich_veins
  handouts: []
  encounters: []
  exits:
  - orbit
  checks:
  - id: jumpstart
    description: >-
      Разблокировать и запустить комбайн ЭК-77: обход обесточенных контуров через
      бортовую сеть корабля.
    skill: engineering
    dc: 14
    difficulty: hard
    on_success:
      reveal:
      - ore_rich_veins
      text: >-
        Комбайн встаёт на опоры, бурильная установка запускается, и первая порода
        сходит на конвейер — жила богаче, чем рассчитывали. «Феррос» даст сталь на годы.
- id: colony_friendly
  title: Дружественная колония «Аврора»
  read_aloud: >-
    «Аврора» гнездится в каньоне: террасы полей, маленькие теплицы, старый фрегат
    на стапеле, который жители чинят двенадцать лет. Комендант колонии Лина встречает
    у шлюза сама: «Три военных корвета за раз — или у вас праздник, или у вас беда.
    Заходите, чай есть, новостей — больше».
  dm_notes: >-
    Союзная колония, демографически крепкая, но без боевых кораблей. Лина согласна
    заключить патрульный договор — их старый фрегат будет дозорить сектор. Проверка
    negotiate (СЛ 13): успех — договор сразу, set_npc_attitude friendly (уже friendly),
    note_fact patrol_secured, +1 к Готовности; провал — Лина сомневается, договор
    возможен позже при дополнительном аргументе (второй попыткой или после спасения
    «Арго» — тот грузится из «Авроры»). Торговля: grant_item cache_vegetables
    (подарок) и покупка запчастей (3 единицы по журналу, spares уходят на базу —
    учитывайте в счёт fact spares_delivered). Обратно на орбиту.
  npcs:
  - harbormaster_lina
  items:
  - cache_vegetables
  clues:
  - patrol_deal
  handouts:
  - trade_offer
  encounters: []
  exits:
  - orbit
  checks:
  - id: negotiate_patrol
    description: >-
      Заключить с «Авророй» патрульный договор: их фрегат выйдет в дозор,
      колонии обмениваются сигналами тревоги.
    skill: negotiate
    dc: 13
    difficulty: medium
    on_success:
      reveal:
      - patrol_deal
      text: >-
        Лина жмет руку: «Фрегат "Тритон" выйдет в дозор через неделю. Теперь ваши беды —
        и наши беды». Патруль заключён.
    on_failure:
      text: >-
        Лина качает головой: «Сначала покажите, что ваши корабли реальная сила, а не
        громкая посуда». Договор отложен — вернитесь с аргументом.
- id: distress_signal
  title: Сигнал бедствия
  read_aloud: >-
    Источник сигнала — транспортник «Арго», повреждённый и дрейфующий. Рядом,
    описывая круги, двое штурмовиков рвут его бока, а позади темнеет толстый силуэт
    бомбардировщика. Из рации — голос: «Корветы, если слышите: груз — семена и
    лекарства для Авроры. Мы почти целы. Поторопитесь».
  dm_notes: >-
    Событие спасения. Тактика из замысла: успеть перебить червей раньше, чем добьют
    «Арго». start_combat encounter distress_fight (2 storm_worm + 1 bomber_worm);
    «Арго» ходит в конце раунда (ведущий снимает ему 2 целостности за раунд боя).
    Если транспортник выжил — он благодарит, доставляет груз на «Аврору» и остаётся
    служить колонии: note_fact transport_saved, +1 к Готовности (clue transport_saved).
    Проверка emergency_repair снимает с него угрозу разгерметизации до боя. Поражение
    — «Арго» погибает, очко теряется навсегда. Обратно на орбиту.
  npcs: []
  items: []
  clues:
  - transport_saved
  handouts: []
  encounters:
  - distress_fight
  exits:
  - orbit
  checks:
  - id: emergency_repair
    description: >-
      Срочный ремонт «Арго» до начала боя: заткнуть пробоину извне, стабилизировать
      корпус, пока черви не добили.
    skill: engineering
    dc: 12
    difficulty: medium
    on_success:
      text: >-
        Пробоина заглушена аккуратным использованием боевого лазера, он расплавил
        края пробоины и они спаялись загерметизировав корпус: «Арго» перестаёт
        терять целостность с каждым раундом и держится до конца боя.
- id: pirate_outpost
  title: Пиратский аванпост «Гарпун»
  read_aloud: >-
    Аванпост «Гарпун» пришвартован к якорному астероиду: гирлянды из обломков кораблей,
    клеймо «Гарпун» на каждом. Из рации — хриплый смех: «Смотрите, домоседы прилетели
    за своими овощами. Ребята, поднимайте скиммеры!» — и с двух стартовых полок
    срываются пиратские скиммеры.
  dm_notes: >-
    Пираты всегда враждебны: set_npc_attitude hostile, start_combat encounter
    pirate_ambush (2 pirate_skiff). После победы — разграбить базу (grant_item):
    module_torpedo_plasma_pirate (1 торпеда), consumable_spares_pirate_1 и
    consumable_spares_pirate_2 (2 ящика) и находка акта —
    module_fireship «Факел»: отделяемый модуль, врезается в червя и взрывается,
    2d6 за каждую единицу массы взрывчатки (у найденного брандера — 3 единицы, итого
    6d6); летит медленно, его можно сбить — ведущий решает вручную. Одноразовый.
    Проверка loot_search находит трюм с овощами украденных транспортников
    (grant_item cache_vegetables_pirate_1 и cache_vegetables_pirate_2, +2 к учёту
    груза). Обратно на орбиту.
  npcs: []
  items:
  - module_torpedo_plasma_pirate
  - module_fireship
  - consumable_spares_pirate_1
  - consumable_spares_pirate_2
  - cache_vegetables_pirate_1
  - cache_vegetables_pirate_2
  clues:
  - pirate_cache
  handouts: []
  encounters:
  - pirate_ambush
  exits:
  - orbit
  checks:
  - id: loot_search
    description: >-
      Обшарить склады аванпоста после боя: что пираты награбили за годы рейдов.
    skill: scanning
    dc: 13
    difficulty: medium
    on_success:
      reveal:
      - pirate_cache
      text: >-
        В герметичном трюме — грузы с захваченных транспортников: ящики овощей под
        гербом Теплицы, чужие семена, два ящика запчастей. Возвращайте всё домой.
- id: muster_defense
  title: Штаб обороны — сбор и отчёт
  read_aloud: >-
    Совет колонии собирается в ангаре, у доски с оборонным планом. Три купола Теплицы
    светятся за бронированными стеклами. Механики ставят последние кресты на схемах
    сектора. Старший советник поднимает глаза: «Пилоты. Докладывайте. От вашего отчёта
    зависит, будем ли мы готовы, когда прилетят все».
  dm_notes: >-
    Финальная сцена акта. Ведущий считает Готовность обороны по журналу и facts:
    обязательные — training_fight_won и roots_delivered; очки — harvester_deployed,
    transport_saved, patrol_secured, spares_delivered (≥6 единиц запчастей на базе).
    note_fact defense_readiness с итоговым числом. При 6+ — акт завершён, колония
    встречает волны; меньше 6 — ведущий объявляет о нехватке и позволяет добрать очки
    (сцены сектора ещё открыты). Опциональное испытание: у края системы замечен юный
    Линкор — start_combat encounter linor_heads (6 голов, полноценный «Линкор = 6 мобов»;
    победа даёт уважение сектора и шлейф славы, но не требуется для победы этапа).
    Проверка final_report оформляет отчёт совету.
  npcs: []
  items: []
  clues:
  - readiness_points
  handouts: []
  encounters:
  - linor_heads
  exits:
  - orbit
  - launch
  checks:
  - id: final_report
    description: >-
      Сводный отчёт совету колонии: итоги разведки, добычи и договоров, план обороны
      на случай волн атак.
    skill: command
    dc: 13
    difficulty: medium
    on_success:
      reveal:
      - readiness_points
      text: >-
        Совет слышит каждое число и каждое название: «Меридиан», «Феррос», «Аврора»,
        «Арго». Когда доска заполнена, старший советник объявляет Готовность обороны.
npcs:
- id: vera
  name: Вера, хозяйка гостиницы
  description: >-
    Сухая женщина средних лет с обожжёнными руками бывшего техника Теплицы. Держит
    «У последнего причала» — единственную гостиницу колонии.
  personality: >-
    Говорит коротко, смотрит в глаза. Верит, что колония выстоит, если никто не паникует.
    Помнит каждого, кто прилетел и не улетел.
  secrets:
  - "Слышала по внутреннему каналу: система раннего оповещения засекла одного червя, сигнал подтверждён."
  - "Если спросить о бегстве с Земли — расскажет про последний конвой: переполненные трюмы, кокон, смыкающийся за кормой, и кто не успел на борт."
  - "Бывший техник Теплицы: знает все три купола наизусть и объяснит, почему ящик перца здесь стоит ящика запчастей — и что будет с колонией, если купола падут."
  - "Её брат остался на Земле, когда кокон сомкнулся; расскажет, что Черви делают с планетой и почему воду здесь берегут пуще жизни."
  - "Если спросить о «Меридиане» — знает, что колония замолчала семь лет назад после пиратского рейда."
  attitude: friendly
  home: hotel_room
- id: nav_operator_dan
  name: Дан, диспетчер навигационного поста
  description: >-
    Молодой диспетчер в наушниках, окружённый голографической картой сектора.
    Пьёт кофе литрами, чешет затылок, когда нервничает.
  personality: >-
    Болтлив, точен, гордится, что держит в голове все маяки сектора. Мечтает когда-нибудь
    полетать сам.
  secrets:
  - "Знает, что маяк «Меридиана» семь лет назад передал обрывок — «уходим, они за нами» — и замолк."
  - "Если спросить о сигнальной сети — объяснит, как дозорные купола и старые маяки следят за небом, и что сирена молчала двенадцать лет — до сегодняшней ночи."
  - "Подозревает, что пираты «Гарпуна» следят за колонией через взломанный старый маяк; если спросить, расскажет их нрав и тропу."
  - "При удачной расшифровке журналов покажет тропу к «Гарпуну» и отметку «Меридиана»."
  attitude: friendly
  home: nav_post
- id: harbormaster_lina
  name: Лина, комендант Авроры
  description: >-
    Широкоплечая женщина с седой косой, встречает гостей у шлюза лично. Командует
    старым фрегатом «Тритон», который колония чинит двенадцать лет.
  personality: >-
    Прямая, с юмором, ценит конкретику. Не доверяет обещаниям — доверяет свершениям.
  secrets:
  - "«Аврора» крепка людьми, но без боевых кораблей; патрульный договор им нужен не меньше, чем «Десперадосу»."
  - "Груз «Арго» — семена и лекарства для них; если «Арго» погибнет, поля пострадают."
  - "Тайно торгует с ещё двумя колониями; не расскажет, пока не увидит, что «Десперадос» — сила."
  - "Если спросить о Червях — скажет, что те идут туда, где вода, и что на её полях их уже видели."
  attitude: friendly
  home: colony_friendly
- id: botanist_issa
  name: Исса, ботаник Теплицы
  description: >-
    Молодая учёная из лаборатории Теплицы: мятый халат, пробирки в карманах, вечно
    что-то записывает в планшет. Под тревогу прибежала в гостиницу — ближе к куполам.
  personality: >-
    Говорит быстро и сбивчиво, бережёт образцы как детей. Верит в цифры, а не в героев,
    и панически боится за банк семян.
  secrets:
  - "Расскажет про Теплицу: три купола, банк семян и почему овощи здесь дороже металла."
  - "Знает биологию Червей: вода, кокон, личинки; объяснит, почему Черви идут именно сюда и чего ждать от Линкора."
  attitude: friendly
  home: hotel_room
- id: veteran_yann
  name: Янн, старый пилот конвоя
  description: >-
    Седой пилот в выцветшей куртке эвакуационного флота. Сидит в углу общей залы,
    крутит в пальцах старую полётную карточку.
  personality: >-
    Молчалив, отвечает нехотя, но если разговорить — говорит долго и точно. Никуда
    не спешит: всё, что было, он уже пережил.
  secrets:
  - "Если спросить о бегстве — расскажет про последний конвой с Земли: что видел за кормой и кого потерял."
  - "Знает, как драться с Червём: бей в сегменты, а не в голову, и не давай окружить."
  attitude: friendly
  home: hotel_room
- id: mechanic_rig
  name: Риг, старший механик ангара
  description: >-
    Кряжистый механик с перепачканными маслом руками и сварочной маской на затылке.
    Командует сменой, что готовит корветы к вылету.
  personality: >-
    Грубоват, немногословен, но каждый борт знает лучше родных. Уважает тех, кто сам
    лезет в двигатель, а не ждёт, пока починят.
  secrets:
  - "Знает характер каждого корабля: «Пульсар» тянет вправо, «Мираж» капризен на пуске, «Гефест» тянет всю тяжёлую работу."
  - "Может выдать ящик запчастей сверх нормы — если увидит, что экипаж дело знает."
  attitude: friendly
  home: hangar
- id: loader_zu
  name: Зу, кладовщица склада запчастей
  description: >-
    Невысокая жилистая кладовщица с планшетом учёта и вечным карандашом за ухом.
    Ведает складом запчастей и помнит каждую единицу наизусть.
  personality: >-
    Остра на язык, любит поговорить, пока грузит. Не отдаст ни одной гайки без учётной
    печати, но за добрый слух может подсказать, где что лежит.
  secrets:
  - "Знает всё, что есть на складе, и все слухи: кто что привёз, кто что спрятал."
  - "Слышала, что пираты «Гарпуна» скупают запчасти через посредников — кому-то на базе это выгодно."
  attitude: friendly
  home: hangar
- id: watch_operator_mira
  name: Мира, оператор дозорного купола
  description: >-
    Усталая женщина в наушниках у пульта дозорного купола. Первая в колонии увидела
    червя на радаре и подняла тревогу.
  personality: >-
    Точна до минуты, говорит тихо, но по делу. Двенадцать лет ждала этой ночи — и всё
    равно оказалась к ней не готова.
  secrets:
  - "Расскажет, как устроена сигнальная сеть: дозорные купола, старые маяки, двенадцать лет ложных тревог — и почему сегодня сигнал настоящий."
  - "Помнит точное время и курс, каким червь вошёл в сектор; подскажет, откуда ждать волн."
  attitude: friendly
  home: nav_post
