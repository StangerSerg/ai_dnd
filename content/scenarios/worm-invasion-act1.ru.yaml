- id: colony_armory
  title: Оружейная ниша «Меридиана»
  read_aloud: >-
    За фальш-панелью — тесная ниша, выложенная звукопоглощающими плитами. На ложе
    из пенопласта стоит герметичный контейнер с печатью квартермейстера: торпедный
    аппарат ТП-1 и плазменная торпеда в транспортной обойме. Семь лет пломба держала
    влажность; внутри — сухая смазка и нетронутые крепления.
  dm_notes: >-
    Торпедная пара выдаётся ТОЛЬКО вместе: grant_item module_torpedo_plasma и
    grant_item consumable_torpedo_plasma (аппарат + 1 торпеда). В случайный reveal
    их не класть — rng.choice выдаст один предмет и разорвёт пару. Два пути вскрытия,
    оба чека — только текст: crack_armory_seal (engineering dc 13) без горелки;
    heat_seal (engineering dc 10) — ТОЛЬКО если у партии есть горелка tool_burner
    (сверься с инвентарём в контексте; без горелки откажи и подскажи поискать её
    в ангаре — чек search_hangar). После ЛЮБОГО успешного вскрытия выдайте оба
    предмета пары один раз; провал пломбу не ломает, повтор разрешён. Повторное
    вскрытие уже открытого контейнера не нужно. Пиратская пара ТП-1 — отдельная
    находка аванпоста «Гарпун», не смешивать. Обратно в ангар.
