- id: colony_mine_gate
  title: Шахтный ствол «Меридиана»
  read_aloud: >-
    Оголовок шахты торчит из скалы, как обглоданная кость: копёр покосился, клеть
    стоит на весу в раскрытом стволе. Внизу — темнота, в которой угадываются
    лестничный марш и рельсы узкоколейки. Ветер из ствола тянет холодом и машинным
    маслом; где-то глубоко капает вода.
  dm_notes: >-
    Вход в шахту. Чек secure_lift — нарративный: успех описывает спуск на клети,
    провал — спуск по лестничному маршу (никаких автоматических повреждений и
    списаний; риск и давление времени — только наррация ведущего). Спуск ведёт
    на уровень colony_mine_deep. Обратно к терминалу.
  npcs: []
  items: []
  clues: []
  handouts: []
  encounters: []
