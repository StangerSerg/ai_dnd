    1 запчасть = 5 целостности. Каждые 6 доставленных единиц — очко Готовности обороны.
  visibility: public
- id: module_torpedo_plasma
  name: Плазменная торпеда ТП-1
  description: >-
    Редкое тяжёлое оружие. Урон 2d10 плюс бонус наводки (в записи d20, среднее 10.5);
    выбрана запись 2d10 ради стабильности: d20 ломала бы баланс против 20-очковых
    бомбардировщиков из-за критического удвоения костей при 20. Расход: torpedoes -1.
  visibility: public
- id: module_torpedo_plasma_pirate
  name: Плазменная торпеда ТП-1
  description: >-
    Редкое тяжёлое оружие. Урон 2d10 плюс бонус наводки (в записи d20, среднее 10.5);
    выбрана запись 2d10 ради стабильности: d20 ломала бы баланс против 20-очковых
    бомбардировщиков из-за критического удвоения костей при 20. Расход: torpedoes -1.
  visibility: public
- id: module_fireship
  name: Брандер «Факел»
  description: >-
    Одноразовый отделяемый модуль: врезается в червя и взрывается. Урон 2d6 за каждую
    единицу массы взрывчатки (у найденного — 3, итого 6d6). Летит медленно — его можно
    сбить до контакта. В v0.2 — одноразовый предмет слота payload.
  visibility: public
- id: module_harvester
  name: Мобильный комбайн ЭК-77
  description: >-
    Шестиопорный горный комбайн: раскопки и обогащение руды. Доставка на «Феррос» и запуск
    дают очко Готовности обороны и открывают добычу концентрата для будущих грузовых кораблей.
  visibility: public
- id: cache_worm_roots
  name: Корни тепличных растений
  description: >-
    Уцелевшие корни из заброшенной теплицы «Меридиана». Доставка домой и посадка в Теплице —
    обязательное условие этапа: новые гряды овощей.
  visibility: public
- id: cache_vegetables
  name: Ящик овощей Теплицы
  description: >-
    Герметичный ящик: помидоры, перец, зелень. Главная валюта выживших. Пополняет
    общеколониальный запас и украшает любые переговоры.
  visibility: public
- id: cache_vegetables_pirate_1
  name: Ящик овощей Теплицы
  description: >-
    Герметичный ящик: помидоры, перец, зелень. Главная валюта выживших. Пополняет
    общеколониальный запас и украшает любые переговоры.
  visibility: public
- id: cache_vegetables_pirate_2
  name: Ящик овощей Теплицы
  description: >-
    Герметичный ящик: помидоры, перец, зелень. Главная валюта выживших. Пополняет
    общеколониальный запас и украшает любые переговоры.
  visibility: public
- id: cache_ore_concentrate
  name: Концентрат руды
  description: >-
    Первая порода с комбайна: обогащённый концентрат с «Ферроса». Сырьё для стали
    и будущего металлургического комбината.
  visibility: public
clues:
- id: siren_reason
  text: "Сирена не учение — подтверждённый контакт: система раннего оповещения засекла червя на подходе к колонии."
  visibility: dm
- id: airfield_ready
  text: "Ангар выдал добро: корабли в строю, при успешной диагностике без скрытых повреждений."
  visibility: dm
- id: takeoff_rules
  text: "Правило взлёта: каждая тонна груза — -1 к броску пилотирования; маршевые двигатели дают проброс."
  visibility: dm
- id: worm_debris
  text: "Обломки штурмовиков: плотная слизистая оболочка, пустотелый сегментированный скелет."
  visibility: dm
- id: distress_coordinates
  text: На границе дальности сектора — автоматический сигнал бедствия гражданского транспортного протокола.
  visibility: dm
- id: pirate_hint
  text: "Журналы поста держат тропу пиратов «Гарпуна»: гравитационная тень «Эола» и точка без маяков."
  visibility: dm
- id: scorch_nothing
  text: "«Гелиос» давно отдал всё летучее звезде: добывать нечего, планета — мёртвая граница сектора."
  visibility: dm
- id: gas_storm_cycles
  text: Бури «Эола» стихают каждый оборот пояса на семь минут — окно для чтения сенсоров и засад.
  visibility: dm
- id: colony_left_in_hurry
  text: "«Меридиан» покинули сами и поспешно: часть техники брошена, оружейная ниша за фальш-панелью."
  visibility: dm
- id: armory_cache
  text: В оружейной нише «Меридиана» — герметичный контейнер с плазменной торпедой ТП-1.
  visibility: dm
- id: ore_rich_veins
  text: "Жилы «Ферроса» богаче расчётных: комбайн даст концентрат на годы, хватит на сталь и корпуса."
  visibility: dm
- id: patrol_deal
  text: "Патрульный договор с «Авророй» заключён: фрегат «Тритон» выйдет в дозор, сигналы тревоги общие."
  visibility: dm
- id: transport_saved
  text: "Транспортник «Арго» спасён: груз доставлен на «Аврору», корабль остаётся служить колонии."
  visibility: dm
- id: pirate_cache
  text: "В трюме «Гарпуна» — награбленные грузы транспортников: овощи Теплицы, семена, запчасти."
  visibility: dm
- id: readiness_points
  text: >-
    Готовность обороны: обязательные (бой на орбите выигран, корни доставлены) плюс очки
    за комбайн, спасённый транспортник, патруль «Авроры» и ≥6 запчастей на базе.
  visibility: dm
handouts:
- id: evacuation_photo
  title: Фотография эвакуационного конвоя
  text: >-
    Снимок с борта одного из последних кораблей с Земли: плотный строй транспортов,
    и за кормой — планета, опутанная бледной слизистой сетью кокона. На обороте выведено
    пером: «Мы вернёмся». Подпись обтёрта до неразборчивости.
  visibility: public
- id: defense_plan
  title: Оборонный план колонии «Десперадос»
  text: >-
    Сводный план совета колонии. Цель акта: ГОТОВНОСТЬ ОБОРОНЫ 6 ОЧКОВ.
    Обязательные условия: 1) обучающий бой на орбите выигран; 2) корни тепличных
    растений доставлены в Теплицу. Очки, по одному за каждое: 3) мобильный комбайн
    доставлен на «Феррос» и запущен; 4) транспортник «Арго» спасён; 5) патрульный
    договор с «Авророй» заключён; 6) не менее 6 единиц запчастей доставлено на базу.
    Итог: 2 обязательных + 4 возможных = 6. Меньше 6 — оборона не готова.
  visibility: public
- id: sector_chart
  title: Карта сектора «Десперадос»
  text: >-
    Шесть тел: домашняя планета; «Гелиос» — раскалённый мир у звезды; «Эол» — газовый
    гигант с грозовыми поясами; «Меридиан» — покинутая колония; «Феррос» — рудная планета;
    «Аврора» — дружественная колония. На границе дальности — неопознанный маяк.
  visibility: public
- id: trade_offer
  title: Торговое предложение «Авроры»
  text: >-
    Листок от коменданта: «Меняем зерно и полевую медицину на запчасти и сталь.
    Патрулируем вместе — живём вдвое дольше. Овощи Теплицы принимаем как полноценную
    плату, не стесняйтесь».
  visibility: public
encounters:
- id: orbit_training_fight
  title: "Обучающий бой: три штурмовика"
  description: >-
    Три storm_worm снижаются к куполам Теплицы. Умение protect штурмовика раскрывается
    здесь: принять атаку на себя вместо купола или союза. Победа — обязательное условие
    этапа (note_fact training_fight_won).
  creatures:
  - statblock: storm_worm
    count: 3
    name: Штурмовик
- id: abandoned_bomber
  title: Бомбардировщик над «Меридианом»
  description: >-
    Толстый короткий червь-«бочка» кружит над колонией и атакует, как только корабли
    входят в нижнюю атмосферу или задерживаются. Можно избежать быстрой работой
    на поверхности — но за добычей придётся драться.
  creatures:
  - statblock: bomber_worm
    count: 1
    name: Бомбардировщик
- id: gas_ambush
  title: Засада в грозах «Эола»
  description: >-
    Два sniper_worm сидят в электрических бурях пояса: жала-«кобры» бьют точно
    и на дальнюю дистанцию. Читающие карту бурь (gas_storm_cycles) замечают их
    раньше — первая атака червей с помехой.
  creatures:
  - statblock: sniper_worm
    count: 2
    name: Снайпер
- id: distress_fight
  title: Спасение «Арго»
  description: >-
    Два storm_worm добивают транспортник, bomber_worm подтягивается сзади. Каждый
    раунд боя «Арго» теряет 2 целостности, пока emergency_repair не заглушит
    пробоину. Транспортник выжил — очко Готовности (transport_saved).
  creatures:
  - statblock: storm_worm
    count: 2
    name: Штурмовик
  - statblock: bomber_worm
    count: 1
    name: Бомбардировщик
- id: pirate_ambush
  title: Скиммеры «Гарпуна»
  description: >-
    Два pirate_skiff срываются со стартовых полок аванпоста: кинетические автопушки
    и по две ракеты каждый. Пираты дерутся жадно и дерзко, при половине целостности
    пытаются уйти в грозовой шлейф «Эола».
  creatures:
  - statblock: pirate_skiff
    count: 2
    name: Пиратский скиммер
- id: linor_heads
  title: "Юный Линкор: шесть голов"
  description: >-
    Опциональное испытание у финала акта. Линкор — клубок змей, бьющий шестью головами
    сразу: полноценная механика «Линкор = 6 мобов», каждая голова — самостоятельный
    участник (linor_head, 18 целостности, жало 1d6). Головы 20 — критический урон сносит
    сразу. Победа не нужна для этапа; поражение — отступление, а не гибель.
  creatures:
  - statblock: linor_head
    count: 6
    name: Голова Линкора
lore:
- id: worms_background
  title: Черви
  text: >-
    Черви свободно живут в космосе: находят планеты с водой, оплетают их коконом
    из слизи, выводят потомство и уходят, когда вода кончается. Колонизатор способен
    убить мир за годы; Линкоров лучше избегать; против Кокона обычное оружие бессильно.
  visibility: public
- id: greenhouse_value
  title: Почему овощи — валюта
  text: >-
    Большинство планет непригодны для земного сельского хозяйства, животных сохранить
    не удалось. Единственная Теплица колонии даёт овощи с огромными затратами; на
    планетах с умеренным климатом растут местные травы, но не гряды. Ящик перца
    стоит как ящик запчастей.
  visibility: public
- id: torpedo_briefing
  title: "Брифинг: плазменные торпеды"
  text: >-
    Торпеда ТП-1 — редкое тяжёлое оружие, находится у пиратов и в брошенных ангарах.
    В оригинальной записи урон d20 (среднее 10.5), но при критических правилах сектора
    (удвоение костей при 20 на атаке) d20 ломала бы баланс: одна торпеда гарантированно
    убивала бы бомбардировщика. Принята запись 2d10 (среднее 11): тот же класс урона,
    стабильнее, не превращает находку в «кнопку победы». Попадание — бонус наводки
    против КД; промах при 1 на кости.
  visibility: public
- id: linor_tactic
  title: "Тактика: как драться с Линкором"
  text: >-
    Линкор бьёт шестью головами по 1d6, точен и живуч. Головы отстреливаются по одной:
    сосредоточенный огонь одной головы облегчает бой надёжнее, чем рассеянный по всем.
    Юные Линкоры держатся на краю системы и не преследуют уходящих.
  visibility: dm
