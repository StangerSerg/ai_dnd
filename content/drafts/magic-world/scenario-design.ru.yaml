# Авторский дизайн-черновик. Это НЕ runtime Scenario schema и не исполняемые гейты.
draft_format_version: 1
id: magic-world
title: magic_world
language: ru
status: authorial_source_with_local_runtime_adaptation
published: false
source_ref: source.ru.txt
runtime_schema: false
runtime_adaptation_ref: ../../scenarios/magic-world.ru.yaml
runtime_adaptation_note: "Играбельная локальная v0.2 адаптация с ограниченной точечной боевой магией, авторским заданием о канале для нагов и условными финалами; не полная реализация магической системы и не публикация."
runtime_recovery_delta: "Водное лечение: дополнительное решение пользователя 25.11.2026 для v0.2. Третья активная стартовая форма вместо пассивного Ледяного щита в наборе активных; вне боя лечит себя или союзника через существующий heal skill без ограничения применений и расхода ресурса по уточнению пользователя 26.11.2026. Авторский исходник с 15 заклинаниями не изменён; этот пункт не объявляет в нём шестнадцатое заклинание."
premise:
  - "Мир создан магией и пронизан ею; каждый владеет магией так или иначе. Сражения магические, привычных воинов и мечей нет."
  - "Наёмники могут служить обоим магам одновременно. Формально те конкуренты и не требуют явного выбора стороны."
  - "Лукан стремится к открытому господству; Фростмар скрывает такое же желание власти за изучением и защитой мира."
  - "Мир и драконы не нуждаются в боге; изгнание магов автор считает наиболее благоприятным исходом."
locations:
  - id: ice_continent
    name: Ледяной материк
    kind: continent
    description: "Длинный, вытянутый, почти у полюса; ледяные тролли, белые медведи, пингвины, моржи. В сердце — белый ледяной дракон. Местные враждебны чужакам."
  - id: fire_continent
    name: Огненный материк
    kind: continent
    description: "Обширный центральный материк с джунглями, пустыней и вулканом; гоблины, орки, элементали огня, виверны. Красный дракон удерживает вспыльчивых жителей в хрупком равновесии."
  - id: water_continent
    name: Водный материк
    kind: continent
    description: "Небольшой, на другой стороне от огненного; провинции нагов, гигантские черепахи, морские змеи. В прилегающих водах акулы, морские коровы, скаты и медузы. Синий змееобразный Кирин хранит тайны мироздания."
  - id: ocean
    name: Океан между материками
    kind: region
    description: "Путь нагов и орков; место их столкновения и битвы Кирина с красным драконом."
  - id: fire_volcano_cave
    name: Пещера под вулканом
    kind: site
    parent: fire_continent
    description: "Здесь находится камень силы и гигантские саламандры, питающиеся подземным огнём и силой камней. Автор указывает обойти их: победить невозможно."
  - id: force_stones
    name: Камни силы / камни мира
    kind: magical_site
    parent: fire_continent
    description: "Энергоинформационная сущность, связанная с жизнью жителей материка и климатом планеты. Вражда вызывает катаклизмы; мирная жизнь — спокойную погоду. Сильное нарушение равновесия может расколоть мир. Один камень наблюдают в пещере под вулканом."
  - id: water_crystals
    name: Кристаллы силы водного материка
    kind: magical_site
    parent: water_continent
    description: "Подпитывают влияние Кирина на водную стихию. Кирин может дать безопасный для других осколок, пригодный только для изучения."
  - id: frostmar_tower
    name: Башня Фростмара
    kind: tower
    description: "Фростмар говорит, что не покидает башню из-за опасности возмутить магию; истинная причина просьбы к героям — нежелание самому вызвать подозрение Кирина. Местоположение не указано."
npcs:
  - id: lucan
    name: Лукан
    location_refs: []
    role: "Маг огня; горячий, властолюбивый, желает подчинить мир и подпитать собственную силу."
    secret: "Стравливает Кирина и красного дракона, чтобы подчинить ослабевших драконов и затем белого дракона."
  - id: frostmar
    name: Фростмар
    location_refs: [frostmar_tower]
    role: "Маг льда; спокойный, дружелюбный, эмпатичный на вид исследователь и защитник мира."
    secret: "Стремится получить прямую власть над магией мира через камни силы и стать его богом. Ложь о неподвижности в башне прикрывает обращение к Кирину через героев."
  - id: kirin
    name: Кирин
    location_refs: [water_continent]
    role: "Синий змееобразный водный дракон, хранитель тайн."
    knowledge_initial: "Проницательно видит, что Лукан пытается стравить его с красным драконом, но не понимает цели Лукана и полного плана Фростмара. Не раскрывает тайны сам и не даёт героям готовой разгадки."
    knowledge_after_evidence: "Выслушав самостоятельные наблюдения героев, связывает ледяных тварей, амулет и камни с планом Фростмара; допускает, что осколок невольно дал недостающий элемент ритуала."
  - id: red_dragon
    name: Красный пламенный дракон
    location_refs: [fire_continent]
    role: "Магией удерживает огненный материк от междоусобной большой войны."
  - id: white_dragon
    name: Белый ледяной дракон
    location_refs: [ice_continent]
    role: "Обитает в сердце ледяного материка; гневается после столкновений героев с местными."
  - id: red_skull_chief
    name: Вождь клана Красный череп
    location_refs: [fire_continent]
    role: "Глава сильнейшего клана орков; Лукан хочет сделать его послушным."
  - id: naga_commander
    name: Командир нагов
    location_refs: [water_continent]
    role: "В сражении с орками может сообщить героям, что защищал берег, а не готовил нападение."
factions:
  - id: nagas
    location_ref: water_continent
    description: "Провинциальные кланы по законам, подобным бусидо; охраняют границы, иногда сталкиваются и мирятся. Охота на морских коров им безразлична."
  - id: orcs
    location_ref: fire_continent
    description: "Кланы спорят, кто возглавит поход против вытесняющих их виверн; мелкие стычки пока не нарушают камни."
  - id: ice_creatures
    location_ref: ice_continent
    description: "Местные ледяные твари, которыми Фростмар предлагает управлять через амулет. Их точный состав и механизм управления не определены."
fact_registry:
  # Идемпотентные повествовательные записи о произошедшем, а не флаги программного движка.
  - {id: cows_hunted, meaning: "Герои добыли десять туш морских коров для Лукана."}
  - {id: kirin_warned_of_carnage, meaning: "Лукан использовал кровь побережья, чтобы внушить Кирину подозрение к оркам."}
  - {id: red_skull_chief_confronted, meaning: "Герои столкнулись с вождём Красного Черепа по поручению Лукана; результат не предрешён."}
  - {id: nagas_studied, meaning: "Герои общались с рядовыми нагами и узнали об их жизни и целях."}
  - {id: kirin_shard_received, meaning: "После помощи Кирину герои получили безопасный осколок для изучения."}
  - {id: orc_dispute_investigated, meaning: "Герои узнали о вивернах и настоящей причине спора орков."}
  - {id: force_stone_observed, meaning: "Герои наблюдали реакцию камня в пещере под вулканом."}
  - {id: naga_raid_fought, meaning: "Герои и орки столкнулись с нагами на водном берегу."}
  - {id: naga_commander_heard, meaning: "Герои дали командиру нагов сказать, что он защищал берег."}
  - {id: naga_movement_reported, meaning: "Герои наблюдали перемещения нагов и доложили красному дракону."}
  - {id: naga_honor_expedition, meaning: "Наги отправились к огненному материку отстаивать честь после вылазки орков."}
  - {id: dragons_wounded, meaning: "Кирин и красный дракон сразились в океане и вернулись ранеными."}
  - {id: ice_encounter, meaning: "Герои вызвали гнев белого дракона, столкнувшись с местными."}
  - {id: frostmar_amulet_tested, meaning: "Герои проверили действие амулета контроля ледяных тварей."}
  - {id: ice_creatures_transferred, meaning: "Фростмар повёл управляемых ледяных тварей на огненный материк."}
  - {id: lucan_ritual_underway, meaning: "Лукан начал ритуал влияния на ослабевших драконов."}
  - {id: frostmar_ritual_underway, meaning: "Фростмар начал ритуал у камней силы."}
  - {id: heroes_reject_both, meaning: "Герои отказались исполнять поручения обоих магов."}
  - {id: kirin_briefed_on_both, meaning: "Герои самостоятельно сопоставили улики и изложили Кирину планы обоих магов."}
quests:
  - id: lucan_cows
    patron_ref: lucan
    location_refs: [water_continent]
    presentation: "Добыть десять туш морских коров якобы в подарок красному дракону, которому они якобы особенно нравятся."
    secret: "Предлог ложный. Лукан не охотится сам, чтобы не разозлить Кирина, а затем использует кровь у берега в своей провокации."
    fact_refs: [cows_hunted, kirin_warned_of_carnage]
    overlap: "Наги к охоте равнодушны; её последствия важны для Кирина и линии Фростмара."
  - id: lucan_red_skull
    patron_ref: lucan
    location_refs: [fire_continent]
    presentation: "Найти Красный череп и победить главаря, якобы для прекращения нападений орков."
    secret: "Лукану нужно подчинение главаря сильнейшего клана."
    fact_refs: [red_skull_chief_confronted, orc_dispute_investigated]
    overlap: "Фростмар предлагает сперва поговорить с другими вождями и узнать о вивернах."
  - id: lucan_naga_conflict
    patron_ref: lucan
    location_refs: [water_continent, fire_continent, ocean]
    presentation: "С орками выступить против якобы готовящих нападение нагов; затем наблюдать их движения и доложить красному дракону."
    secret: "Лукан подстрекает обе стороны, отдельно сообщая Кирину о вылазке орков и красному дракону о якобы намерениях Кирина."
    fact_refs: [naga_raid_fought, naga_commander_heard, naga_movement_reported, naga_honor_expedition, dragons_wounded]
    overlap: "Вывод героев из изучения нагов может опровергнуть версию Лукана до или после нападения. Предсмертная улика командира зависит от того, дали ли ему говорить."
  - id: lucan_ice_campaign
    patron_ref: lucan
    location_refs: [ice_continent]
    presentation: "Отправиться на ледяной материк. После нападений местных Лукан обещает защитить героев от белого дракона, когда два других восстановятся."
    secret: "Лукан скрывает враждебность местных, пока готовит ритуал влияния на раненых драконов и поход против белого."
    fact_refs: [ice_encounter, lucan_ritual_underway]
  - id: frostmar_naga_culture
    patron_ref: frostmar
    location_refs: [water_continent]
    presentation: "Изучить быт, цели и желания нагов через разговоры и небольшие поручения, без подсказки готового вывода."
    secret: "Герои сами выясняют, что наги заняты местными распрями, а не нападением на огненный материк."
    fact_refs: [nagas_studied]
    overlap: "Может идти параллельно охоте на коров и пропаганде Лукана."
  - id: frostmar_water_shard
    patron_ref: frostmar
    location_refs: [water_continent, water_crystals]
    presentation: "Изучить кристаллы, найти связь с Кирином и попросить один для Фростмара; помочь Кирину разрешить противоречия кланов нагов."
    secret: "Фростмар не хочет сам обращаться к проницательному Кирину. Кирин даёт лишь осколок, который не может причинить вреда и пригоден для изучения."
    fact_refs: [kirin_shard_received]
    unresolved: "Мирное поручение кланам, их противоречия и конкретная развязка автором не придуманы; не заполнять автоматически."
  - id: frostmar_orcs_stone
    patron_ref: frostmar
    location_refs: [fire_continent, fire_volcano_cave, force_stones]
    presentation: "При поручении Лукана о вожде поговорить с другими оркскими вождями; затем найти камень под вулканом и наблюдать его реакцию на мелкие стычки."
    secret: "Орков теснят виверны; каждый клан хочет вести поход. Красный дракон удерживает их от настоящей войны. Фростмар изучает связь камней с магией мира."
    fact_refs: [orc_dispute_investigated, force_stone_observed]
    overlap: "Дальше Фростмар временно отправляет героев за поручениями к Лукану, пока изучает осколок и создаёт артефакт."
  - id: frostmar_ice_amulet
    patron_ref: frostmar
    location_refs: [ice_continent, fire_continent, force_stones]
    presentation: "После вовлечения героев в конфликт орков и нагов испытать амулет контроля ледяных тварей и привести их на огненный материк якобы для защиты от нагов."
    secret: "Фростмар использует тварей как прикрытие ритуала у камней. В исходнике амулет действует; цена, предел и изготовление не определены."
    fact_refs: [frostmar_amulet_tested, ice_creatures_transferred, frostmar_ritual_underway]
    overlap: "Если герои сообщают Лукану, тот просит украсть амулет; это ещё одна улика использования героев обоими магами."
clues:
  - id: naga_commander_defense
    fact_ref: naga_commander_heard
    source_ref: naga_commander
    reveals: "Наги защищали берег, а не планировали первое нападение."
    availability: "Только если командир ещё способен говорить и герои позволяют ему высказаться."
  - id: naga_daily_life
    fact_ref: nagas_studied
    source_ref: nagas
    reveals: "Нагов занимают свои провинции и распри; у них нет изначального похода на огненный материк."
    availability: "Разговоры с рядовыми нагами и небольшие поручения; вывод делают сами герои."
  - id: orc_wyvern_dispute
    fact_ref: orc_dispute_investigated
    source_ref: orcs
    reveals: "Орки спорят о походе против виверн, что расходится с объяснением Лукана."
    availability: "Разговоры с другими вождями при поручении о Красном черепе."
  - id: stone_response
    fact_ref: force_stone_observed
    source_ref: force_stones
    reveals: "Камни связаны с равновесием мира; Фростмар изучает прямой путь к этой силе."
    availability: "Наблюдение в пещере под вулканом, обходя саламандр."
  - id: kirin_lucan_suspicion
    fact_ref: kirin_briefed_on_both
    source_ref: kirin
    reveals: "Кирин подозревает попытку Лукана стравить драконов, но не знает конечной цели и плана Фростмара."
    availability: "Герои сами приходят поговорить с Кирином; беседа не выдаёт всю разгадку."
  - id: frostmar_war_contradiction
    fact_ref: ice_creatures_transferred
    source_ref: frostmar
    reveals: "Фростмар предупреждает, что война пробудит опасные камни, и одновременно вводит ледяных тварей на огненный материк."
    availability: "Сопоставление его слов и поступка после предупреждения о плане Лукана."
  - id: lucan_amulet_request
    fact_ref: frostmar_amulet_tested
    source_ref: lucan
    reveals: "Услышав о ледяных тварях, Лукан требует украсть амулет; герои видят, что оба распоряжаются ими в собственных целях."
    availability: "Если герои рассказывают Лукану об амулете."
  - id: kirin_shard_inference
    fact_ref: kirin_briefed_on_both
    source_ref: kirin
    reveals: "После рассказа героев Кирин понимает возможную связь осколка с ритуалом Фростмара; это поздний вывод, а не его исходное знание."
    availability: "После того как герои сами связали планы обоих магов и вернулись за советом."
endings:
  - id: lucan_rules
    title: Господство Лукана
    narrative_conditions: "Лукан стравил и ослабил Кирина и красного дракона, получил над ними влияние, покорил белого дракона; Фростмар не успел завершить ритуал до этого."
    result: "Лукан объявляет себя господином мира. Под угрозой сил трёх драконов Фростмар подчиняется, раскрывает ритуал и больше не угрожает Лукану."
    relevant_fact_refs: [dragons_wounded, ice_encounter, lucan_ritual_underway]
  - id: frostmar_rules
    title: Господство Фростмара
    narrative_conditions: "Пока Лукан воюет, Фростмар успел провести ритуал с камнями раньше установления власти Лукана над драконами."
    result: "Драконы подчиняются Фростмару, прекращают войну и разводят существ по материкам. Лукан признаёт поражение и служит ему."
    relevant_fact_refs: [force_stone_observed, ice_creatures_transferred, frostmar_ritual_underway]
  - id: mages_exiled
    title: Изгнание обоих магов
    narrative_conditions: "Герои отказались от обоих покровителей, самостоятельно собрали и сопоставили улики, сообщили Кирину; тот объединил драконов."
    result: "Драконы изгоняют обоих магов. Герои становятся друзьями драконов и свободно путешествуют по всем землям."
    relevant_fact_refs: [heroes_reject_both, kirin_briefed_on_both]
  - id: world_destroyed
    title: Разрушение мира
    narrative_conditions: "Герои помогали обоим; Фростмар начал ритуал, Лукан узнал и атаковал его у камней до получения влияния над драконами."
    result: "Война магов пробуждает стихии у камней: извержения, землетрясения и бури уничтожают мир; все погибают."
    relevant_fact_refs: [frostmar_ritual_underway, lucan_ritual_underway]
intersection_policy:
  type: editorial_question
  statement: "Совместная работа героев на обоих магов допустима и сама по себе не выбирает финал. Общие факты фиксируются однократно. Исходник не определяет точные моменты завершения ритуалов, условия прерывания, приоритет при одновременной доступности исходов или реакцию мира на частичный успех. До авторского решения не вводить искусственную очередь либо автоматическое правило победы."
magic:
  elements_available_to_all: [water, air, fire]
  element_choice_required: false
  starting_spell_refs: [ice_shield, fire_arrow, ice_wind]
