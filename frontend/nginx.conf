# nginx для SPA AI DnD: статика + прокси /api и /ws на backend:8000.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Импорт сценариев принимает файлы до 5 МБ; запас на multipart-обвязку.
    client_max_body_size 32m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # REST API бэкенда. Путь сохраняется как есть (/api/...).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # WebSocket игровых столов: Upgrade-заголовки и длинные таймауты.
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Хешированные ассеты Vite можно кэшировать надолго.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html не кэшируем: иначе пользователи застрянут на старой сборке.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA: клиентский роутинг TanStack Router — любой путь отдаёт index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}